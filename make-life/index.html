// ----- Muskets -----
function giveMusket(h) {
  const u = h.userData;
  if (u.musket) { u.musket.visible = true; return u.musket; }
  const m = joint(u.j.elbows[0], 0, -0.32, 0.05);
  slab(m, woodMat, 0.08, 0.12, 0.6, 0, 0, 0.1);                       // the wooden stock
  spike(m, ironMat, 0.025, 0.9, V(0, 0.03, 0.35), V(0, 0, 1), 0.02);  // the iron barrel
  m.traverse(c => [].concat(c.material || []).forEach(bendMat));
  u.musket = m;
  return m;
}
function fireMusket(h, to, onHit) {
  const u = h.userData;
  h.updateMatrixWorld(true);
  const from = u.musket ? u.musket.localToWorld(V(0, 0.03, 1.25)) : h.position.clone().setY(h.position.y + 1.5);
  if (nearYou(h)) sfx.bang();
  flashAt(from, 1.2, 0.12);
  for (let i = 0; i < 5; i++) particle(from.clone(), 0xdddddd, V(rand(0.4), 0.6 + Math.random() * 0.5, rand(0.4)), 1.6); // a puff of gun smoke
  const ball = glowSprite(0.35), dur = Math.max(0.15, from.distanceTo(to) / 150);
  ball.material.color.setHex(0xffdd88);
  ball.position.copy(from);
  land.add(ball);
  let a = 0;
  fx(dt => { a += dt; ball.position.lerpVectors(from, to, Math.min(a / dur, 1)); if (a < dur) return true; land.remove(ball); if (onHit) onHit(); return false; });
}
function makeTarget(pos) { // a straw target on a post
  const g = new THREE.Group();
  g.position.copy(pos);
  spike(g, woodMat, 0.08, 1.3, V(0, 0, 0), UP, 0.08);
  const face = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.25, 16).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xd9c27a }));
  face.position.y = 1.9;
  g.add(face);
  const bull = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.27, 12).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xc0392b }));
  bull.position.y = 1.9;
  g.add(bull);
  addBent(g);
  return g;
}
function wobble(o) { let a = 0; fx(dt => { a += dt; o.rotation.z = Math.sin(a * 25) * 0.3 * Math.max(0, 1 - a / 0.8); return a < 0.8; }); }
const PRACTICE_LINES = ["Bullseye!", "Missed by a mile...", "So LOUD!", "Load, aim, fire!", "My ears are ringing!"];
ROLES.musketeer = h => {
  const u = h.userData;
  if (age.attack && !age.sunk) { // defend the beach, but muskets can't shoot that far
    const ship = ships.find(s => s.userData.sinking == null);
    if (!ship) return doAct(h, "look", 2);
    return doAct(h, "guard", 1.5, { to: shoreToward(shipDir, rand(30)), run: true, face: ship, patience: 30, next: () => {
      const short = h.position.clone().lerp(ship.position, 0.5).setY(0);
      fireMusket(h, short, () => splash(short));

    } });

  const target = musketTargets[u.slot % musketTargets.length];

function startMuskets() {

// ----- Ships -----
const hullMat = new THREE.MeshStandardMaterial({ color: 0x5b3a1e, flatShading: true }), deckMat = new THREE.MeshStandardMaterial({ color: 0x9a7a4e });
const sailMat = new THREE.MeshStandardMaterial({ color: 0xf2ead8, side: THREE.DoubleSide });
const SHIP_HULL = (() => { // a long box, pointed at the front, narrower underneath, with the front sweeping up
  const g = new THREE.BoxGeometry(5, 3.2, 18, 2, 2, 8), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i); const y = p.getY(i), z = p.getZ(i);
    if (z > 3) x *= 1 - (z - 3) / 6 * 0.85;
    if (y < 0) x *= 0.65;
    p.setX(i, x);
    if (z > 5 && y > 0) p.setY(i, y + (z - 5) * 0.25);
  }
  g.computeVertexNormals();
  return g;
})();
const SAIL_GEO = (() => { // a sail that bulges forward in the wind
  const g = new THREE.PlaneGeometry(6, 5.2, 6, 4), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setZ(i, (1 - (p.getX(i) / 3) ** 2) * 0.9 + (1 - (p.getY(i) / 2.6) ** 2) * 0.3);
  g.computeVertexNormals();
  return g;
})();
const CANNON_GEO = new THREE.CylinderGeometry(0.2, 0.28, 1.8, 8).rotateZ(Math.PI / 2);
function makeShip(flagColor) {
  const g = new THREE.Group(), u = { sails: [], cannons: [], phase: Math.random() * 7, speed: 7, heading: 0, target: null, face: null, sinking: null, nextShot: 0 };
  g.rotation.order = "YXZ"; // turn first, then tip forward and roll (needed for sinking)
  const hull = new THREE.Mesh(SHIP_HULL, hullMat);
  hull.position.y = 0.6;
  g.add(hull);
  slab(g, deckMat, 4.4, 0.2, 15, 0, 2.15, -0.5);                    // deck
  slab(g, hullMat, 5, 2.2, 4, 0, 3.2, -7);                          // the captain's cabin at the back
  slab(g, deckMat, 5.2, 0.2, 4.2, 0, 4.35, -7);
  for (const s of [-1, 1]) for (let k = 0; k < 4; k++) slab(g, windowMat, 0.05, 0.5, 0.6, s * 2.42, 1.2, -4.5 + k * 3); // gun ports
  for (const [z, hgt] of [[-3, 13], [2, 15], [6.5, 11]]) {
    spike(g, darkWood, 0.22, hgt, V(0, 2.2, z), UP, 0.12);           // mast
    slab(g, darkWood, 6.5, 0.15, 0.15, 0, 2.2 + hgt * 0.75, z);      // the pole the sail hangs from
    const sail = new THREE.Mesh(SAIL_GEO, sailMat);
    sail.position.set(0, 2.2 + hgt * 0.75 - 2.6, z + 0.15);
    g.add(sail);
    u.sails.push(sail);
  }
  u.flag = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.2).translate(1, 0, 0), new THREE.MeshStandardMaterial({ color: flagColor, side: THREE.DoubleSide }));
  u.flag.position.set(0, 16.8, 2);
  g.add(u.flag);
  for (const s of [-1, 1]) for (let k = 0; k < 4; k++) {            // cannons, hidden inside until the attack
    const c = new THREE.Mesh(CANNON_GEO, ironMat);
    c.position.set(s * 1.6, 1.2, -4.5 + k * 3);
    c.userData.side = s;
    c.visible = false;
    g.add(c);
    u.cannons.push(c);
  }
  g.userData = u;
  g.scale.setScalar(1.5);
  return g;
}
function shoreToward(dir, side = 0) { // the last dry spot when walking from the middle of the island toward "dir"
  const perp = V(-dir.z, 0, dir.x);
  let best = null;
  for (let r = 20; r < 220; r += 2) {
    const p = V(dir.x * r + perp.x * side, 0, dir.z * r + perp.z * side), y = groundHeight(p.x, p.z);
    if (y >= 1.2) best = p.setY(y); else if (best) break;
  }
  return best || dryspot();
}
function shipsAppear() {
  age.ships = true;
  const isl = ISLANDS.slice(0, 4).reduce((a, b) => Math.hypot(a.x, a.z) < Math.hypot(b.x, b.z) ? a : b); // they come from the nearest island
  shipDir = V(isl.x, 0, isl.z).normalize();
  const perp = V(-shipDir.z, 0, shipDir.x), shore = shoreToward(shipDir);
  for (let i = 0; i < 3; i++) {
    const s = makeShip(0x6a1b9a), u = s.userData;
    s.position.copy(shipDir).multiplyScalar(Math.min(430, Math.hypot(isl.x, isl.z) - 60)).addScaledVector(perp, (i - 1) * 40);
    u.target = shore.clone().addScaledVector(shipDir, 55 + i % 2 * 10).addScaledVector(perp, (i - 1) * 32).setY(0);
    u.heading = Math.atan2(-shipDir.x, -shipDir.z);
    u.face = Math.atan2(shipDir.x, shipDir.z) + Math.PI / 2; // once anchored, turn sideways so the cannons face the city
    addBent(s);
    ships.push(s);
  }
  const look = pick(freeAdults());
  if (look) {
    Object.assign(look.userData, { role: "lookout", act: null });
    doAct(look, "look", 5, { to: shore, run: true, face: ships[1], patience: 40, bubble: "SHIPS! Ships on the horizon!" });
  }
}
const LOOKOUT_LINES = ["They're getting closer!", "Who ARE they?", "There must be other islands out there!", "Everyone, come and look!"];
ROLES.lookout = h => doAct(h, pick(["look", "wave", "look"]), 3, { face: ships[1] || h.position, bubble: Math.random() < 0.3 ? pick(LOOKOUT_LINES) : null });
function makeBoat() { // a little rowing boat
  const g = new THREE.Group();
  slab(g, hullMat, 1.4, 0.6, 3.6, 0, 0.1, 0);
  g.userData.oars = [-1, 1].map(s => { const j = joint(g, s * 0.75, 0.45, 0); slab(j, woodMat, 2.2, 0.06, 0.14, s * 1.1, 0, 0); j.userData.side = s; return j; });
  return g;
}
const VISITOR_LINES = ["Greetings, friends!", "We come from across the sea!", "What a beautiful city...", "We brought gifts!", "So... how many guards do you have?", "Lovely walls. Are they strong?", "We come in peace! Hehe."];
ROLES.visitor = h => doAct(h, pick(["wave", "talk", "bow", "look"]), 4, { to: nearSpot(park.c, 14), bubble: Math.random() < 0.4 ? pick(VISITOR_LINES) : null });
ROLES.retreat = h => doAct(h, "idle", 0.3, { to: h.userData.boatSpot, run: true, patience: 25, bubble: pick(["To the ships!", "Hahaha! Fooled you!", "Ready the cannons!"]),
  next: () => { puff(h.position); removeHuman(h); } });
function visitorsLand() {
  age.visitors = true;
  for (const h of humans) if (h.userData.role === "lookout") Object.assign(h.userData, { role: null, act: null });
  ships.slice(0, 2).forEach((ship, i) => {
    const boat = makeBoat(), dest = shoreToward(shipDir, (i - 0.5) * 24), end = dest.clone().addScaledVector(shipDir, 6).setY(0);
    boat.position.copy(ship.position).setY(0);
    addBent(boat);
    let a = 0;
    fx(dt => {
      a += dt;
      const d = V(end.x - boat.position.x, 0, end.z - boat.position.z), dist = d.length();
      boat.rotation.y = Math.atan2(d.x, d.z);
      boat.position.y = Math.sin(a * 2) * 0.1;
      for (const o of boat.userData.oars) { o.rotation.y = Math.sin(a * 4) * 0.6 * o.userData.side; o.rotation.z = Math.cos(a * 4) * 0.2 * o.userData.side; } // rowing
      if (dist > 1) { boat.position.addScaledVector(d.normalize(), Math.min(dist, 6 * dt)); if (Math.random() < dt * 6) foamRing(boat.position.x, boat.position.z, 0.6); return true; }
      for (let k = 0; k < 3; k++) {
        addHuman(nearSpot(dest, 3));
        const h = lastHuman();
        Object.assign(h.userData, { role: "visitor", boatSpot: dest.clone() });
        setLabel(h, "⛵ Visitor");
        visitors.push(h);
      }
      return false;
    });
  });
}

// ----- The attack -----
function startAttack() {
  age.attack = true;
  for (const h of visitors) if (h.parent) Object.assign(h.userData, { role: "retreat", act: null });
  const shore = shoreToward(shipDir);
  for (const s of ships) {
    const u = s.userData;
    u.flag.material.color.setHex(0x111111); // the black flag goes up
    u.nextShot = landTime + 3 + Math.random() * 3;
    for (const c of u.cannons) {             // the cannons roll out of the gun ports
      c.visible = true;
      let a = 0;
      fx(dt => { a += dt; c.position.x = c.userData.side * (1.6 + 0.9 * Math.min(a / 1.5, 1)); return a < 1.5; });
    }
  }
  attackTargets.push(...cityHomes.filter(g => g.parent).sort((a, b) => flatDist(a.position, shore) - flatDist(b.position, shore)).slice(0, 10));
  for (const h of humans) if (!h.userData.role && flatDist(h.position, shore) < 80) flee(h, { position: shore });
  sfx.roar();
}
function fireCannon(ship, to, b) {
  const u = ship.userData;
  ship.updateMatrixWorld(true);
  const c = u.cannons.reduce((best, k) => ship.localToWorld(k.position.clone()).distanceTo(to) < ship.localToWorld(best.position.clone()).distanceTo(to) ? k : best);
  const from = ship.localToWorld(V(c.position.x + c.userData.side, c.position.y, c.position.z));

function hitBuilding(b) {

}
function collapse(b) {

function sinkShip(ship) {
  const u = ship.userData, p = ship.position;
  u.sinking = 0;
  boom(ship.localToWorld(V(0, 2, -6)), 2.5);                                   // the gunpowder room explodes
  for (let i = 1; i < 5; i++) after(i * 0.5, () => boom(ship.localToWorld(V(rand(2), 2 + Math.random() * 4, rand(8))), 1.2));
  for (let i = 0; i < 8; i++) {                                                // planks fly off and float on the water
    const plank = slab(land, woodMat, 2 + Math.random() * 2, 0.2, 0.5, p.x, 3, p.z);
    bendMat(plank.material);
    const v = V(rand(8), 6 + Math.random() * 6, rand(8)), spin = rand(4), ph = Math.random() * 7;
    let a = 0;
    fx(dt => {
      a += dt;
      if (plank.position.y > 0.1 || v.y > 0) { v.y -= 15 * dt; plank.position.addScaledVector(v, dt); plank.rotation.x += spin * dt; }
      else { plank.position.y = 0.1 + Math.sin(a * 2 + ph) * 0.08; plank.rotation.x = Math.sin(a + ph) * 0.1; } // bobbing on the waves
      if (a < 45) return true;
      land.remove(plank);
      return false;
    });
  }
  fx(dt => {
    u.sinking += dt;
    const s = u.sinking, near = camera.position.distanceTo(p) < 200;
    ship.rotation.x = -Math.min(s / 8, 1) * 0.7;                   // the front tips up...
    ship.position.y = -(Math.max(0, s - 2) ** 1.6) * 0.6;           // ...and it slides under the water
    ship.rotation.z += dt * 0.03;
    if (s < 15) {                                                  // the water bubbles and foams around it
      for (let i = 0; i < 4; i++) if (Math.random() < dt * 12) particle(V(p.x + rand(12), 0.1, p.z + rand(12)), 0xe8f6ff, V(rand(0.3), 1 + Math.random() * 1.5, rand(0.3)), 0.7);
      if (Math.random() < dt * 3) foamRing(p.x + rand(8), p.z + rand(8), 1 + Math.random() * 2);
      if (near && Math.random() < dt * 5) sfx.bubble();
    }
    if (s < 9 && Math.random() < dt * 6) particle(ship.localToWorld(V(rand(2), 4, rand(6))), 0x333333, V(rand(0.5), 2, rand(0.5)), 4); // black smoke
    if (s < 18) return true;
    land.remove(ship);
    ships.splice(ships.indexOf(ship), 1);
    return false;
  });
  for (const o of ships) if (o !== ship) { // the other ships turn around and flee
    const ou = o.userData;
    Object.assign(ou, { target: o.position.clone().addScaledVector(shipDir, 600).setY(0), face: null, fleeing: true, speed: 11 });
  }
  age.sunk = true;
  sfx.roar();
}

function updateRenaissance(dt, t) {
  for (let i = fxList.length - 1; i >= 0; i--) if (!fxList[i](dt)) fxList.splice(i, 1);

  // Little animations all over the town
  if (age.metropolis && landTime > nextSmoke) { // smoke curls out of chimneys near you
    nextSmoke = landTime + 0.15;
    const g = pick(cityHomes);
    if (g && g.userData.dims && !g.userData.falling && g.position.distanceTo(camera.position) < 70) {
      const { w, hgt } = g.userData.dims;
      particle(g.localToWorld(V(w * 0.25, hgt + 3.1, 0)), 0xbbbbbb, V(rand(0.2), 0.8, rand(0.2)), 3);
    }
  }
  for (const s of shops) if (s.userData.banner) s.userData.banner.rotation.y = Math.sin(t * 3 + s.position.x) * 0.25; // flags flap in the wind
  if (workshop) workshop.userData.banner.rotation.y = Math.sin(t * 3.4) * 0.25;
  for (const tr of trees) if (tr.position.distanceTo(camera.position) < 80) tr.rotation.z = Math.sin(t * 1.3 + tr.position.x) * 0.03; // trees sway

  // Renaissance makeovers, one house at a time
  if (age.renaissance && landTime > nextUpgrade) {
    nextUpgrade = landTime + 0.35;
    const g = cityHomes.find(o => o.userData.dims && !o.userData.renaissance && o.scale.x >= 1 && !o.userData.falling);
    if (g) renaissanceHouse(g);
  }

  // Ships: bob on the waves, sails billow, flags flap
  for (const s of [...ships]) {
    const u = s.userData;
    u.sails.forEach((sl, i) => sl.scale.z = 1 + Math.sin(t * 1.7 + i + u.phase) * 0.25);
    u.flag.rotation.y = Math.sin(t * 5 + u.phase) * 0.5;
    if (u.sinking != null) continue;
    s.position.y = Math.sin(t * 1.1 + u.phase) * 0.25;
    s.rotation.z = Math.sin(t * 0.8 + u.phase) * 0.05;
    s.rotation.x = Math.sin(t * 0.6 + u.phase) * 0.025;
    if (u.target) {
      const d = V(u.target.x - s.position.x, 0, u.target.z - s.position.z), dist = d.length();
      if (dist > 4) {
        u.heading = turnToward(u.heading, Math.atan2(d.x, d.z), dt * 0.5);
        const v = u.speed * Math.min(1, dist / 25) * dt;
        s.position.x += Math.sin(u.heading) * v;
        s.position.z += Math.cos(u.heading) * v;
        if (Math.random() < dt * 6) foamRing(s.position.x - Math.sin(u.heading) * 12, s.position.z - Math.cos(u.heading) * 12, 1.5); // the wake behind it
      } else u.target = null;
    } else if (u.face != null) u.heading = turnToward(u.heading, u.face, dt * 0.2);
    s.rotation.y = u.heading;
    if (u.fleeing && s.position.length() > 650) { land.remove(s); ships.splice(ships.indexOf(s), 1); }
    // Cannon fire during the attack
    if (age.attack && !age.sunk && !u.target && landTime > u.nextShot) {
      u.nextShot = landTime + 2.5 + Math.random() * 2.5;
      const left = attackTargets.filter(b => b.parent && !b.userData.falling), b = left.length && Math.random() > 0.25 ? pick(left.slice(0, 4)) : null;
      const to = b ? b.position.clone().setY(b.position.y + 2) : shoreToward(shipDir, rand(30)).addScaledVector(shipDir, 5 + Math.random() * 15).setY(0); // some shots miss into the sea
      fireCannon(s, to, b);
    }
  }
}

const watching = () => age.crowd && !age.freed; // the crowd at the pyramid, from the capstone until the workers are freed
function updateHumanAge(dt, t) {
  // New animals and people
  const beastNames = Object.keys(BEASTS);
  if (age.beasts && !age.tribal && beasts.length < 18 && landTime > nextBeast) { // in the tribal era, animals only come from babies
    const n = beastNames[beasts.length % beastNames.length];
    addBeast(n, BEASTS[n], beasts);
    nextBeast = landTime + 2;
  }
  if (age.apes && !age.humans && apes.length < 8 && Math.random() < dt) addBeast("Early ape", APE, apes);
  const maxHumans = age.metropolis ? 200 : age.crowd ? 60 : age.paths ? 50 : villages.length ? 30 : 12;
  if (age.humans && humans.length < maxHumans && Math.random() < dt * (age.metropolis ? 4 : age.paths ? 1.5 : 0.5)) {
    const at = age.metropolis && cityHomes.length ? pick(cityHomes).position : watching() ? pyramid.center : villages.length ? pick(villages).center : campfire?.position;
    addHuman(at ? nearSpot(at, watching() ? 25 : 3) : null, villages.length > 0 && !watching()); // villagers are born as babies
  }
  if (iceAt && !iceEndAt && iceBeasts.length < 10 && Math.random() < dt * 0.5) {
    const n = iceBeasts.length % 5 < 3 ? "Woolly mammoth" : "Saber-toothed cat";
    addBeast(n, ICE_BEASTS[n], iceBeasts);
  }
  if (iceEndAt && iceBeasts.length && Math.random() < dt * 0.3) land.remove(iceBeasts.pop()); // dying out, one by one
  if (villages.length && landTime > nextHut) {
    const v = villages.find(v => v.huts < 7);
    if (v) addHut(v);
    nextHut = landTime + 2;
  }
  if (ideaBulb && landTime > IDEA_AT + 8) { ideaBulb.parent.remove(ideaBulb); ideaBulb = null; }

  // Ice and snow come and go slowly
  ice += Math.max(-dt / 20, Math.min(dt / 20, iceTarget - ice));
  if (Math.abs(ice - lastIce) > 0.05 || (ice === iceTarget && ice !== lastIce)) {
    lastIce = ice;
    paintGrass();
    sea.material.color.setHex(0x1b4f9c).lerp(ICE_SEA, ice * 0.8); // the sea freezes over
  }
  snowfall.visible = ice > 0.05;
  if (snowfall.visible) {
    snowfall.material.opacity = ice;
    snowfall.position.set(camera.position.x, camera.position.y - 15, camera.position.z);
    const p = snowGeo.attributes.position;
    for (let i = 0; i < p.count; i++) p.setY(i, (p.getY(i) - dt * 3 + 30) % 30);
    p.needsUpdate = true;
  }

  // Moving everyone
  for (const b of [...beasts, ...apes, ...iceBeasts, ...penned]) {
    const u = b.userData, moving = walkTo(b, dt, 2);
    if (b.scale.x < 1) b.scale.setScalar(Math.min(1, b.scale.x + dt * 0.04)); // babies grow up
    u.legs.forEach((l, i) => l.rotation.x = moving ? Math.sin(t * u.step + u.phase + [0, Math.PI, Math.PI, 0][i]) * 0.4 : 0);
    u.head.rotation.y = Math.sin(t * 0.6 + u.phase) * 0.3;
  }
  for (const h of humans) updateHuman(h, dt);
  updateTribal(dt, t);
  updateCivilization(dt);
  updateKingdom(dt);
  updateMetropolis(dt);
  updateTown(dt, t);
  updateRenaissance(dt, t);
  for (const f of fires) {                                  // flickering flames
    f.userData.flame.scale.setScalar(2.2 + Math.sin(t * 13 + f.position.x) * 0.3 + Math.random() * 0.2);
    f.userData.light.intensity = 1.3 + Math.random() * 0.4;
  }
  for (const hut of huts) hut.scale.setScalar(Math.min(1, hut.scale.x + dt * 0.3));
}

// Walk toward a target spot on the ground, then pick a new one
function walkTo(w, dt, close) {
  const u = w.userData, to = u.target.clone().sub(w.position);
  to.y = 0;
  if (u.wait > 0) { u.wait -= dt; return false; } // resting
  if (to.length() < close) {
    u.target = u.home ? u.home.clone().add(V(rand(u.roam), 0, rand(u.roam))) : dryspot(); // stay near home, if it has one
    u.wait = Math.random() * (u.pause || 0);
  }
  w.position.addScaledVector(to.normalize(), u.speed * dt);
  w.position.y = groundHeight(w.position.x, w.position.z);
  w.lookAt(u.target.x, w.position.y, u.target.z);
  return true;
}

function updateLandLife(dt, t) {
  landTime += dt;
  const next = STAGES[landStage];
  if (next && landTime > (typeof next[0] === "function" ? next[0]() : next[0]) && (!next[3] || next[3]())) {
    landStage++;
    stageAt = landTime;
    if (next[1]) { say(next[1]); sfx.chime(); }
    if (next[2]) next[2]();
  }

  // More life appears over time (but nothing grows while dust blocks the sun)
  const calm = dust < 0.3;
  if (landStage >= 1 && !asteroidHit && walkers.length < 30 && Math.random() < dt * 1.5) (Math.random() < 0.6 ? addTiktaalik : addMillipede)();
  if (landStage >= 2 && calm && plants.length < 300 && Math.random() < dt * 15) addPlant();
  if (landStage >= 3 && calm && insects.length < 60 && Math.random() < dt * 3) addInsect();
  if (landStage >= 4 && calm && trees.length < 80 && Math.random() < dt * 2) addTree();
  if (landStage >= 5 && !asteroidHit && dinoQueue.length && landTime > nextDino) {
    addDino(dinoQueue.shift());
    nextDino = landTime + 1.5; // a new dinosaur every 1.5 seconds
  }
  if (landStage >= 6 && calm && mammals.length < (asteroidHit ? 40 : 15) && Math.random() < dt) addMammal();

  // The ground slowly turns green (repainted in small steps, not every frame)
  if (landStage >= 2 && calm && greenness < 1.6) {
    const before = Math.floor(greenness * 20);
    greenness = Math.min(1.6, greenness + dt / 70);
    if (Math.floor(greenness * 20) !== before) paintGrass();
  }

  // The asteroid falling, the explosion, and the dust slowly settling
  if (spaceRock && !asteroidHit) {
    const k = clamp01(1 - (ASTEROID_AT - landTime) / FALL_TIME);
    spaceRock.position.copy(planet.position).addScaledVector(rockStart, 1 - k);
    spaceRock.rotation.x += dt;
    skyRock.position.copy(impactSpot).addScaledVector(V(-600, 900, -300), 1 - k);
  }
  if (fireball) {
    const age = landTime - ASTEROID_AT;
    fireball.scale.setScalar(Math.min(age * 150, 500));
    fireball.material.opacity = clamp01(1 - age / 12);
    shockwave.scale.setScalar(1 + age * 80);
    shockwave.material.opacity = clamp01(1 - age / 5);
    spaceBlast.scale.setScalar(2 + age * 2);
    spaceBlast.material.opacity = clamp01(1 - age / 15);
    if (age < 3) flash = 1; // the ground shakes
    if (age > 15) {
      land.remove(fireball); land.remove(shockwave); planet.remove(spaceBlast);
      fireball = null;
    }
  }
  if (asteroidHit) dust = Math.max(0, 1 - (landTime - ASTEROID_AT) / 90);
  if (clouds) clouds.material.color.setRGB(1 - dust * 0.5, 1 - dust * 0.6, 1 - dust * 0.7); // dusty brown clouds, seen from space

  for (const w of walkers) {
    const u = w.userData;
    walkTo(w, dt, 1);
    w.position.y += 0.25;
    if (u.tail) u.tail.rotation.y = Math.sin(t * 6 + u.phase) * 0.4;         // tail swings
    u.fins.forEach((f, i) => f.rotation.y = Math.sin(t * 6 + u.phase + i * 1.5) * 0.5); // fins push like legs
  }
  // Plants and trees slowly grow to full size (trees grow slower)
  for (const p of plants) p.scale.setScalar(Math.min(p.scale.x + dt * 0.3, p.userData.size));
  for (const p of trees) p.scale.setScalar(Math.min(p.scale.x + dt * 0.1, p.userData.size));
  for (const b of insects) {
    const u = b.userData, a = t * u.speed + u.phase;
    b.position.set(u.home.x + Math.cos(a) * u.r, u.home.y + 2 + Math.sin(a * 2) * 0.7, u.home.z + Math.sin(a) * u.r);
    b.lookAt(u.home.x + Math.cos(a + 0.1) * u.r, b.position.y, u.home.z + Math.sin(a + 0.1) * u.r);
    u.wings[0].rotation.z = Math.sin(t * 40) * 0.8;  // fast flapping
    u.wings[1].rotation.z = -Math.sin(t * 40) * 0.8;
  }
  for (const g of dinos) {
    const u = g.userData, step = t * u.step + u.phase;
    walkTo(g, dt, 4);
    u.legs.forEach((l, i) => l.rotation.x = Math.sin(step + [0, Math.PI, Math.PI, 0][i]) * 0.35); // opposite legs swing together
    for (const p of u.tailParts) p.m.position.x = Math.sin(step * 0.5 - p.k * 0.4) * 0.05 * p.k ** 1.3; // tail wags in a wave
    for (const f of u.followers) f.obj.position.x = f.part.position.x + f.dx;
    u.head.rotation.y = Math.sin(t * 0.7 + u.phase) * 0.3;                                   // looks around
    if (u.jaw) u.jaw.rotation.x = 0.05 + Math.max(0, Math.sin(t * 0.8 + u.phase) - 0.7) * 1.2; // opens its mouth now and then
  }
  for (const m of mammals) {
    walkTo(m, dt, 1);
    m.position.y += Math.abs(Math.sin(t * 14 + m.userData.phase)) * 0.1; // scurrying hops
  }
  updateHumanAge(dt, t);
}

let nextBend = 0;
function enterLand() {
  onLand = true;
  if (!islandsBuilt) buildIslands();
  camera.position.set(0, 40, 0); // you drop down from the sky
  pitch = -0.2;
  say(landStage === 0 ? "You landed on new land made by the meteors! Nothing lives here yet, but wait and watch the shore..."
                      : "You landed on the new land! Press O to swim in the sea, or hold E to fly back to space.");
}

function backToSpace() {
  inOcean = false;
  onLand = false;
  camera.position.copy(planet.position).add(new THREE.Vector3(0, PLANET_R + 4, 0));
  pitch = 0;
  say("Back in space!");
}

// ---------- Cambrian Explosion & meteor shower ----------
function startCambrian() {
  era = "cambrian";
  animals = 1;
  say("1 billion cells! The CAMBRIAN EXPLOSION has begun: all kinds of animals are appearing. Dive in to see them!");
}

function startMeteorShower() {
  era = "shower";
  say("WARNING! A meteor shower from the asteroid belt is hitting the planet!");
}

function spawnMeteor() {
  const a = Math.random() * Math.PI * 2, r = 85 + Math.random() * 20; // starts in the asteroid belt
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3 + Math.random() * 0.4, 0),
    new THREE.MeshBasicMaterial({ color: 0xff8833 }));
  m.position.set(Math.cos(a) * r, rand(2), Math.sin(a) * r);
  const fire = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false }));
  fire.scale.set(4, 4, 1);
  m.add(fire);
  space.add(m);
  meteors.push(m);
}

function updateMeteors(dt) {
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    // The planet's gravity pulls the meteor in
    const toPlanet = planet.position.clone().sub(m.position).normalize();
    m.position.addScaledVector(toPlanet, 40 * dt);
    m.rotation.x += dt * 3;
    if (m.position.distanceTo(planet.position) < PLANET_R) {
      impact(m.position);
      space.remove(m);
      meteors.splice(i, 1);
    }
  }
}

// Turn a 3D point on the planet into a spot (x, y) on its flat texture
function textureSpot(pos) {
  const p = planet.worldToLocal(pos.clone()).normalize();
  const img = planet.material.map.image;
  return {
    x: ((Math.atan2(p.z, -p.x) / (Math.PI * 2) + 1) % 1) * img.width,
    y: Math.acos(p.y) / Math.PI * img.height
  };
}

// Is there land at this spot? Brown land has more red than blue; ocean has more blue.
function isLand(pos) {
  const s = textureSpot(pos);
  const px = planet.material.map.image.getContext("2d").getImageData(s.x, s.y, 1, 1).data;
  return px[0] > px[2];
}

// A meteor hits: new land forms where it landed, and there's a flash
function impact(pos) {
  const s = textureSpot(pos), map = planet.material.map;
  paintLand(map.image.getContext("2d"), s.x, s.y, 8);
  map.needsUpdate = true;
  flash = 1;
}

function extinction() {
  era = "after";
  cells *= 0.15;
  animals *= 0.15;
  say("The meteor shower is over. It built new land, but it ended the Cambrian Explosion: 85% of life died. " +
      "Fly onto the brown land to walk on it!");
}

  if (animals) text += "  ·  Animals: " + Math.floor(animals).toLocaleString();

  if (age.tribal) text += "  ·  🦌 Wild prey: " + wildPrey().length;

  if (age.ban && !age.storm) text += "  ·  ⚖️ Day " + Math.min(7, Math.floor((landTime - banAt) / DAY_SECONDS) + 1) + "/7 of the ban · Sentenced: " + executions;
  if (age.medieval) text += "  ·  🏚️ Strange buildings: " + weird.length;
  if (age.metropolis) text += "  ·  🏘️ Houses: " + cityHomes.length + "  ·  👥 People: " + humans.length;
  if (age.fixing) text += "  ·  🛠️ Mistakes left: " + toFix.length;
  if (pyramid && !age.cities) text += "  ·  🔺 Pyramid: " + Math.floor((pyramid.done + (age.capstone ? 1 : 0)) / (pyramid.total + 1) * 100) + "%";
  if (huts.length) text += "  ·  🛖 Huts: " + huts.length;

// ---------- Sounds and voices ----------
// All sounds are made on the fly with the Web Audio API (no sound files needed).
// Voices use the browser's built-in text-to-speech. Press M to mute.
let audio = null, muted = false, nextChirp = 0;
function startAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume();
}
addEventListener("mousedown", startAudio);   // browsers only allow sound after a click or key press
addEventListener("keydown", e => {
  startAudio();
  if (e.code === "KeyM") { muted = !muted; if (muted) speechSynthesis.cancel(); say(muted ? "🔇 Sound off (M)" : "🔊 Sound on (M)"); }
});

// A beep that can slide from one pitch to another
function tone(freq, dur, type = "sine", vol = 0.2, endFreq = freq, delay = 0) {
  if (!audio || muted) return;
  const t = audio.currentTime + delay, o = audio.createOscillator(), g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t);
  o.stop(t + dur);
}
// A burst of hiss, filtered to sound like a whoosh, thud or crowd
function noise(dur, vol = 0.2, freq = 1000, delay = 0) {
  if (!audio || muted) return;
  const t = audio.currentTime + delay, len = Math.floor(audio.sampleRate * dur);
  const buf = audio.createBuffer(1, len, audio.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  src.buffer = buf;
  f.type = "lowpass";
  f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(audio.destination);
  src.start(t);
}

const sfx = {
  chime: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.6, "triangle", 0.12, f, i * 0.12)), // a new stage
  thud: () => { tone(120, 0.3, "sine", 0.4, 40); noise(0.2, 0.2, 300); },                          // an animal falls
  clink: () => { tone(1800, 0.15, "square", 0.05, 1500); tone(2600, 0.1, "sine", 0.06); },          // pickaxe on bronze
  poof: () => noise(0.6, 0.25, 2500),                                                                // puff of smoke
  roar: () => { for (let i = 0; i < 6; i++) noise(1.5, 0.12, 600 + i * 150, i * 0.1); },             // a huge crowd
  chirp: () => { const f = 2500 + Math.random() * 1500; tone(f, 0.08, "sine", 0.04, f * 1.3); tone(f * 1.1, 0.08, "sine", 0.04, f * 0.9, 0.12); },
  cricket: () => { for (let i = 0; i < 3; i++) tone(4200, 0.04, "square", 0.015, 4200, i * 0.07); },
  clang: () => { tone(1250, 0.3, "square", 0.04, 1180); tone(2500, 0.25, "sine", 0.05, 2400); noise(0.05, 0.1, 4000); },   // hammer on the anvil
  hiss: () => noise(1, 0.12, 5000),                                                                  // hot iron dunked in water
  neigh: () => { tone(750, 0.6, "sawtooth", 0.04, 450); tone(1100, 0.4, "sawtooth", 0.025, 800, 0.15); },
  hooves: () => { tone(320, 0.05, "square", 0.03, 200); tone(270, 0.05, "square", 0.03, 180, 0.13); }, // clip-clop
  boom: (s = 1) => { noise(1.4, 0.3 * Math.min(s, 1.6), 350); tone(90, 1.2, "sine", 0.35, 28); },         // an explosion
  cannon: () => { noise(0.9, 0.28, 600); tone(120, 0.6, "sine", 0.3, 35); },
  bang: () => { noise(0.25, 0.22, 2600); tone(320, 0.1, "square", 0.04, 90); },                          // a musket shot
  splash: () => noise(0.8, 0.14, 1100),
  bubble: () => { const f = 250 + Math.random() * 500; tone(f, 0.09, "sine", 0.05, f * 2.2); },
  fanfare: () => [392, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, i === 5 ? 1 : 0.22, "sawtooth", 0.05, f, i * 0.2))
};

// Birds sing in the day, crickets chirp at night
function updateSound(dt) {
  if (!onLand || !audio || muted || (nextChirp -= dt) > 0) return;
  nextChirp = 0.5 + Math.random() * 2.5;
  if (sunHeight > 0) sfx.chirp(); else sfx.cricket();
}

// Each human gets their own voice: a robot-ish computer voice with their own pitch and speed
const hearPos = new THREE.Vector3();
function speak(h, text) {
  if (!audio || muted || !window.speechSynthesis) return;
  h.getWorldPosition(hearPos);
  if (hearPos.distanceTo(camera.position) > 30 || speechSynthesis.pending) return; // only people near you, one at a time
  const u = h.userData;
  if (!u.voice) {
    const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
    const low = u.kind === "Grumpy" || u.kind === "Brave", high = u.kind === "Playful" || u.kind === "Shy";
    u.voice = { v: voices.length ? pick(voices) : null, pitch: (low ? 0.4 : high ? 1.6 : 1) + rand(0.3), rate: u.kind === "Lazy" ? 0.75 : u.kind === "Playful" ? 1.3 : 1 + rand(0.15) };
  }
  const words = text.replace(/[^\p{L}\p{N}\s.,!?'-]/gu, "").trim();       // emojis can't be spoken
  if (!words) return;
  const s = new SpeechSynthesisUtterance(words);
  if (u.voice.v) s.voice = u.voice.v;
  s.pitch = u.voice.pitch;
  s.rate = u.voice.rate;
  s.volume = Math.max(0.2, 1 - hearPos.distanceTo(camera.position) / 30); // quieter when far away
  speechSynthesis.speak(s);
}

// ---------- Controls ----------
const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "KeyF") flyToPlanet();
  if (e.code === "KeyO" && onLand) { onLand = false; enterOcean(); }           // from land, dive into the sea
  if (e.code === "KeyL" && inOcean && era === "after") { inOcean = false; enterLand(); } // from the sea, walk onto land
});
addEventListener("keyup", e => keys[e.code] = false);

let dragging = false, moved = 0;
renderer.domElement.addEventListener("mousedown", () => { dragging = true; moved = 0; });

// ---------- Game speed ----------
const SPEEDS = [0, 1, 2, 5, 10, 20, 40, 60]; // 0 = paused
let gameSpeed = 1, lastSpeed = 1, simTime = 0;
// Pause and play are drawn as little pictures, so they look the same on every computer and phone
// (the ⏸ and ▶ characters turn into colorful emojis on some devices)
const PAUSE_ICON = '<svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" fill="currentColor"/></svg>';
const PLAY_ICON = '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 1 L13 7 L3 13 Z" fill="currentColor"/></svg>';
function setSpeed(n) {
  gameSpeed = n;
  if (n) lastSpeed = n; // remember the speed, so we can go back to it after a pause
  document.querySelectorAll("#speed button").forEach(b => b.classList.toggle("on", +b.dataset.speed === n));
  document.querySelector('#speed button[data-speed="0"]').innerHTML = n ? PAUSE_ICON : PLAY_ICON; // pause turns into play
}
document.getElementById("speed").innerHTML = SPEEDS.map(n => `<button data-speed="${n}">${n ? n + "x" : PAUSE_ICON}</button>`).join("");
document.querySelectorAll("#speed button").forEach(b => b.onclick = () => {
  const n = +b.dataset.speed;
  setSpeed(n === 0 && gameSpeed === 0 ? lastSpeed : n); // pressing play goes back to the last speed
});
setSpeed(1);
addEventListener("keydown", e => {
  const i = ["Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "Digit6", "Digit7"].indexOf(e.code); // keys 1-7 pick a speed
  if (i >= 0) setSpeed(SPEEDS[i + 1]);
});

// ---------- Game loop ----------
const clock = new THREE.Clock();
const forward = new THREE.Vector3(), right = new THREE.Vector3();

// Everything in the world that moves or grows by itself
function simulate(dt, t) {
  if (star) { star.rotation.y += dt * 0.05; star.material.uniforms.time.value = t; } // the surface boils

  if (planet) {
    // Kepler's law: farther planets orbit slower (speed ~ 1 / distance^1.5)
    const u = planet.userData;
    u.angle += 7 / Math.pow(u.dist, 1.5) * dt;
    planet.position.set(Math.cos(u.angle) * u.dist, 0, Math.sin(u.angle) * u.dist);
    planet.rotation.y += dt * 0.2;
    clouds.rotation.y += dt * 0.05;
  }
  if (moon) {
    moon.userData.angle += dt * 0.6;
    moon.position.copy(planet.position).add(new THREE.Vector3(Math.cos(moon.userData.angle) * 7, 0, Math.sin(moon.userData.angle) * 7));
  }

  if (belt) belt.rotation.y += dt * 0.01;

  for (const w of worlds) {
    w.angle += 7 / Math.pow(w.dist, 1.5) * dt; // Kepler's law again: far planets are slower
    w.holder.position.set(Math.cos(w.angle) * w.dist, 0, Math.sin(w.angle) * w.dist);
    w.ball.rotation.y += dt * (w.r > 4 ? 0.5 : 0.1); // gas giants spin fast
    for (const m of w.moons) {
      m.userData.angle += m.userData.speed * dt;
      m.position.set(Math.cos(m.userData.angle) * m.userData.dist, 0, Math.sin(m.userData.angle) * m.userData.dist);
    }
    if (!inOcean && !onLand) { // planets are solid: you can't fly through them
      const off = camera.position.clone().sub(w.holder.position);
      if (off.length() < w.r + 1) camera.position.copy(w.holder.position).add(off.setLength(w.r + 1));
    }
  }

  // Life grows (faster with a moon)
  if (era === "cells" && cells) {
    cells = Math.min(cells * Math.pow(moon ? 1.6 : 1.3, dt), 1e9);
    if (cells >= 1e9) startCambrian();
  }
  if (era === "cambrian") {
    animals = Math.min(animals * Math.pow(1.45, dt), 1e8);
    cambrianTime += dt;
    if (cambrianTime > CAMBRIAN_MINUTES * 60) startMeteorShower();
  }
  if (era === "shower") {
    showerTime += dt;
    if (showerTime < 25 && Math.random() < dt * 6) spawnMeteor(); // about 6 meteors per second
    if (showerTime > 25 && meteors.length === 0) extinction();
  }
  if (era === "after") { updateLandLife(dt, t); updateSky(dt); } // life keeps spreading on land, even while you're away
  updateMeteors(dt);
  flash *= Math.pow(0.05, dt); // impact flashes fade out
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  updateSound(dt);

  // Flying
  camera.rotation.set(pitch + rand(flash * 0.02), yaw + rand(flash * 0.02), 0); // shakes on impacts
  camera.getWorldDirection(forward);
  right.crossVectors(forward, camera.up).normalize();
  const speed = (keys.ShiftLeft || keys.ShiftRight ? 60 : 15) * (inOcean ? 0.4 : 1) * dt;
  const before = camera.position.clone();
  if (keys.KeyW) camera.position.addScaledVector(forward, speed);
  if (keys.KeyS) camera.position.addScaledVector(forward, -speed);
  if (keys.KeyD) camera.position.addScaledVector(right, speed);
  if (keys.KeyA) camera.position.addScaledVector(right, -speed);
  if (onLand) { // buildings are solid: if you'd walk into one, slide along its wall instead
    const mv = camera.position.clone().sub(before);
    if (bumped(before, mv)) {
      camera.position.x = before.x; camera.position.z = before.z;
      if (!bumped(before, V(mv.x, 0, 0))) camera.position.x += mv.x;
      else if (!bumped(before, V(0, 0, mv.z))) camera.position.z += mv.z;
    }
  }
  if (keys.KeyE) camera.position.y += speed;
  if (keys.KeyQ) camera.position.y -= speed;

  // Move the world forward. At 10x speed this runs 10 small steps (one big jump would make things skip past each other).
  // Above 15x, running that many steps every frame would lag, so each step gets a bit bigger instead (60x = 15 steps of 4x).
  const steps = Math.min(gameSpeed, 15), stepDt = steps ? dt * gameSpeed / steps : 0;
  for (let i = 0; i < steps; i++) {
    simTime += stepDt;
    simulate(stepDt, simTime);
  }
  if (planet) planet.material.emissive.setRGB(flash, flash * 0.3, 0);
  updateCount();

  const swim = gameSpeed ? dt : 0; // sea creatures stop swimming while paused
  if (inOcean) {
    // Show more creatures as the population grows (and far fewer after the extinction)
    const alive = era === "after" ? 0.15 : 1;
    syncCount(organisms, cells ? Math.ceil(Math.min(400, Math.log10(cells + 1) * 40) * alive) : 0, addOrganism);
    syncCount(animalList, animals ? Math.ceil(Math.min(150, Math.log10(animals + 1) * 18) * alive) : 0, addAnimal);
    for (const o of organisms) {
      const u = o.userData;
      o.position.addScaledVector(u.vel, swim);
      bounce(o);
      o.rotation.y += swim * 0.5;
      const wobble = 1 + Math.sin(t * 3 + u.phase) * 0.08; // squishy swimming
      o.scale.set(u.base.x * wobble, u.base.y / wobble, u.base.z * wobble);
    }
    for (const o of animalList) {
      const u = o.userData;
      o.position.addScaledVector(u.vel, swim);
      bounce(o);
      if (u.jelly) o.position.y += Math.sin(t * 2 + u.phase) * swim; // pulse up and down
      else o.lookAt(o.position.clone().sub(u.vel));                 // face where it's swimming
      if (u.tail) u.tail.rotation.y = Math.sin(t * 8 + u.phase) * 0.5; // wag the tail
    }
    ocean.background.copy(WATER).lerp(FIRE, flash); // meteor impacts light up the water
    ocean.fog.color.copy(ocean.background);
    camera.position.y = Math.max(camera.position.y, -28); // don't go through the floor
    if (camera.position.y > 30) backToSpace();
    renderer.render(ocean, camera);
  } else if (onLand) {
    // Gravity: you fall to the ground unless you hold E to fly up
    const ground = standHeight(camera.position.x, camera.position.z) + 1.7; // eye height (on stone floors too)
    if (!keys.KeyE && ground > -1) camera.position.y -= 20 * dt; // over the sea you hover, so you can travel to other islands (Q dives in)
    camera.position.y = Math.max(camera.position.y, ground);
    if (ground < -1 && camera.position.y < 0.5) enterOcean(); // fell into the sea (hold E to fly over it to other islands)
    for (const a of ["x", "z"]) if (Math.abs(camera.position[a]) > PLANET_L / 2) camera.position[a] -= Math.sign(camera.position[a]) * PLANET_L; // all the way around the planet
    sea.position.x = camera.position.x; sea.position.z = camera.position.z;
    if (t > nextBend) { bendLand(); nextBend = t + 0.5; }
    for (const s of solids) if (s.userData.inside) s.userData.inside.visible = flatDist(camera.position, s.position) < 40; // only draw furniture near you
    if (camera.position.y > 80) backToSpace();
    BEND_R.value = PLANET_BEND; // bend the land into a ball, only while drawing the land
    renderer.render(land, camera);
    BEND_R.value = 0;
  } else {
    if (star && camera.position.length() < 14) {        // too close to the star
      camera.position.setLength(14);
      say("Ouch! Too hot. Back away from the star.");
    }
    if (planet && camera.position.distanceTo(planet.position) < PLANET_R) {
      // After the meteor shower, flying onto brown land puts you on the land
      if (era === "after" && isLand(camera.position)) enterLand(); else enterOcean();
    }
    renderer.render(space, camera);
  }

  requestAnimationFrame(animate);
}

setButtons([["Make a Star", makeStar]]);
animate();
</script>
</body>
</html>

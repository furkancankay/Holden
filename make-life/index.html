// A limb bone: a tapered cylinder hanging down from its joint
function bone(parent, mat, top, bottom, len) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(top, bottom, len, 7), mat);
  m.position.y = -len / 2;
  parent.add(m);
}
// A joint is an empty group that can rotate everything attached to it
function joint(parent, x, y, z) {
  const j = new THREE.Group();
  j.position.set(x, y, z);
  parent.add(j);
  return j;
}

// Little speech bubbles above their heads (one texture per word, shared by everyone)
const bubbleMats = {};
const measure = document.createElement("canvas").getContext("2d");
function bubbleMat(text) {
  if (bubbleMats[text]) return bubbleMats[text];
  const lines = [];
  for (const word of text.split(" ")) {   // long sentences wrap onto a few lines
    if (lines.length && (lines[lines.length - 1] + " " + word).length <= 24) lines[lines.length - 1] += " " + word;
    else lines.push(word);
  }
  measure.font = "bold 44px sans-serif";
  const w = Math.ceil(Math.max(...lines.map(l => measure.measureText(l).width)) + 60), h = lines.length * 52 + 40;
  const mat = new THREE.SpriteMaterial({ depthWrite: false, map: makeTexture(w, h, g => {
    g.fillStyle = "rgba(255,255,255,0.88)";
    g.beginPath(); g.roundRect(2, 2, w - 4, h - 4, 26); g.fill();
    g.font = "bold 44px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#222";
    lines.forEach((l, i) => g.fillText(l, w / 2, 46 + i * 52));
  }) });
  mat.userData.size = [w / 250, h / 250]; // in meters
  return bubbleMats[text] = mat;
}

function addHuman(pos, young) {
  const g = new THREE.Group(), skin = pick(skinTones), hair = pick(hairMats);
  const kind = pick(Object.keys(PERSONALITIES)), name = pick(NAMES);
  // Hips: the legs and the upper body both hang from here, so the whole body can crouch, sit and lie down
  const pelvis = joint(g, 0, 0.92, 0);
  oval(pelvis, skin, 0, 0.02, 0, 0.17, 0.1, 0.11);
  const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 0.28, 10), hideMat);
  skirt.position.y = -0.04;
  pelvis.add(skirt);
  const hips = [], knees = [], arms = [], elbows = [];
  for (const s of [-1, 1]) {
    const hip = joint(pelvis, s * 0.1, -0.04, 0);
    bone(hip, skin, 0.08, 0.06, 0.46);                                      // thigh
    const knee = joint(hip, 0, -0.46, 0);
    oval(knee, skin, 0, 0, 0.01, 0.06, 0.06, 0.06);                         // kneecap
    bone(knee, skin, 0.06, 0.042, 0.42);                                    // shin
    oval(knee, skin, 0, -0.44, 0.05, 0.055, 0.035, 0.12);                   // foot
    hips.push(hip); knees.push(knee);
  }
  const spine = joint(pelvis, 0, 0.06, 0);
  oval(spine, skin, 0, 0.16, 0.02, 0.16, 0.16, 0.12);                      // belly
  oval(spine, skin, 0, 0.36, 0, 0.21, 0.17, 0.13);                         // broad chest
  const cape = Math.random() < 0.5 ? oval(spine, hideMat, 0, 0.44, -0.03, 0.26, 0.11, 0.16) : null; // fur cape over the shoulders
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.075, 0.14, 7), skin);
  neck.position.y = 0.54;
  spine.add(neck);
  for (const s of [-1, 1]) {
    const sh = joint(spine, s * 0.24, 0.45, 0);
    oval(sh, skin, 0, 0, 0, 0.075, 0.075, 0.075);                           // shoulder muscle
    bone(sh, skin, 0.055, 0.045, 0.3);                                      // upper arm
    const elbow = joint(sh, 0, -0.3, 0);
    bone(elbow, skin, 0.045, 0.035, 0.28);                                  // forearm
    oval(elbow, skin, 0, -0.32, 0.01, 0.04, 0.055, 0.028);                  // hand
    oval(elbow, skin, -s * 0.03, -0.3, 0.025, 0.012, 0.03, 0.012);          // thumb
    arms.push(sh); elbows.push(elbow);
  }
  const head = joint(spine, 0, 0.6, 0.02);
  oval(head, skin, 0, 0.1, -0.01, 0.1, 0.115, 0.115);                      // long, low skull
  oval(head, skin, 0, 0.13, 0.08, 0.095, 0.025, 0.045);                    // heavy brow, like early humans had
  oval(head, skin, 0, 0.065, 0.1, 0.03, 0.03, 0.03);                       // wide flat nose
  oval(head, hair, 0, 0.15, -0.03, 0.11, 0.1, 0.12);                       // shaggy hair
  oval(head, hair, 0, 0.07, -0.07, 0.1, 0.12, 0.07);
  for (const s of [-1, 1]) {
    oval(head, whiteMat, s * 0.04, 0.1, 0.095, 0.018, 0.014, 0.01);        // eyes
    oval(head, eyeMat, s * 0.04, 0.1, 0.103, 0.009, 0.009, 0.006);
    oval(head, skin, s * 0.1, 0.09, 0, 0.02, 0.035, 0.025);                // ears
  }
  const jaw = joint(head, 0, 0.04, 0.02);                                   // a big jaw that moves for chewing and grunting
  oval(jaw, skin, 0, -0.02, 0.05, 0.075, 0.04, 0.07);
  if (Math.random() < 0.4) oval(jaw, hair, 0, -0.04, 0.06, 0.08, 0.06, 0.06); // beard
  // A spear: a wooden stick with a sharp stone tip, held in one hand
  const spear = joint(elbows[1], 0, -0.32, 0.04);
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2, 5), woodMat);
  stick.position.y = 0.3;
  spear.add(stick);
  const tip = spike(spear, age.bronze ? bronzeMat : stoneMat, 0.04, 0.18, V(0, 1.3, 0), V(0, 1, 0));
  spear.visible = !!age.spears;
  const pickaxe = joint(elbows[0], 0, -0.32, 0.03);                         // a pickaxe for mining
  bone(pickaxe, woodMat, 0.02, 0.02, 0.7);
  for (const s of [-1, 1]) spike(pickaxe, bronzeMat, 0.035, 0.2, V(0, -0.7, 0), V(0, 0.2, s));
  pickaxe.visible = false;
  const hammer = joint(elbows[1], 0, -0.32, 0.03);                          // a blacksmith's hammer
  bone(hammer, woodMat, 0.02, 0.02, 0.45);
  oval(hammer, stoneMat, 0, -0.45, 0, 0.06, 0.06, 0.12);
  hammer.visible = false;
  const carry = new THREE.Mesh(MED_BOX, woodMat);                           // whatever they're carrying in their arms
  carry.scale.set(0.3, 0.2, 0.25);
  carry.position.set(0, 0.22, 0.38);
  spine.add(carry);
  carry.visible = false;
  const load = new THREE.Group();                                           // a stone block dragged on a rope
  const block = new THREE.Mesh(loadGeo, sandMat);
  block.position.set(0, 0.35, -1.4);
  load.add(block);
  spike(load, ropeMat, 0.015, 0.87, V(0, 0.95, -0.2), V(0, -0.35, -0.8), 0.015);
  load.visible = false;
  g.add(load);
  const label = makeLabel(name + " the " + kind);
  label.scale.set(3.4, 0.64, 1);
  label.position.y = 2.3;
  g.add(label);
  const bubble = new THREE.Sprite(bubbleMat("?"));
  bubble.scale.set(0.8, 0.4, 1);
  bubble.position.set(0.3, 1.95, 0);
  bubble.visible = false;
  g.add(bubble);
  const size = 0.88 + Math.random() * 0.22;
  g.scale.setScalar(young ? size * 0.55 : size); // babies are born small and grow up
  g.position.copy(pos || dryspot());
  g.rotation.y = Math.random() * 7;
  g.userData = {
    j: { pelvis, spine, head, jaw, hips, knees, arms, elbows }, spear, tip, pickaxe, hammer, carry, skirt, cape, load, label, bubble, name, kind, size, p: PERSONALITIES[kind],
    phase: Math.random() * 7, pose: { ...REST }, act: null, actT: 0, look: 0,
    hunger: Math.random() * 0.5, tired: Math.random() * 0.3, lonely: Math.random() * 0.5, bored: Math.random() * 0.5
  };
  if (watching()) g.userData.role = "crowd";   // only while the crowd is watching the king, not forever after
  if (age.clothes) dress(g);   // babies born after the fashion change get real clothes right away
  settle(g);
  land.add(g);
  humans.push(g);
}

  cheer: t => ({ z0: 2.7 + Math.sin(t * 6) * 0.25, z1: 2.7 - Math.sin(t * 6) * 0.25, e0: -0.2, e1: -0.2, py: Math.max(0, Math.sin(t * 6)) * 0.12, jaw: 0.4, hx: -0.2 }),
  bow: t => ({ sx: 0.9, hx: 0.3, a0: -0.3, a1: -0.3, e0: -0.4, e1: -0.4 }),
  riot: t => ({ a0: -2.6 + Math.sin(t * 6) * 0.3, e0: -0.2, a1: -1.2 + Math.sin(t * 6 + 2) * 0.5, e1: -1.4, jaw: Math.abs(Math.sin(t * 7)) * 0.4, sx: 0.2, hx: -0.15 }), // shaking a torch and shouting
  inspect: t => ({ sx: 0.35, hx: 0.6, hy: Math.sin(t * 1.5) * 0.4, a0: -0.5, a1: -0.5, z0: 0.4, z1: 0.4, e0: -0.4, e1: -0.4 }),         // looking down at their own clothes
  hammer: t => { const s = Math.max(0, Math.sin(t * 8.4)); return { lean: 0.1, sx: 0.3, hx: 0.3, a0: -0.7, e0: -0.6, a1: -0.6 - s * 1.8, e1: -0.6 + s * 0.3,
                                                                  h0: -0.2, k0: 0.25, k1: 0.15, py: -0.05 }; },    // hammering hot iron on the anvil
  knead: t => ({ sx: 0.45, hx: 0.3, a0: -0.9 + Math.sin(t * 6) * 0.25, a1: -0.9 - Math.sin(t * 6) * 0.25, e0: -0.6, e1: -0.6, z0: -0.15, z1: -0.15 }), // kneading dough
  ride: t => ({ py: -0.5 + Math.abs(Math.sin(t * 5)) * 0.04, h0: -1.2, h1: -1.2, k0: 1.3, k1: 1.3, sx: 0.15, a0: -0.7, a1: -0.7, e0: -0.6, e1: -0.6,
                hy: Math.sin(t * 0.4) * 0.4 }),                                                                   // sitting in the saddle, holding the reins
  drive: t => ({ ...SIT, a0: -0.9 + Math.sin(t * 2) * 0.1, a1: -0.9 - Math.sin(t * 2) * 0.1, e0: -0.4, e1: -0.4, hy: Math.sin(t * 0.3) * 0.3 }), // driving a carriage
  carry: t => {                                                                                                    // walking with something held in both arms
    const s = Math.sin(t * 6), c = Math.cos(t * 6);
    return { py: -Math.abs(c) * 0.04, sx: 0.15, h0: s * 0.45, h1: -s * 0.45, k0: Math.max(0, -c) * 0.6 + 0.1, k1: Math.max(0, c) * 0.6 + 0.1,
             a0: -1.1, a1: -1.1, z0: -0.2, z1: -0.2, e0: -0.5, e1: -0.5 };
  }
};

// ---------- Human brains (very simple at first!) ----------
const wild = () => [...beasts, ...iceBeasts];
function closest(h, list, ok, range) {
  let best = null;
  for (const o of list) {
    const d = o.position.distanceTo(h.position);
    if (d < range && ok(o)) { range = d; best = o; }
  }
  return best;
}
// A dry spot near a center (not in the water)
function nearSpot(c, r) {
  for (let i = 0; i < 10; i++) {
    const x = c.x + rand(r), z = c.z + rand(r);
    if (groundHeight(x, z) >= 1) return V(x, groundHeight(x, z), z);
  }
  return c.clone();
}
function homeSpot(h, r) { const u = h.userData; return nearSpot(u.home || h.position, r ?? (u.home ? u.roam : 10)); }
function sayBubble(h, text) {
  if (!text) return;
  const u = h.userData;
  const m = bubbleMat(text), [w, hgt] = m.userData.size;
  u.bubble.material = m;
  u.bubble.scale.set(w, hgt, 1);
  u.bubble.position.set(0, 2.7 + hgt / 2, 0); // just above the name label
  u.bubble.visible = true;
  u.bubbleUntil = landTime + 2 + text.length * 0.06; // longer sentences stay up longer
  speak(h, text);
}

// Start an action: walk or run somewhere (or chase something), then do an animation for a while
function doAct(h, pose, dur, o = {}) {
  const u = h.userData;
  u.act = { pose, dur, ...o, moving: !!(o.to || o.chase), until: landTime + (o.patience || 25) };
  u.actT = 0;
  if (!u.act.moving) arrive(h);
}
function arrive(h) {
  const u = h.userData, a = u.act;
  a.moving = false;
  a.until = landTime + a.dur;
  u.actT = 0;
  sayBubble(h, a.bubble);
  if (a.climb != null) u.fixY = a.climb;
  if (a.arrive) a.arrive();
}

// Primitive brains sometimes do silly things
const DUMB = [
  h => doAct(h, "stare", 3 + Math.random() * 4, { bubble: "..." }),
  h => doAct(h, "scratch", 3, { bubble: line("confused") }),
  h => doAct(h, "wave", 2.5, { bubble: line("chat") }),                                         // waving at nobody
  h => doAct(h, "eat", 2, { bubble: "🪨", next: () => doAct(h, "stare", 1.5, { bubble: "🤢" }) }) // trying to eat a rock
];

function flee(h, threat) {
  const u = h.userData, away = h.position.clone().sub(threat.position).setY(0).normalize().multiplyScalar(15).add(h.position);
  // Primitive brains are slow: they freeze for a moment before running
  doAct(h, "startle", 0.3 + (1 - smarts), { bubble: line("danger"), tag: "flee",
    next: () => doAct(h, u.p.brave < 0.3 ? "cower" : "look", 3, { to: nearSpot(away, 3), run: true, tag: "flee", bubble: line("scared") }) });
}
function chaseAway(b) { b.userData.target = nearSpot(b.position.clone().add(V(rand(40), 0, rand(40))), 5); }
function fight(h, beast) {
  doAct(h, "chest", 1.2, { bubble: line("fight"), tag: "fight",
    next: () => doAct(h, "thrust", 2.5, { chase: beast, run: true, tag: "fight", arrive: () => chaseAway(beast) }) });
}
function hunt(h, prey) {
  const u = h.userData, hit = Math.random() < 0.3 + smarts; // smarter hunters miss less
  doAct(h, "thrust", 2, { chase: prey, run: true, tag: "fight", bubble: line("hunt"),
    arrive: () => hit && age.tribal ? kill(prey) : chaseAway(prey),   // in the tribal era, hunts are for real
    next: () => hit ? (u.hunger = 0, doAct(h, "eat", 4, { bubble: line("meat") })) : doAct(h, "scratch", 2.5, { bubble: line("miss") }) });
}
function forage(h) {
  const u = h.userData;
  doAct(h, "forage", 4 + Math.random() * 3, { to: homeSpot(h, 8), bubble: line("food"),
    next: () => { u.hunger *= 0.4; doAct(h, "eat", 3, { bubble: line("eat") }); } });
}
function chat(h, friend) {
  const u = h.userData;
  doAct(h, "talk", 4, { chase: friend, near: 1.3, face: friend, bubble: line("chat"), arrive: () => {
    u.lonely = 0;
    const f = friend.userData;
    if (f.act && !f.act.tag && f.act.pose !== "sleep") { // the friend grunts back
      f.lonely = 0;
      doAct(friend, pick(["talk", "wave", "talk"]), 3.5, { face: h, bubble: line("chat") });
    }
  } });
}
function shove(h, other) {
  doAct(h, "shove", 1.2, { chase: other, near: 1.1, face: other, bubble: line("shove"), arrive: () => {
    if (other.userData.act?.tag) return;
    other.position.addScaledVector(other.position.clone().sub(h.position).setY(0).normalize(), 0.6);
    doAct(other, "stumble", 1, { bubble: line("shoved"), next: () => doAct(other, "scratch", 2, { bubble: line("confused") }) });
  } });
}
function play(h, friend) {
  h.userData.bored = 0;
  const r = Math.random();
  if (r < 0.4) doAct(h, "dance", 4, { bubble: line("play") });
  else if (r < 0.7 && friend) doAct(h, "dance", 3, { chase: friend, run: true, bubble: line("play") }); // tag, you're it!
  else doAct(h, "dance", 3, { to: homeSpot(h, 8), run: true, bubble: line("play") });
}
function explore(h) {
  h.userData.bored = 0;
  doAct(h, pick(["look", "look", "scratch", "stare"]), 4, { to: homeSpot(h, (h.userData.roam || 10) * 1.5), bubble: line("explore") });
}

// At night, villagers walk in through the hut door and sleep on the fur bed inside
function goToBed(h) {
  const u = h.userData, dur = 15 + u.p.lazy * 10;
  const hut = u.home && closest({ position: u.home }, huts.filter(x => x.scale.x >= 1), () => true, 20);
  if (!hut) return doAct(h, "sleep", dur, { to: homeSpot(h, 3), bubble: "💤", next: () => doAct(h, "stretch", 3, { bubble: line("wake") }) });
  const door = hut.localToWorld(V(0, 0, 2.8)), bed = hut.localToWorld(V(-0.7 + rand(0.3), 0, -0.7 + rand(0.3)));
  doAct(h, "idle", 0, { to: door, next: () => doAct(h, "sleep", dur, { to: bed, bubble: "💤",
    next: () => doAct(h, "stretch", 3, { bubble: line("wake"), next: () => doAct(h, "idle", 0, { to: door }) }) }) });
}
function tendPen(h) {
  const u = h.userData, pen = pens.reduce((a, b) => a.center.distanceTo(h.position) < b.center.distanceTo(h.position) ? a : b);
  const a = Math.random() * 7, spot = pen.center.clone().add(V(Math.cos(a), 0, Math.sin(a)).multiplyScalar(PEN + 0.7));
  doAct(h, "forage", 4, { to: spot, face: pen.center, bubble: line("pen"), next: () => { u.hunger = 0; doAct(h, "eat", 3, { bubble: line("meat") }); } });
}

// Pick what to do next. Needs (hunger, tiredness...) and personality decide how much each choice is wanted.
function think(h) {
  const u = h.userData, p = u.p, night = sunHeight < -0.1;
  if (u.role) return ROLES[u.role](h); // kings, guards, workers and crowds have their own jobs
  if (Math.random() < (1 - smarts) * 0.15) return pick(DUMB)(h); // primitive brain: sometimes they just forget what they were doing
  const fire = closest(h, fires, () => true, 40);
  const huntOK = !age.extinct || (age.bounced && wildPrey().length > 10); // after nearly wiping the animals out, they only hunt when there are plenty
  const prey = age.spears && huntOK && closest(h, wild(), b => (age.tribal ? HUNTABLE : PREY).includes(b.userData.name), age.tribal ? 80 : 25);
  const friend = closest(h, humans, o => o !== h && !o.userData.role && o.userData.act?.pose !== "sleep", 25);
  const wildHorse = age.horses && closest(h, horses, o => o.userData.wild && !o.userData.tamer, 90);
  const horse = age.riding && h.scale.x > 0.7 && closest(h, horses, canBoard, 45);
  const bakery = age.shops && shops.find(s => s.userData.job === "baker" && s.userData.stock > 0 && s.position.distanceTo(h.position) < 60);
  const choices = [
    [wildHorse ? 0.6 + p.brave * 0.6 : 0, () => tame(h, wildHorse)],
    [horse ? 0.4 + p.playful * 0.5 : 0, () => rideHorse(h, horse)],
    [bakery ? u.hunger * 1.2 : 0, () => buyBread(h, bakery)],
    [u.hunger * (prey ? 0.6 + p.brave : 0) * (age.tribal ? 3 : 1), () => hunt(h, prey)],
    [age.pens ? u.hunger * 1.5 : 0, () => tendPen(h)],
    [age.ore && ores.some(o => o.userData.left > 0) ? (age.bronze ? 0.2 : 1) : 0, () => mine(h)],
    [age.paths ? 0.3 * p.social : 0, () => doAct(h, "look", 3, { to: nearSpot(pick(villages).center, 6), bubble: line("visit") })],
    [age.cities && !age.storm ? 0.45 : 0, () => doAct(h, pick(["dance", "talk", "sit", "eat", "cheer"]), 5, { to: homeSpot(h, 6), bubble: line("fun") })],
    [age.fixing && toFix.length ? 1.2 : 0, () => { const b = pick(toFix); doAct(h, "mine", 4, { to: nearSpot(b.position, 6), face: b, bubble: Math.random() < 0.3 ? pick(OOPS) : null }); }],
    [age.metropolis ? 0.4 : 0, () => doAct(h, "look", 4, { to: nearSpot(park.c, park.r), bubble: Math.random() < 0.3 ? pick(["The park is the only green left!", "I love the trees here.", "So peaceful..."]) : null })],
    [age.medieval && !age.fixing && weird.length ? 0.5 : 0, () => { const w = pick(weird); doAct(h, "scratch", 4, { to: nearSpot(w.position, 7), face: w, bubble: line("weird") }); }],
    [age.extinct && !age.pens ? 0.8 : 0, () => doAct(h, pick(["talk", "scratch", "stare"]), 4, { bubble: line("worry") })],
    [u.hunger, () => forage(h)],
    [u.tired * (night ? 2.5 : 0.4) * (0.5 + p.lazy), () => goToBed(h)],
    [0.15 + p.lazy * 0.5, () => doAct(h, "sit", 5 + Math.random() * 8 * p.lazy, { to: u.home ? homeSpot(h, 3) : null })],
    [fire ? ice * 1.5 : 0, () => { const a = Math.random() * 7; doAct(h, "warm", 8, { to: fire.position.clone().add(V(Math.cos(a) * 1.8, 0, Math.sin(a) * 1.8)), face: fire }); }],
    [ice * 0.5, () => doAct(h, "shiver", 4, { bubble: line("cold") })],
    [friend ? u.lonely * p.social * 1.5 : 0, () => chat(h, friend)],
    [u.bored * p.playful, () => play(h, friend)],
    [u.bored * p.curious, () => explore(h)],
    [smarts >= 0.3 ? u.bored * p.curious : 0, () => { u.bored = 0; doAct(h, "knap", 6, { to: homeSpot(h, 3), bubble: line("knap") }); }],
    [p.grumpy * p.brave * 0.3, () => doAct(h, "chest", 3, { bubble: line("chest") })],
    [friend ? p.grumpy * 0.4 : 0, () => shove(h, friend)],
    [(1 - smarts) * 0.3, () => pick(DUMB)(h)],
    [u.tired * 0.3, () => doAct(h, "stretch", 3, { bubble: "🥱" })],
    [0.2, () => doAct(h, "idle", 2 + Math.random() * 4)],
    [0.25 + (1 - p.lazy) * 0.2, () => doAct(h, "idle", 1 + Math.random() * 3, { to: homeSpot(h) })]
  ];
  // Clever humans pick what they need most. Primitive ones are much more random.
  const sharp = 1 + smarts * 4;
  let total = 0;
  for (const c of choices) total += c[0] = Math.pow(c[0], sharp);
  let r = Math.random() * total;
  for (const [w, act] of choices) if ((r -= w) <= 0) return act();
  doAct(h, "idle", 2);
}

function updateHuman(h, dt) {
  const u = h.userData, p = u.p;
  u.actT += dt;
  // Needs slowly grow
  u.hunger = Math.min(1, u.hunger + dt * (age.tribal ? 0.03 : 0.015)); // tribes need lots of food
  u.tired = Math.min(1, u.tired + dt * (sunHeight < -0.1 ? 0.03 : 0.008) * (0.6 + p.lazy));
  u.lonely = Math.min(1, u.lonely + dt * 0.02 * p.social);
  u.bored = Math.min(1, u.bored + dt * 0.025);
  if (!u.act) think(h);
  let a = u.act;
  if (!a.moving && a.pose === "sleep") u.tired = Math.max(0, u.tired - dt * 0.08);
  if (!a.moving && a.pose === "sit") u.tired = Math.max(0, u.tired - dt * 0.02);

  // Watch out for danger (clever humans notice it from further away; sleepers only when it's very close)
  if ((u.look -= dt) < 0) {
    u.look = 0.5;
    if (!a.tag && !u.role) {
      const sleeping = a.pose === "sleep" && !a.moving;
      const threat = closest(h, wild(), b => (DANGER[b.userData.name] || 0) * (1.3 - p.brave) > 0.4, sleeping ? 3 : 6 + smarts * 12);
      if (threat) (age.spears && p.brave > 0.6 ? fight : flee)(h, threat);
      a = u.act;
    }
  }
  // Primitive brains get distracted and forget where they were going
  if (a.moving && !a.tag && !u.role && Math.random() < dt * (1 - smarts) * 0.05) { pick(DUMB)(h); a = u.act; }

  if (a.moving) {
    if (a.chase && !a.chase.parent) return think(h);  // what they were chasing is gone
    const goal = a.chase ? a.chase.position : a.to, to = goal.clone().sub(h.position).setY(0), d = to.length();
    if (d < (a.near || (a.chase ? 2 : 0.6)) || landTime > a.until) arrive(h);
    else {
      h.position.addScaledVector(to.normalize(), Math.min(d, (a.speed || (a.run ? 3.4 : 1.3)) * (1.1 - p.lazy * 0.3) * dt));
      turnTo(h, goal, dt);
      if (a.climb != null) { // going up steps: rise a little with every step forward
        a.climbD ||= d;
        a.climbFrom ??= h.position.y;
        u.fixY = a.climbFrom + (a.climb - a.climbFrom) * (1 - d / a.climbD);
      }
    }
  } else {
    if (a.face) turnTo(h, a.face.position || a.face, dt);
    if (landTime > a.until) {
      u.act = null;
      if (a.next) a.next();
      if (!u.act) think(h); // the next step didn't give them anything to do
      a = u.act;
    }
  }
  h.position.y = u.fixY ?? standHeight(h.position.x, h.position.z);
  if (h.scale.x < u.size) h.scale.setScalar(Math.min(u.size, h.scale.x + dt * 0.02)); // kids grow up
  if (u.bubble.visible && landTime > u.bubbleUntil) u.bubble.visible = false;

  // Animate: blend smoothly from the current pose toward the pose of what they're doing
  let name = a.moving ? (a.move || (a.run ? "run" : "walk")) : a.pose;
  if (landTime < lookUpUntil && name !== "sleep") name = "moon";
  const target = { ...REST, ...POSES[name](u.actT + u.phase, u) };
  if (ice > 0.3 && name !== "warm" && name !== "sleep") target.sz += Math.sin(u.actT * 40) * 0.03; // shivering in the cold
  const P = u.pose, J = u.j, k = Math.min(1, dt * 7);
  for (const key in target) P[key] += (target[key] - P[key]) * k;
  J.pelvis.position.y = 0.92 + P.py;
  J.pelvis.rotation.x = P.lean;
  J.spine.rotation.set(P.sx, P.sy, P.sz);
  J.head.rotation.set(P.hx, P.hy, P.hz);
  J.jaw.rotation.x = P.jaw;
  for (let i = 0; i < 2; i++) {
    J.hips[i].rotation.x = P["h" + i];
    J.knees[i].rotation.x = P["k" + i];
    J.arms[i].rotation.set(P["a" + i], 0, (i ? 1 : -1) * P["z" + i]);
    J.elbows[i].rotation.x = P["e" + i];
  }
  u.spear.rotation.x = P.sp;
  u.pickaxe.visible = name === "mine";
  u.load.visible = name === "haul";
  u.hammer.visible = name === "hammer";
  u.carry.visible = name === "carry";
  u.spear.visible = !!age.spears && !u.dressed && u.role !== "slave" && !["mine", "haul", "place", "throne", "command", "climb", "cheer"].includes(name);
}

// Turn smoothly to face a spot
function turnTo(h, spot, dt) {
  let d = Math.atan2(spot.x - h.position.x, spot.z - h.position.z) - h.rotation.y;
  h.rotation.y += Math.atan2(Math.sin(d), Math.cos(d)) * Math.min(1, dt * 6);
}

// Humans stay close to home: the cave fire at first, later their village
function settle(h) {
  const u = h.userData;
  if (villages.length) { u.home = villages[Math.floor(Math.random() * villages.length)].center; u.roam = 14; }
  else if (campfire) { u.home = campfire.position; u.roam = 4; }
  if (u.home) u.target = u.home.clone();
}

// A spot on dry land, far away from the asteroid crater
function farSpot(min = 50) {
  let p;
  for (let i = 0; i < 500; i++) {   // try at most 500 times, then accept any dry spot
    p = dryspot();
    if (Math.hypot(p.x - impactSpot.x, p.z - impactSpot.z) >= min) break;
  }
  return p;
}

// A campfire: crossed logs in a ring of stones, with a flickering flame that lights things up
function makeFire(pos) {
  const f = new THREE.Group();
  f.position.copy(pos);
  for (let i = 0; i < 4; i++) {
    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2, 6), woodMat);
    log.rotation.set(0, i * 0.8, Math.PI / 2);
    log.position.y = 0.1;
    f.add(log);
  }
  for (let i = 0; i < 8; i++) oval(f, stoneMat, Math.cos(i * 0.8) * 0.75, 0.05, Math.sin(i * 0.8) * 0.75, 0.15, 0.1, 0.15);
  const flame = glowSprite(2.5);
  flame.position.y = 0.8;
  f.add(flame);
  const light = new THREE.PointLight(0xff8833, 1.5, 18);
  light.position.y = 1.2;
  f.add(light);
  f.userData = { flame, light };
  land.add(f);
  fires.push(f);
  return f;
}

// A cave: a big rocky hill with a dark opening facing the middle of the land
function makeCave(spot) {
  const c = new THREE.Group();
  c.position.copy(spot).setY(spot.y - 1);
  c.rotation.y = Math.atan2(-spot.x, -spot.z);
  const hill = new THREE.Mesh(new THREE.DodecahedronGeometry(9, 1), new THREE.MeshStandardMaterial({ color: 0x6b6258, flatShading: true }));
  hill.scale.set(1, 0.65, 1);
  c.add(hill);
  oval(c, new THREE.MeshBasicMaterial({ color: 0x050403 }), 0, 2.2, 7.8, 2.6, 2.6, 1.2); // the dark cave mouth
  land.add(c);
  c.updateMatrixWorld();
  const front = c.localToWorld(V(0, 0, 12));
  front.y = groundHeight(front.x, front.z);
  return front;
}

// Village buildings: round mud huts with straw roofs, and fields of wheat
const thatchTex = makeTexture(64, 64, (g, w, h) => {
  g.fillStyle = "#b08a48"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 600; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    g.strokeStyle = ["#8a6a30", "#d0aa60", "#9a7a3a"][i % 3];
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(2), y + 10); g.stroke();
  }
});
thatchTex.wrapS = thatchTex.wrapT = THREE.RepeatWrapping;
thatchTex.repeat.set(4, 2);
const mudTex = makeTexture(64, 64, (g, w, h) => {
  g.fillStyle = "#8a6a4a"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 80; i++) {
    g.fillStyle = i % 2 ? "#6e5236" : "#a08060";
    g.beginPath(); g.arc(Math.random() * w, Math.random() * h, 2 + Math.random() * 5, 0, 7); g.fill();

function updateVultures(dt, t) {
  for (const v of vultures) {
    const u = v.userData;
    if (u.pile && !u.pile.parent) u.pile = null;
    if (!u.pile && bonePiles.length) {                 // spot some bones
      u.pile = closest(v, bonePiles, () => true, 1e9);
      u.circle = 0;
      u.spot = V(rand(1.2), 0.4, rand(1.2));
    }
    const c = u.pile ? u.pile.position : u.home, landing = u.pile && (u.circle += dt) > 8;
    let flap;
    if (!landing) {                                    // circling high up, mostly gliding
      u.angle += dt * 0.35;
      const y = c.y + (u.pile ? 12 : 30), at = a => V(c.x + Math.cos(a) * 10, y, c.z + Math.sin(a) * 10);
      v.position.lerp(at(u.angle), Math.min(1, dt * 0.8));
      v.lookAt(at(u.angle + 0.4));
      flap = Math.sin(t * 2 + u.angle) * 0.2;
    } else {
      const goal = c.clone().add(u.spot), to = goal.clone().sub(v.position), d = to.length();
      if (d > 0.2) {                                   // swooping down
        v.position.addScaledVector(to.normalize(), Math.min(d, 7 * dt));
        if (d > 1) v.lookAt(goal.x, v.position.y, goal.z);
        flap = Math.sin(t * 9) * 0.6;
      } else {                                         // on the ground, pecking at the bones
        v.rotation.x = 0.3 + Math.max(0, Math.sin(t * 7 + u.angle)) * 0.4;
        flap = -1.2;                                   // wings folded
        if ((u.pile.userData.left -= dt) < 0) { land.remove(u.pile); bonePiles.splice(bonePiles.indexOf(u.pile), 1); }
      }
    }
    u.wings.forEach((w, i) => w.rotation.z = (i ? 1 : -1) * flap);
  }
}

function updateTribal(dt, t) {
  if (!age.tribal) return;
  updateVultures(dt, t);

  if (landTime > nextBirth) {
    nextBirth = landTime + 3;
    const wild = wildPrey(), mom = pick(wild);
    if (mom && Math.random() < 0.6 * (1 - wild.length / 24) && wild.filter(b => b.userData.name === mom.userData.name).length >= 2) {
      addBeast(mom.userData.name, beastSpec(mom.userData.name), beasts, nearSpot(mom.position, 2));
      beasts[beasts.length - 1].scale.setScalar(0.5);
    }
  }
  // Animals in pens are safe, so they have lots of babies. When a pen is full, a young one is set free.
  for (const pen of pens) {
    if (landTime < pen.nextBaby) continue;
    pen.nextBaby = landTime + 6;
    if (pen.animals.length < 7) penAnimal(pen, 0.5);
    else {
      const b = pen.animals.shift();
      penned.splice(penned.indexOf(b), 1);
      beasts.push(b);
      Object.assign(b.userData, { home: null, pen: null, target: dryspot() });
    }
  }
}

// ---------- Solid buildings ----------
// Every building goes in "solids" with r = how far it reaches from its center.
// New buildings check this list so they don't overlap, and you bump into them.
const solids = [], bumpRay = new THREE.Raycaster();
bumpRay.camera = camera; // needed so the ray can skip past glow sprites and labels
const solidAt = o => o.userData.at || o.position;
function footprint(o) { // measure the building at full size (it may still be tiny while it's being built)
  const s = o.scale.x;
  o.scale.setScalar(1); o.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(o), p = o.position;
  o.scale.setScalar(s); o.updateMatrixWorld(true);
  return Math.max(b.max.x - p.x, p.x - b.min.x, b.max.z - p.z, p.z - b.min.z);
}
function fits(o, r = footprint(o)) { // true if this spot doesn't overlap another building
  for (let i = solids.length - 1; i >= 0; i--) if (!solids[i].parent) solids.splice(i, 1); // forget knocked-down buildings
  return !solids.some(s => flatDist(solidAt(s), o.position) < (r + s.userData.r) * 0.85);
}
function solidify(o, r = footprint(o)) { o.userData.r = r; solids.push(o); return o; }
// Would walking by "move" from "from" go into a building or a tree?
function bumped(from, move) {
  const len = Math.hypot(move.x, move.z);
  if (len < 1e-6) return false;
  const near = solids.filter(s => s.parent && flatDist(solidAt(s), from) < s.userData.r + len + 2)
    .concat(trees.filter(t => t.parent && flatDist(t.position, from) < 4));
  if (!near.length) return false;
  bumpRay.far = len + 0.6;
  const dir = V(move.x / len, 0, move.z / len);
  for (const h of [0, -0.9]) { // eyes and chest
    bumpRay.set(V(from.x, from.y + h, from.z), dir);
    const wall = bumpRay.intersectObjects(near, true).some(hit => {
      const past = hit.point.clone().addScaledVector(dir, 0.3);
      return hit.object.isMesh && hit.point.y > standHeight(past.x, past.z) + 0.5; // low steps and floors you can walk onto
    });
    if (wall) return true;
  }
  return false;
}

// A box-shaped block of anything (walls, floors, tables)
function slab(parent, mat, w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}

// Flat stone floors people can stand on (the castle, temples, the pyramid's base)
function standHeight(x, z) {
  let y = groundHeight(x, z);
  for (const p of platforms) {
    const dx = x - p.c.x, dz = z - p.c.z, c = Math.cos(p.rot), s = Math.sin(p.rot);
    if (Math.abs(dx * c - dz * s) < p.hw && Math.abs(dx * s + dz * c) < p.hd) y = Math.max(y, p.y);
  }
  return y;
}

// A dry, flat spot that's far away from some other places
function flatSpot(away, minDist, half) {
  let best = null, bestScore = 1e9;
  for (let i = 0; i < 60; i++) {
    const c = farSpot(), hs = [-1, 1].flatMap(sx => [-1, 1].map(sz => groundHeight(c.x + sx * half, c.z + sz * half)));
    if (Math.min(...hs) < 1.2) continue; // not in the sea
    const score = Math.max(...hs) - Math.min(...hs) + (away.every(p => p.distanceTo(c) > minDist) ? 0 : 100);
    if (score < bestScore) { bestScore = score; best = c; c.top = Math.max(...hs); }
  }
  return best || farSpot();
}

function pathTo(a, b) {
  const d = b.clone().sub(a).setY(0), len = d.length(), q = new THREE.Quaternion().setFromAxisAngle(UP, Math.atan2(d.x, d.z));
  for (let s = 0; s < len; s++) {
    const x = a.x + d.x * s / len, z = a.z + d.z * s / len, y = groundHeight(x, z);
    if (y >= 1) pathQueue.push(new THREE.Matrix4().compose(V(x, y + 0.07, z), q, V(2, 1, 1.3))); // no paths through water
  }
}
function buildPaths() {

  const ore = closest(h, ores, o => o.userData.left > 0, 1e9), a = Math.random() * 7;

  doAct(h, "mine", 5, { to: ore.position.clone().add(V(Math.cos(a) * 2.6, 0, Math.sin(a) * 2.6)), face: ore, bubble: line("mine"), next: () => {

// ---------- The pyramid ----------
const PYR_LAYERS = 7, BLOCK = 2.2, LAYER_H = 1.4;
function startPyramid() {
  age.pyramid = true;
  const c = flatSpot([...villages.map(v => v.center), campfire.position], 40, 10), base = (c.top ?? c.y) - 0.6, W = PYR_LAYERS * BLOCK;
  slab(land, sandMat, W + 2, 4, W + 2, c.x, base - 2, c.z);                    // a flat stone base
  platforms.push({ c: V(c.x, 0, c.z), hw: W / 2 + 1, hd: W / 2 + 1, rot: 0, y: base });
  // Every block is planned now, but only shows up once workers drag it here. The very top is saved for the king.
  let total = 0;
  for (let l = 0; l < PYR_LAYERS - 1; l++) total += (PYR_LAYERS - l) ** 2;
  const blocks = new THREE.InstancedMesh(new THREE.BoxGeometry(BLOCK * 0.97, LAYER_H, BLOCK * 0.97), sandMat, total), m = new THREE.Matrix4();
  let i = 0;
  for (let l = 0; l < PYR_LAYERS - 1; l++) {
    const n = PYR_LAYERS - l;
    for (let x = 0; x < n; x++) for (let z = 0; z < n; z++)
      blocks.setMatrixAt(i++, m.makeTranslation(c.x + (x - (n - 1) / 2) * BLOCK, base + LAYER_H * (l + 0.5), c.z + (z - (n - 1) / 2) * BLOCK));
  }
  blocks.userData.at = V(c.x, 0, c.z); // the blocks sit around the pyramid's center, not at (0,0,0)
  solidify(blocks, W / 2 + 1);
  blocks.count = 0;
  blocks.frustumCulled = false;
  land.add(blocks);
  const qa = Math.random() * 7, quarry = nearSpot(c.clone().add(V(Math.cos(qa) * 22, 0, Math.sin(qa) * 22)), 4);
  for (let k = 0; k < 8; k++) {                                                   // the quarry: piles of cut stone
    const x = quarry.x + rand(2.5), z = quarry.z + rand(2.5);
    slab(land, k % 3 ? sandMat : stoneMat, 0.9, 0.7, 0.9, x, groundHeight(x, z) + 0.35, z).rotation.y = rand(1);
  }
  pyramid = { center: V(c.x, base, c.z), blocks, done: 0, total, top: base + LAYER_H * (PYR_LAYERS - 1), quarry };
  pathTo(nearestVillage(c).center, c);
  pathTo(c, quarry);
  // The rulers force the poorest and weakest people to do the hard work
  const weak = humans.filter(h => !h.userData.role).map(h => [h, (1 - h.userData.p.brave) + (1.1 - h.userData.size) * 2 + Math.random() * 0.5]);
  weak.sort((a, b) => b[1] - a[1]);
  for (const [h] of weak.slice(0, Math.min(16, Math.ceil(humans.length * 0.4)))) {
    h.userData.role = "slave";
    h.userData.act = null;
    setLabel(h, h.userData.name + " (enslaved)");
  }
}
function setLabel(h, text) {
  const u = h.userData;
  h.remove(u.label);
  u.label = makeLabel(text);
  u.label.scale.set(3.4, 0.64, 1);
  u.label.position.y = 2.3;
  h.add(u.label);
}

function buildMonument(kind) {
  const v = pick(villages), g = new THREE.Group();
  MONUMENTS[kind](g);
  let spot;
  for (let i = 0; i < 20; i++) { // look for a free spot near the village
    const a = Math.random() * 7, r = 20 + Math.random() * 14;
    spot = nearSpot(v.center.clone().add(V(Math.cos(a) * r, 0, Math.sin(a) * r)), 3);
    g.position.copy(spot).setY(spot.y - 0.1);
    g.rotation.y = Math.atan2(v.center.x - spot.x, v.center.z - spot.z); // it faces the village
    if (fits(g)) break;
  }
  solidify(g);
  g.scale.setScalar(0.01);                                             // it grows as it's being built
  land.add(g);
  grow.push(g);
  if (kind === "temple") platforms.push({ c: g.position, hw: 4.5, hd: 3, rot: g.rotation.y, y: g.position.y + 0.8 });

function buildCastle() {
  age.castle = true;
  const c = flatSpot([...villages.map(v => v.center), pyramid.center, campfire.position], 45, CW), floorY = (c.top ?? c.y) + 0.3, g = new THREE.Group();
  g.position.set(c.x, floorY, c.z);
  g.rotation.y = Math.atan2(villages[0].center.x - c.x, villages[0].center.z - c.z); // the gate faces a village
  castle = g;
  land.add(g);
  slab(g, castleMat, CW * 2 + 2, 6, CW * 2 + 2, 0, -3, 0);                       // a deep stone platform, so it never floats
  platforms.push({ c: g.position, hw: CW + 1, hd: CW + 1, rot: g.rotation.y, y: floorY });
  // Thick walls with battlements on top, and a gate in the front
  const H = 7;
  slab(g, castleMat, CW * 2, H, 1.2, 0, H / 2, -CW);
  for (const s of [-1, 1]) {
    slab(g, castleMat, 1.2, H, CW * 2, s * CW, H / 2, 0);
    slab(g, castleMat, CW - 2.5, H, 1.2, s * (CW + 2.5) / 2, H / 2, CW);
  }
  slab(g, castleMat, 5, 2, 1.6, 0, H - 1, CW);                                     // the arch over the gate
  for (let i = -CW; i <= CW; i += 1.6)
    for (const [x, z] of [[i, -CW], [i, CW], [-CW, i], [CW, i]]) slab(g, castleMat, 0.7, 0.8, 0.7, x, H + 0.4, z);
  for (const x of [-CW, CW]) for (const z of [-CW, CW]) tower(g, x, z, 2.4, H + 4);
  for (const s of [-1, 1]) tower(g, s * 3.3, CW, 1.4, H + 2);                      // gate towers
  // The throne hall at the back, with a big door
  const hz = -CW + 6.5, HW = 5, HD = 5, HH = 6;
  slab(g, castleMat, HW * 2, HH, 0.6, 0, HH / 2, hz - HD);
  for (const s of [-1, 1]) {
    slab(g, castleMat, 0.6, HH, HD * 2, s * HW, HH / 2, hz);
    slab(g, castleMat, HW - 1.2, HH, 0.6, s * (HW + 1.2) / 2, HH / 2, hz + HD);
  }
  slab(g, castleMat, 2.4, HH - 3.2, 0.6, 0, HH - (HH - 3.2) / 2, hz + HD);
  slab(g, castleMat, HW * 2 + 1, 0.5, HD * 2 + 1, 0, HH + 0.25, hz);
  const hallRoof = new THREE.Mesh(new THREE.ConeGeometry(HW * 1.45, 3, 4), roofBlue);
  hallRoof.position.set(0, HH + 2, hz); hallRoof.rotation.y = Math.PI / 4;
  g.add(hallRoof);
  // Inside: a red carpet, a golden throne with a footstool, banners and torches
  const carpet = new THREE.Mesh(new THREE.PlaneGeometry(1.6, CW - hz + 2).rotateX(-Math.PI / 2), redMat);
  carpet.position.set(0, 0.02, (hz - HD + 1.5 + CW + 2) / 2);
  g.add(carpet);
  const tz = hz - HD + 1.5;
  slab(g, goldMat, 1.3, 0.9, 1, 0, 0.45, tz);
  slab(g, redMat, 1.1, 0.06, 0.9, 0, 0.93, tz + 0.02);
  slab(g, goldMat, 1.3, 2.6, 0.25, 0, 1.3, tz - 0.5);
  for (const s of [-1, 1]) slab(g, goldMat, 0.2, 0.4, 1, s * 0.65, 1.1, tz);
  spike(g, goldMat, 0.18, 0.5, V(0, 2.6, tz - 0.5), UP);
  slab(g, castleMat, 1, 0.45, 0.6, 0, 0.22, tz + 0.6);
  for (const s of [-1, 1]) {
    const banner = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 3), redMat);
    banner.position.set(s * 3, 3.2, hz - HD + 0.35);
    g.add(banner);
    oval(g, goldMat, s * 3, 3.6, hz - HD + 0.4, 0.3, 0.3, 0.03);
    spike(g, woodMat, 0.05, 1.8, V(s * 4.3, 0, hz), UP, 0.05);
    const torch = glowSprite(1.4);
    torch.position.set(s * 4.3, 2, hz);
    g.add(torch);
  }
  g.updateMatrixWorld();
  const at = (x, z) => g.localToWorld(V(x, 0, z));
  g.userData = { throne: at(0, tz + 0.1), front: at(0, tz + 6) };
  solidify(g, CW + 1);
  pathTo(nearestVillage(c).center, at(0, CW + 3));
  // The king sits on the throne
  addHuman(at(0, tz + 0.1));
  king = humans[humans.length - 1];
  const k = king.userData;
  Object.assign(k, { role: "king", size: 1, act: null });
  king.scale.setScalar(1);
  king.rotation.y = g.rotation.y;
  const crown = new THREE.Group();                                  // a golden crown
  crown.position.set(0, 0.22, -0.01);
  k.j.head.add(crown);
  crown.add(new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.1, 0.09, 12), goldMat));
  for (let i = 0; i < 6; i++) spike(crown, goldMat, 0.025, 0.08, V(Math.sin(i * 1.05) * 0.11, 0.04, Math.cos(i * 1.05) * 0.11), UP);
  k.crown = crown;
  const robe = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.32, 0.75, 12, 1, true), redMat);
  robe.position.y = 0.2;
  k.j.spine.add(robe);
  setLabel(king, "King " + k.name);
  // Royal guards: two at the gate and two beside the throne
  for (const [x, z, look] of [[-2.2, CW + 2, 9], [2.2, CW + 2, 9], [-1.8, tz + 1, 3], [1.8, tz + 1, 3]]) {
    addHuman(at(x, z));
    const gd = humans[humans.length - 1], u = gd.userData;
    Object.assign(u, { role: "guard", act: null, post: at(x, z), watch: at(x, z + look), size: 1.05 });
    gd.scale.setScalar(1.05);
    oval(u.j.head, bronzeMat, 0, 0.16, -0.01, 0.12, 0.09, 0.13);   // bronze helmet
    oval(u.j.head, redMat, 0, 0.25, -0.02, 0.025, 0.06, 0.12);     // red crest
    oval(u.j.spine, bronzeMat, 0, 0.33, 0.01, 0.22, 0.2, 0.14);    // bronze chest armor
    u.tip.material = bronzeMat;
    setLabel(gd, "Royal guard " + u.name);
  }
}

// ---------- Jobs for kings, guards, workers and crowds ----------
const COMMANDS = [
  ["Work faster! My pyramid must be finished!", () => { hurryUntil = landTime + 12; humans.filter(h => h.userData.role === "slave").forEach(h => sayBubble(h, "Yes, my king...")); }],
  ["Build a new temple in my honor!", () => built++ < 24 && buildMonument("temple")],
  ["Raise a giant statue of me!", () => built++ < 24 && buildMonument("statue")],
  ["Put up a tall obelisk!", () => built++ < 24 && buildMonument("obelisk")],
  ["Guards! Stand tall and guard the gate!", () => humans.filter(h => h.userData.role === "guard").forEach(h => sayBubble(h, "Yes, Your Majesty!"))],
  ["Let the people dance and celebrate!", () => humans.filter(h => !h.userData.role && !h.userData.act?.tag).forEach(h => doAct(h, "dance", 4, { bubble: line("play") }))],
  ["Everyone must bow to their king!", () => humans.filter(h => !h.userData.role && !h.userData.act?.tag).forEach(h => doAct(h, "bow", 3, { bubble: "Yes, my king!" }))]
];
const CROWD = ["Here comes the king!", "Look how tall the pyramid is!", "I can't believe we built this!", "I hope I can see from back here!",
               "The king is going to place the last block!", "This is the biggest day in history!"];
const CHEERS = ["Long live the king!", "Hooray!", "The pyramid is finished!", "What a wonderful day!", "We did it!"];
const ROLES = {
  slave(h) {   // drag a block from the quarry to the pyramid, again and again
    const u = h.userData, a = Math.random() * 7;
    if (u.tired > 0.8) return doAct(h, "sit", 5, { bubble: line("slave"), next: () => { u.tired = 0.2; think(h); } });
    const drop = pyramid.center.clone().add(V(Math.cos(a), 0, Math.sin(a)).multiplyScalar(PYR_LAYERS * BLOCK / 2 + 1.5));
    doAct(h, "forage", 2.5, { to: nearSpot(pyramid.quarry, 3), bubble: Math.random() < 0.4 ? line("slave") : null, next: () =>
      doAct(h, "idle", 0.5, { to: drop, move: "haul", speed: landTime < hurryUntil ? 1.4 : 0.9, next: () => {
        pyramid.done = Math.min(pyramid.total, pyramid.done + 4);
        pyramid.blocks.count = pyramid.done;
        think(h);
      } }) });
  },
  guard(h) {
    const u = h.userData;
    if (age.storm) {   // the guards try to hold back the crowd, but there are too many people
      if (landTime > stormAt + 12) { u.role = null; setLabel(h, u.name + " the " + u.kind); return flee(h, king); }
      return doAct(h, "thrust", 2, { face: closest(h, humans, o => o.userData.role === "mob", 30) || u.watch, bubble: Math.random() < 0.3 ? "Stay back! Protect the king!" : null });
    }
    doAct(h, "guard", 8, { to: u.post.distanceTo(h.position) > 0.5 ? u.post : null, face: u.watch });
  },
  escort(h) {  // catch the person keeping a servant, then follow them to their sentence
    const j = justice;
    if (!j) { h.userData.role = "guard"; return ROLES.guard(h); }
    if (!j.caught) return doAct(h, "idle", 0, { chase: j.rich, run: true, near: 1.5, patience: 999, bubble: "Halt! Keeping slaves is against the law!", next: () => { j.caught = true; lead(j); think(h); } });
    doAct(h, "guard", 1, { chase: j.rich, near: 2.2, face: j.rich });
  },
  servant(h) { // follow the rich master around and do what they say
    const u = h.userData, m = u.master;
    if (!m || !m.parent) { freeServant(h); return think(h); }
    if (Math.random() < 0.15) sayBubble(m, pick(RICH_ORDERS));
    doAct(h, pick(["bow", "idle", "forage"]), 2.5, { chase: m, near: 1.6, face: m, bubble: Math.random() < 0.25 ? line("servant") : null });
  },
  prisoner: h => doAct(h, "cower", 2),
  mob(h) {     // march on the castle and surround the king
    const u = h.userData, shout = () => Math.random() < 0.3 ? pick(MOB) : null;
    if (age.kingDown) return doAct(h, pick(["cheer", "dance"]), 3, { bubble: Math.random() < 0.4 ? pick(["The king is gone!", "Freedom!", "A new age begins!"]) : null });
    if (!u.inside) return doAct(h, "riot", 0, { to: castle.localToWorld(V(rand(2), 0, CW + 4)), run: true, bubble: shout(), next: () => { u.inside = true; think(h); } });
    if (h.position.distanceTo(king.position) < 3.5) return doAct(h, "thrust", 1.5, { face: king, bubble: shout() }); // attack!
    doAct(h, "riot", 0, { chase: king, run: true, near: 1.5 + Math.random() * 1.5, patience: 999, bubble: shout() });
  },
  fallen: h => doAct(h, "sleep", 999),
  king(h) {
    if (age.storm) return doAct(h, "command", 2, { face: castle.userData.front, bubble: pick(["Guards! Guards!", "Stay back, all of you!", "I only wanted to end slavery!"]) });

    if (Math.random() < 0.5) return doAct(h, "throne", 4 + Math.random() * 4, { face: castle.userData.front });
    const [order, effect] = pick(age.ban ? BAN_COMMANDS : COMMANDS.slice(age.capstone ? 1 : 0)); // no more pyramid orders once it's done

function updateCivilization(dt) {
  if (pathQueue.length) {   // path builders lay down a few steps every second
    pathBuild += dt * 25;
    while (pathBuild >= 1 && pathQueue.length && pathMesh.count < 4000) { pathMesh.setMatrixAt(pathMesh.count++, pathQueue.shift()); pathBuild--; }
    pathMesh.instanceMatrix.needsUpdate = true;
  } else pathBuild = 0;
  for (const g of grow) if (g.scale.x < 1) g.scale.setScalar(Math.min(1, g.scale.x + dt * 0.15));
  if (age.monuments && !age.crowd && built < 14 && landTime > nextBuild) {
    buildMonument(pick(Object.keys(MONUMENTS)));
    nextBuild = landTime + 5;
    built++;
  }
}

function makeServant() {

  if (free.length < 3) return;
  let rich = free.find(h => h.userData.rich);

    rich = pick(free);

    oval(rich.userData.j.spine, goldMat, 0, 0.47, 0.08, 0.13, 0.03, 0.07);
    setLabel(rich, rich.userData.name + " the Rich");
  }
  const servant = free.filter(h => h !== rich && !h.userData.rich).sort((a, b) => a.userData.p.brave - b.userData.p.brave)[0];
  if (!servant) return;
  rich.userData.servant = servant;
  Object.assign(servant.userData, { role: "servant", master: rich, act: null });

  sayBubble(rich, "You! You're my servant now.");

function freeServant(s) {

  sayBubble(s, "I'm free!");
}

function updateDevices(dt) {
  for (const d of devices) {
    if (d.t == null) continue;
    const t = d.t += dt;
    if (d.kind === "guillotine") d.blade.position.y = t < 0.3 ? 4.8 - t / 0.3 * 2.8 : t < 1.5 ? 2 : Math.min(4.8, 2 + (t - 1.5) * 1.4);
    else d.trap.rotation.z = t < 0.2 ? -t / 0.2 * 1.5 : t < 2 ? -1.5 : Math.min(0, -1.5 + (t - 2) * 1.5);
    if (d.victim && t >= 0.25) {                            // poof!

let park = null, paveR = 0, nextPave = 0, nextHouse = 0, nextFix = 0;
const cityHomes = [], cityQueue = [], toFix = [], paveD = [];

function housePart(g, geo, mat, sx, sy, sz, x, y, z) {
  const m = new THREE.Mesh(geo, mat);
  m.scale.set(sx, sy, sz);
  m.position.set(x, y, z);
  g.add(m);
  return m;
}
// Four walls with a doorway in the middle of the front (+z) wall, so you can walk inside
function hollowWalls(g, mat, w, d, hgt, door, dh) {
  const t = 0.25, side = (w - door) / 2;
  housePart(g, MED_BOX, mat, w, hgt, t, 0, hgt / 2, -d / 2 + t / 2);                              // back
  for (const s of [-1, 1]) {
    housePart(g, MED_BOX, mat, t, hgt, d, s * (w / 2 - t / 2), hgt / 2, 0);                         // left and right
    housePart(g, MED_BOX, mat, side, hgt, t, s * (door / 2 + side / 2), hgt / 2, d / 2 - t / 2);    // front, beside the door
  }
  housePart(g, MED_BOX, mat, door, hgt - dh, t, 0, dh + (hgt - dh) / 2, d / 2 - t / 2);              // above the door
}
// Furniture for a room of size w x d. Far-away houses hide it (in the land loop) so the game stays fast.
function furnishRoom(g, w, d, hgt) {
  const r = new THREE.Group(), x0 = w / 2 - 0.25, z0 = d / 2 - 0.25; // x0, z0: from the middle to the inside of the walls
  g.add(r);
  g.userData.inside = r;
  housePart(r, MED_BOX, woodMat, w - 0.5, 0.1, d - 0.5, 0, 0.25, 0);                     // plank floor
  housePart(r, MED_BOX, pick(clothMats), 1.6, 0.03, 1.1, 0, 0.31, 0.6);                  // rug
  housePart(r, MED_BOX, darkWood, 1.1, 0.45, 2, -x0 + 0.6, 0.45, -z0 + 1.05);           // bed in the back corner
  housePart(r, MED_BOX, pick(clothMats), 1.0, 0.12, 1.5, -x0 + 0.6, 0.72, -z0 + 1.3);   // blanket
  housePart(r, MED_BOX, plasterMat, 0.8, 0.15, 0.35, -x0 + 0.6, 0.74, -z0 + 0.3);       // pillow
  housePart(r, MED_BOX, stoneMat, 1.3, 1.3, 0.5, x0 - 0.9, 0.65, -z0 + 0.25);           // fireplace
  housePart(r, MED_BOX, emberMat, 0.7, 0.08, 0.3, x0 - 0.9, 0.35, -z0 + 0.55);          // glowing coals
  housePart(r, MED_BOX, woodMat, 1.2, 0.08, 0.8, x0 - 0.8, 0.95, 0.4);                  // table
  housePart(r, MED_BOX, woodMat, 0.15, 0.65, 0.15, x0 - 0.8, 0.6, 0.4);
  for (const s of [-1, 1]) housePart(r, MED_BOX, darkWood, 0.4, 0.45, 0.4, x0 - 0.8 + s * 0.85, 0.5, 0.4); // stools
  oval(r, clayMat, x0 - 0.7, 1.08, 0.4, 0.12, 0.14, 0.12);                               // a jug on the table
  housePart(r, MED_BOX, woodMat, 0.3, 0.06, 1.2, -x0 + 0.15, 1.6, 0.9);                 // shelf with pots
  for (const z of [0.5, 0.9, 1.3]) oval(r, clayMat, -x0 + 0.15, 1.75, z, 0.1, 0.12, 0.1);
  if (hgt > 4) { // tall houses get an upstairs loft and a ladder
    housePart(r, MED_BOX, woodMat, w - 0.5, 0.15, d / 2 - 0.25, 0, 2.9, -d / 4 + 0.125);
    for (const s of [-1, 1]) housePart(r, MED_BOX, darkWood, 0.08, 2.7, 0.08, -0.4 + s * 0.25, 1.6, 0.1);
    for (let i = 0; i < 6; i++) housePart(r, MED_BOX, darkWood, 0.5, 0.06, 0.06, -0.4, 0.7 + i * 0.4, 0.1);
    housePart(r, MED_BOX, darkWood, 1, 0.6, 0.6, x0 - 0.7, 3.27, -z0 + 0.5);            // a chest up in the loft
  }
}
function medievalHouse(g) {   // a timber-framed house with a steep roof, a chimney, and a room inside
  const w = 4 + Math.random() * 2, d = 4 + Math.random() * 2, hgt = Math.random() < 0.5 ? 3 : 5.5, door = 1.3, dh = 2.3;
  hollowWalls(g, plasterMat, w, d, hgt, door, dh);
  const by = Math.max(hgt * 0.55, dh + 0.15);                                    // a timber beam around the middle
  for (const s of [-1, 1]) {
    housePart(g, MED_BOX, darkWood, w + 0.1, 0.25, 0.1, 0, by, s * (d / 2 + 0.03));
    housePart(g, MED_BOX, darkWood, 0.1, 0.25, d + 0.1, s * (w / 2 + 0.03), by, 0);
  }
  housePart(g, MED_BOX, darkWood, 0.08, dh - 0.1, door - 0.1, -door / 2 + 0.04, dh / 2, d / 2 - 0.25 - door / 2); // the door, swung open
  for (const s of [-1, 1]) housePart(g, MED_BOX, windowMat, 0.6, 0.6, 0.1, s * w * 0.3, hgt * 0.75, d / 2);
  furnishRoom(g, w, d, hgt);
  housePart(g, MED_ROOF, roofBrown, w * 1.45, 3, d * 1.45, 0, hgt + 1.5, 0);
  housePart(g, MED_BOX, stoneMat, 0.6, 2, 0.6, w * 0.25, hgt + 2, 0);          // chimney
  g.userData.dims = { w, d, hgt };
  g.userData.h = hgt + 3;
}
// Some houses get built with a "baffling" mistake that gets fixed later
const MISTAKES = [
  g => g.rotation.z = Math.random() < 0.5 ? 0.4 : -0.4,                   // leaning over
  g => { g.rotation.x = Math.PI; g.position.y += g.userData.h; },          // upside down, balanced on its roof
  g => g.position.y += 4 + Math.random() * 3,                              // floating in the air
  g => { g.rotation.z = Math.PI / 2; g.position.y += 3; }                  // lying on its side
];
const flatDist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
function blocked(p) {
  return villages.some(v => flatDist(v.center, p) < 44) || (castle && flatDist(castle.position, p) < 34) ||
         (pyramid && flatDist(pyramid.center, p) < 18) || weird.some(w => flatDist(w.position, p) < 9);
}
const nearestCity = p => Math.min(...villages.map(v => flatDist(v.center, p)));
// Plants and trees can only grow in the park once the city covers everything else
function natureSpot() { return park ? nearSpot(park.c, park.r) : dryspot(); }

function startMetropolis() {
  age.metropolis = true;
  let c = dryspot();
  for (let i = 0; i < 300 && (blocked(c) || groundHeight(c.x, c.z) > 6); i++) c = dryspot(); // a free spot for the park
  park = { c, r: 20 };
  for (let x = -115; x <= 115; x += 11) for (let z = -115; z <= 115; z += 11) {
    const p = V(x + rand(2), 0, z + rand(2));
    p.y = groundHeight(p.x, p.z);
    if (p.y > 1.2 && flatDist(p, park.c) > park.r + 5 && !blocked(p)) cityQueue.push(p);
  }
  cityQueue.sort((a, b) => nearestCity(b) - nearestCity(a));  // the city spreads outward from the old cities (popped from the end)
  const lp = landGeo.attributes.position;
  for (let i = 0; i < lp.count; i++) {                         // how far each bit of ground is from a city
    const p = V(lp.getX(i), 0, lp.getZ(i));
    paveD.push(lp.getY(i) < 1 || flatDist(p, park.c) < park.r ? Infinity : nearestCity(p));
  }
  paveR = 30;
}
function buildCityHouse() {
  const p = cityQueue.pop(), g = new THREE.Group();
  medievalHouse(g);
  g.position.copy(p).setY(p.y - 0.1);
  g.userData.y = g.position.y;
  g.rotation.y = Math.atan2(rand(1), rand(1));
  if (Math.random() < 0.35) { pick(MISTAKES)(g); g.userData.wrong = true; }
  if (!fits(g)) return; // no room here: skip this house
  solidify(g);
  g.scale.setScalar(0.01);
  land.add(g);
  grow.push(g);
  cityHomes.push(g);
}
function pave() {   // stone streets spread out, and nature outside the park disappears
  const col = landGeo.attributes.position;
  for (let i = 0; i < col.count; i++) if (paveD[i] < paveR) {
    const shade = 0.8 + Math.random() * 0.35;
    for (let j = 0; j < 3; j++) dirtColors[i * 3 + j] = grassColors[i * 3 + j] = [cobble.r, cobble.g, cobble.b][j] * shade;
    paveD[i] = Infinity;
  }
  paintGrass();
  for (const list of [plants, trees]) for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i];
    if (flatDist(p.position, park.c) > park.r && nearestCity(p.position) < paveR) { land.remove(p); list.splice(i, 1); }
  }
}
function startFixing() {
  age.fixing = true;
  toFix.push(...weird, ...cityHomes.filter(g => g.userData.wrong));
  toFix.sort(() => Math.random() - 0.5);
}
function fixBuilding() {
  const b = toFix.pop();
  puff(b.position);
  if (weird.includes(b)) {                                    // tear down the weird building and build a normal house there
    land.remove(b);
    weird.splice(weird.indexOf(b), 1);
    const g = new THREE.Group();
    medievalHouse(g);
    g.position.copy(b.position);
    g.userData.y = g.position.y;
    g.rotation.y = b.rotation.y;
    solidify(g);
    g.scale.setScalar(0.01);
    land.add(g);
    grow.push(g);
    cityHomes.push(g);
  } else {                                                    // turn the house the right way up
    b.rotation.set(0, b.rotation.y, 0);
    b.position.y = b.userData.y;
    b.userData.wrong = false;
  }
  for (const h of humans) if (!h.userData.role && flatDist(h.position, b.position) < 20 && Math.random() < 0.5)
    doAct(h, pick(["cheer", "wave", "look"]), 3, { face: b, bubble: Math.random() < 0.4 ? pick(OOPS) : null });
  if (!toFix.length) age.fixed = true;
}
function updateMetropolis(dt) {
  if (!age.metropolis) return;
  if (cityQueue.length && landTime > nextHouse) { buildCityHouse(); nextHouse = landTime + 0.3; }
  if (landTime > nextPave) { paveR += 6; pave(); nextPave = landTime + 1; }
  if (age.fixing && toFix.length && landTime > nextFix) { fixBuilding(); nextFix = landTime + 1.2; }
  // With 200 people, only draw the ones near you so the game doesn't lag
  for (const h of humans) h.visible = h.position.distanceTo(camera.position) < 110;
}

// ---------- Town life: real clothes, horses, carriages and shops with real jobs ----------
const shirtMats = ["#3a5a8a", "#8a2a2a", "#2a6a3a", "#c8a050", "#6a3a7a", "#d8d0c0", "#a05a2a"].map(c => new THREE.MeshStandardMaterial({ color: c }));
const pantsMats = ["#3a3028", "#2a2a3a", "#4a3a2a", "#555048"].map(c => new THREE.MeshStandardMaterial({ color: c }));
const leatherMat = new THREE.MeshStandardMaterial({ color: 0x4a2e1a });
const ironMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3e, metalness: 0.7, roughness: 0.4 });
const hotIronMat = new THREE.MeshBasicMaterial({ color: 0xff8a2a });                  // iron glowing hot from the forge
const coalMat = new THREE.MeshStandardMaterial({ color: 0x1a1816, flatShading: true });
const emberMat = new THREE.MeshBasicMaterial({ color: 0xff5a10 });
const flourMat = new THREE.MeshStandardMaterial({ color: 0xe8e0cc });
const doughMat = new THREE.MeshStandardMaterial({ color: 0xf0dcb0 });
const breadMat = new THREE.MeshStandardMaterial({ color: 0xb8722a });
const hayMat = new THREE.MeshStandardMaterial({ color: 0xd8c060, flatShading: true });
const OUTDATED = ["Wait... are we still wearing animal skins?!", "These furs are SO outdated.", "Ew, this smells like a mammoth.",
                  "I need a shirt. And pants!", "We live in a city and dress like cave people!"];
const DRESSED = ["Much better!", "Look at my new shirt!", "Real shoes! My feet are so happy.", "Do you like my hat?", "Now THAT is fashion."];
const RIDE_DONE = ["What a ride!", "Thank you, horse!", "Faster than walking!", "Let's do that again!"];
const HORSE = { h: 1.1, len: 1.7, legs: "slim", neck: 0.75, neckUp: 0.9, head: 0.38, ears: 0.12, tail: 0.6, speed: 1.4 };
const HORSE_COATS = [["#6a4428", "#3a2414", "#a07850"], ["#2a2420", "#141010", "#5a504a"], ["#c8c0b0", "#8a8478", "#f0ece0"], ["#a0602a", "#6a3a14", "#e0b080"]];
// Where riders sit, relative to the horse: the saddle, or the driver's bench and the back seat of a carriage
const SADDLE = V(0, 1.2, -0.05), DRIVER = V(0, 1.37, -1.35), BACK_L = V(0.4, 0.97, -3.25), BACK_R = V(-0.4, 0.97, -3.25);
const horses = [], shops = [], sparks = [];
let nextDress = 0, nextClop = 0;
const nearYou = o => o.getWorldPosition(hearPos).distanceTo(camera.position) < 35;

// Real clothes: a shirt with sleeves, a belt, trousers, shoes and sometimes a hat. The old fur skirt and cape come off.
function dress(h) {
  const u = h.userData, J = u.j, shirt = pick(shirtMats), pants = pick(pantsMats);
  u.skirt.visible = false;
  if (u.cape) u.cape.visible = false;
  oval(J.pelvis, pants, 0, 0.02, 0, 0.18, 0.11, 0.12);
  oval(J.spine, shirt, 0, 0.16, 0.02, 0.17, 0.17, 0.13);
  oval(J.spine, shirt, 0, 0.36, 0, 0.22, 0.18, 0.14);
  oval(J.spine, leatherMat, 0, 0.05, 0.01, 0.175, 0.035, 0.125);
  for (let i = 0; i < 2; i++) {
    bone(J.arms[i], shirt, 0.065, 0.055, 0.3);                               // sleeve
    bone(J.hips[i], pants, 0.09, 0.07, 0.46);                                // trouser legs
    bone(J.knees[i], pants, 0.07, 0.05, 0.42);
    oval(J.knees[i], leatherMat, 0, -0.44, 0.05, 0.065, 0.045, 0.13);        // shoe
  }
  if (Math.random() < 0.35) { oval(J.head, pants, 0, 0.19, -0.01, 0.16, 0.025, 0.16); oval(J.head, pants, 0, 0.23, -0.01, 0.1, 0.07, 0.1); } // hat
  u.dressed = true;
}
// Look down at the old furs, walk home to change, and come back out in real clothes
function getDressed(h) {
  const home = closest(h, cityHomes, () => true, 40), door = home ? nearSpot(home.position, 4) : homeSpot(h, 4);
  doAct(h, "inspect", 3, { bubble: pick(OUTDATED), tag: "dress", next: () =>
    doAct(h, "idle", 0.5, { to: door, tag: "dress", next: () => { dress(h); doAct(h, "cheer", 2.5, { bubble: pick(DRESSED) }); } }) });
}
function startClothes() { age.clothes = true; }

// ---------- Horses ----------
function addHorse(pos) {
  addBeast("Wild horse", { ...HORSE, fur: pick(HORSE_COATS) }, horses, pos);
  const g = horses[horses.length - 1], u = g.userData;
  Object.assign(u, { wild: true, trust: 0, seats: [SADDLE], riders: [null], stops: [], label: g.children.find(c => c.isSprite), target: nearSpot(park.c, park.r) });
}
function startHorses() {
  age.horses = true;
  for (let i = 0; i < 10; i++) addHorse(nearSpot(park.c, park.r));
}
function renameHorse(g, text) {
  const u = g.userData, y = u.label.position.y;
  g.remove(u.label);
  u.label = makeLabel(text);
  u.label.scale.set(5, 0.94, 1);
  u.label.position.y = y;
  g.add(u.label);
}
// Walk up slowly, hold out a hand and talk softly. After two visits the horse trusts people and gets a saddle.
function tame(h, g) {
  const hu = g.userData;
  hu.tamer = h;
  doAct(h, "talk", 4, { chase: g, near: 2, face: g, run: true, tag: "tame", patience: 30,
    bubble: pick(["Easy... easy...", "Shh, I won't hurt you.", "Who's a good horse?", "Here, have an apple! 🍎"]), next: () => {
      hu.tamer = null;
      if (++hu.trust >= 2 && hu.wild) {
        hu.wild = false;
        oval(g, leatherMat, 0, 1.53, -0.05, 0.33, 0.1, 0.32);                      // saddle
        oval(g, leatherMat, 0, 1.25, 0, 0.34, 0.03, 0.2);                           // strap under the belly
        renameHorse(g, "Horse");
        if (nearYou(g)) sfx.neigh();
        doAct(h, "cheer", 2.5, { bubble: "I tamed a horse! 🐴" });
      } else doAct(h, "wave", 2, { bubble: hu.wild ? "It's starting to trust me!" : "Such a nice horse." });
    } });
}
// A horse can take riders when it's tame, standing still, rested and has a free seat
function canBoard(g) {
  const u = g.userData;
  return !u.wild && !u.stops.length && landTime > (u.rest || 0) && u.riders.includes(null);
}
const seatPose = h => { const u = h.userData; return u.horse.userData.cart ? (u.seat ? "sit" : "drive") : "ride"; };
const seatSpot = (g, v) => v.clone().applyAxisAngle(UP, g.rotation.y).add(g.position);
// Walk to a free seat, climb on, and wait for the horse to set off
function rideHorse(h, g) {
  const u = h.userData, hu = g.userData, i = hu.riders.indexOf(null);
  hu.riders[i] = h;
  hu.firstAt ||= landTime;
  Object.assign(u, { role: "rider", horse: g, seat: i, mounted: false });
  const side = hu.seats[i];
  doAct(h, "idle", 0, { to: seatSpot(g, V(side.x >= 0 ? 1.3 : -1.3, 0, side.z)), patience: 20, next: () => {
    u.mounted = true;
    doAct(h, seatPose(h), 30, { bubble: Math.random() < 0.5 ? pick(["Giddy up!", "Let's go!", "Hold on tight!", "To the other side of town!"]) : null });
  } });
}
function dismount(g) {
  const hu = g.userData;
  hu.riders.forEach((r, i) => {
    if (!r) return;
    Object.assign(r.userData, { role: null, horse: null, mounted: false, fixY: null });
    r.position.copy(seatSpot(g, V(i === 2 ? -1.3 : 1.3, 0, hu.seats[i].z)));
    doAct(r, "stretch", 2, { bubble: Math.random() < 0.5 ? pick(RIDE_DONE) : null });
  });
  hu.riders = hu.seats.map(() => null);
  hu.firstAt = 0;
  hu.rest = landTime + 6;
}
// Move toward a spot, turning smoothly. Returns true once it's there.
function trot(g, to, speed, dt) {
  const d = V(to.x - g.position.x, 0, to.z - g.position.z), len = d.length();
  if (len < 1) return true;
  g.position.addScaledVector(d.normalize(), Math.min(len, speed * dt));
  g.position.y = groundHeight(g.position.x, g.position.z);
  const turn = Math.atan2(d.x, d.z) - g.rotation.y;
  g.rotation.y += Math.atan2(Math.sin(turn), Math.cos(turn)) * Math.min(1, dt * 3);
  return false;
}
function updateHorse(g, dt, t) {
  const u = g.userData;
  let speed = 0;
  if (u.wild) {                                     // wild horses wander the park, and hold still while someone talks to them
    if (u.tamer && u.tamer.position.distanceTo(g.position) < 6) u.wait = 1;
    if (u.wait > 0) u.wait -= dt;
    else if (trot(g, u.target, (speed = u.speed), dt)) { u.target = nearSpot(park.c, park.r); u.wait = Math.random() * 4; }
  } else if (u.stops.length) {                      // on a trip: trot from stop to stop, then everyone gets off
    if (trot(g, u.stops[0], (speed = u.cart ? 3.5 : 4.5), dt)) {
      u.stops.shift();
      if (!u.stops.length) dismount(g);
    }
  } else if (u.riders[0]?.userData.mounted && u.riders.every(r => !r || r.userData.mounted) &&
             (!u.riders.includes(null) || landTime > u.firstAt + 8)) {        // everyone is on: set off to a few places in the city
    const near = cityHomes.filter(c => flatDist(c.position, g.position) < 70);
    u.stops = [0, 1, 2].map(() => nearSpot(pick(near.length ? near : cityHomes).position, 5));
    if (nearYou(g)) sfx.neigh();
  }
  // Legs and wheels move with the speed; the head goes down to eat hay
  u.legs.forEach((l, i) => l.rotation.x = speed ? Math.sin(t * u.step * speed / 1.4 + u.phase + [0, Math.PI, Math.PI, 0][i]) * 0.45 : 0);
  u.head.rotation.x += ((landTime < (u.eatUntil || 0) ? 0.9 : speed ? 0 : 0.25) - u.head.rotation.x) * Math.min(1, dt * 3);
  if (u.cart) for (const w of u.cart.userData.wheels) w.rotation.x += speed * dt / 0.6;
  if (speed > 3 && nearYou(g) && landTime > nextClop) { sfx.hooves(); nextClop = landTime + 0.4; }
  // Riders stay in their seats
  u.riders.forEach((r, i) => {
    if (!r?.userData.mounted) return;
    r.position.copy(seatSpot(g, u.seats[i]));
    r.rotation.y = g.rotation.y;
    r.userData.fixY = r.position.y;
  });
}
ROLES.rider = h => { h.userData.mounted = true; doAct(h, seatPose(h), 30); };

// ---------- Carriages ----------
function addCarriage(g) {   // a wooden carriage with four spoked wheels and a cloth roof, hitched behind the horse
  const c = new THREE.Group(), u = g.userData, roof = pick(shirtMats);
  c.position.set(0, 0, -2.6);
  housePart(c, MED_BOX, darkWood, 1.6, 0.15, 2.2, 0, 0.75, 0);                        // floor
  for (const s of [-1, 1]) {
    housePart(c, MED_BOX, woodMat, 0.1, 0.5, 2.2, s * 0.8, 1.05, 0);                  // sides
    housePart(c, MED_BOX, woodMat, 1.6, 0.5, 0.1, 0, 1.05, s * 1.1);                  // front and back
    housePart(c, MED_BOX, darkWood, 0.06, 0.06, 2, s * 0.45, 1, 2);                   // shafts to the horse
    for (const e of [-1, 1]) housePart(c, MED_BOX, darkWood, 0.06, 1.3, 0.06, s * 0.75, 1.75, e * 1.0); // roof posts
  }
  housePart(c, MED_BOX, roof, 1.7, 0.08, 2.4, 0, 2.4, 0);                             // roof
  housePart(c, MED_BOX, leatherMat, 1.4, 0.12, 0.5, 0, 1.05, -0.65);                  // back seat
  housePart(c, MED_BOX, darkWood, 0.8, 0.5, 0.4, 0, 1.2, 1.25);                       // driver's bench
  housePart(c, MED_BOX, leatherMat, 1.1, 0.1, 0.45, 0, 1.47, 1.25);
  c.userData.wheels = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const w = new THREE.Group();
    w.position.set(sx * 0.9, 0.6, sz * 0.75);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.06, 6, 14), darkWood);
    rim.rotation.y = Math.PI / 2;
    w.add(rim);
    for (const a of [0, Math.PI / 2]) { const sp = housePart(w, MED_BOX, woodMat, 0.05, 1.1, 0.05, 0, 0, 0); sp.rotation.x = a; }
    c.add(w);
    c.userData.wheels.push(w);
  }

// ---------- Shops: a blacksmith, a bakery and a stable, each with workers who really do their jobs ----------
// A spot in the shop: x is left/right, z is back (-) to front (+). Each worker gets their own spot, a little to the side.
function shopSpot(s, x, z, h) {
  const p = V(x + (h ? (h.userData.slot - 1) * 0.6 : 0), 0, z).applyAxisAngle(UP, s.rotation.y).add(s.position);
  p.y = groundHeight(p.x, p.z);

}
function addShop(job, title, sign, angle) {
  let a = angle, pos;

    pos = park.c.clone().add(V(Math.cos(a), 0, Math.sin(a)).multiplyScalar(park.r + 9));
    if (groundHeight(pos.x, pos.z) > 1.2) break;
  }
  pos.y = groundHeight(pos.x, pos.z);
  for (let i = cityHomes.length - 1; i >= 0; i--) if (flatDist(cityHomes[i].position, pos) < 10) {   // knock down houses to make room
    puff(cityHomes[i].position);

    cityHomes.splice(i, 1);
  }
  const s = new THREE.Group();
  s.position.copy(pos);
  s.rotation.y = Math.atan2(park.c.x - pos.x, park.c.z - pos.z);   // the open front faces the park

  // Each shop has its own bright color, so you can spot it among all the brown houses
  const color = { blacksmith: 0x9c2a1a, baker: 0xd49a1c, stablehand: 0x2e7d32 }[job] || 0x2e86c1;
  const shopMat = new THREE.MeshStandardMaterial({ color, flatShading: true });
  housePart(s, MED_ROOF, shopMat, 10, 2, 7.5, 0, 4.2, 0);
  spike(s, darkWood, 0.06, 3.2, V(0, 5, 0), UP, 0.06);                              // a flag on top of the roof
  const banner = housePart(s, MED_BOX, shopMat, 1.6, 0.9, 0.05, 0.85, 7.6, 0);
  for (const x of [-3.4, 3.4]) {                                                   // lanterns on the front posts
    const lamp = glowSprite(1.3);
    lamp.position.set(x, 2.9, 2.6);
    s.add(lamp);
  }
  const label = makeLabel(sign, "#" + color.toString(16).padStart(6, "0") + "cc");

  const r = footprint(s);

  }

}

// Sparks fly off the anvil, steam rises from the water barrel
function particle(pos, color, v, life, add) {
  const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, depthWrite: false, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending }));
  m.position.copy(pos);
  m.scale.setScalar(add ? 0.15 : 0.5);
  m.userData = { v, age: 0, life, grav: add ? 9 : -0.5, grow: add ? 0 : 1.5 };
  bendMat(m.material);
  land.add(m);
  sparks.push(m);
}
function steam(pos) { for (let i = 0; i < 6; i++) particle(pos.clone().add(V(rand(0.3), 1, rand(0.3))), 0xffffff, V(rand(0.3), 1 + Math.random(), rand(0.3)), 1.5); }

function updateTown(dt, t) {
  if (age.clothes && landTime > nextDress) {     // people notice their furs, one after another
    nextDress = landTime + 0.2;
    const h = humans.find(o => !o.userData.dressed && !o.userData.role && !o.userData.act?.tag);
    if (h) getDressed(h);
    else { const busy = humans.find(o => !o.userData.dressed); if (busy) dress(busy); }   // people busy with a job change quickly
  }
  for (const g of horses) updateHorse(g, dt, t);
  for (const s of shops) {
    const S = s.userData;
    if (S.glow) S.glow.scale.setScalar((landTime < S.hotUntil ? 2.6 : 1.4) + Math.random() * 0.3);
    for (const h of S.workers) {                 // each hammer strike: clang and a shower of sparks
      const a = h.userData.act;
      if (a?.tag !== "anvil" || a.moving || landTime < (h.userData.nextStrike || 0)) continue;
      h.userData.nextStrike = landTime + 0.75;
      const anvil = shopSpot(s, 0.6, 0);
      for (let i = 0; i < 8; i++) particle(anvil.clone().setY(anvil.y + 0.75), 0xffaa33, V(rand(2), 2 + Math.random() * 2, rand(2)), 0.6, true);
      if (nearYou(h)) sfx.clang();
    }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const m = sparks[i], u = m.userData;
    u.age += dt;
    u.v.y -= u.grav * dt;
    m.position.addScaledVector(u.v, dt);
    if (u.grow) m.scale.setScalar(0.5 + u.age * u.grow);
    m.material.opacity = Math.max(0, 1 - u.age / u.life);
    if (u.age > u.life) { land.remove(m); sparks.splice(i, 1); }
  }
}

function updateKingdom(dt) {
  for (let i = puffs.length - 1; i >= 0; i--) {             // smoke drifts up and fades away
    const s = puffs[i], u = s.userData;
    u.age += dt;
    s.position.addScaledVector(u.v, dt);
    s.scale.setScalar(0.5 + u.age * 2);
    s.material.opacity = Math.max(0, 1 - u.age / 1.5);
    if (u.age > 1.5) { land.remove(s); puffs.splice(i, 1); }
  }
  updateDevices(dt);
  // The rich keep making people their servants (even after it's banned)
  if (age.servants && !age.storm && landTime > nextGreed) {
    nextGreed = landTime + (age.ban ? 45 : 20);
    if (humans.filter(h => h.userData.role === "servant").length < 6) makeServant();
  }
  if (age.ban && !age.storm && !justice) {
    const rich = humans.find(h => h.userData.servant && !h.userData.role);
    if (rich) arrest(rich);
  }
  if (age.storm && !age.kingDown && king && humans.filter(h => h.userData.role === "mob" && h.position.distanceTo(king.position) < 3.5).length >= 3) killKing();
  if (kingGoneAt && landTime > kingGoneAt) { puff(king.position); removeHuman(king); kingGoneAt = 0; }
  if (age.medieval && !age.metropolis && weird.length < 16 && landTime > nextWeird) { buildWeird(); nextWeird = landTime + 4; }
}

const stuccoMat = new THREE.MeshStandardMaterial({ color: 0xe9c79a });                       // warm stone walls

const COLUMN_GEO = new THREE.CylinderGeometry(0.15, 0.18, 1, 10), BALL_GEO = new THREE.SphereGeometry(0.35, 10, 8);

const ships = [], visitors = [], attackTargets = [], ruins = [], musketTargets = [], fxList = [];

// A tiny animation system: fx(fn) runs fn(dt) every frame until it returns false
function fx(fn) { fxList.push(fn); }
function after(sec, fn) { let a = 0; fx(dt => (a += dt) < sec || (fn(), false)); }
const turnToward = (a, b, max) => a + Math.max(-max, Math.min(max, Math.atan2(Math.sin(b - a), Math.cos(b - a))));
const freeAdults = () => humans.filter(h => { const u = h.userData; return !u.role && !u.servant && !u.horse && h.scale.x >= u.size * 0.95; });
const lastHuman = () => humans[humans.length - 1];

// ----- Effects: flashes, explosions, splashes, foam -----
function flashAt(pos, size, life = 0.15) {
  const g = glowSprite(size);
  g.position.copy(pos);
  land.add(g);
  let a = 0;
  fx(dt => { a += dt; g.material.opacity = 1 - a / life; if (a < life) return true; land.remove(g); return false; });
}
function boom(pos, size = 1) {
  if (camera.position.distanceTo(pos) < 250) sfx.boom(size);
  const g = glowSprite(2 * size);
  g.material.color.setHex(0xffaa44);
  g.position.copy(pos);
  land.add(g);
  let a = 0;
  fx(dt => { a += dt; g.scale.setScalar((2 + a * 30) * size); g.material.opacity = 1 - a / 0.6; if (a < 0.6) return true; land.remove(g); return false; });
  for (let i = 0; i < 14 * size; i++) particle(pos.clone(), pick([0xff8833, 0xffcc55, 0x553322]), V(rand(6), 3 + Math.random() * 6, rand(6)).multiplyScalar(Math.min(size, 2)), 1 + Math.random(), true);
  for (let i = 0; i < 8 * size; i++) particle(pos.clone().add(V(rand(1), 0.5, rand(1))), 0x555555, V(rand(1), 1 + Math.random(), rand(1)), 3);
  if (camera.position.distanceTo(pos) < 80) flash = Math.max(flash, 0.25 * size); // the ground shakes
}
function foamRing(x, z, size) {
  const m = new THREE.Mesh(RING_GEO, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, depthWrite: false, side: THREE.DoubleSide }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.15, z);
  addBent(m);
  let a = 0;
  fx(dt => { a += dt; m.scale.setScalar(size * (1 + a * 3)); m.material.opacity = 0.7 * (1 - a / 2); if (a < 2) return true; land.remove(m); return false; });
}
function splash(pos) {
  if (camera.position.distanceTo(pos) < 150) sfx.splash();
  for (let i = 0; i < 12; i++) particle(pos.clone().setY(0.2), 0xcfe8ff, V(rand(1.5), 4 + Math.random() * 3, rand(1.5)), 0.9, true);
  foamRing(pos.x, pos.z, 1.5);
}

// ----- Renaissance houses: the old medieval houses get a makeover -----
function renaissanceHouse(g) {
  const { w, d, hgt } = g.userData.dims;
  g.userData.renaissance = true;
  for (const o of g.children) if (o.isMesh) {        // only the outside, not the furniture
    if (o.material === plasterMat) o.material = stuccoMat;
    else if (o.material === roofBrown) o.material = terracottaMat;
    else if (o.material === windowMat) o.material = glassMat;
  }
  for (const s of [-1, 1]) housePart(g, COLUMN_GEO, marbleMat, 1, 2.4, 1, s * 0.95, 1.2, d / 2 + 0.25); // columns beside the door
  housePart(g, MED_BOX, marbleMat, 2.6, 0.25, 0.7, 0, 2.5, d / 2 + 0.25);                               // a marble ledge over the door
  if (hgt > 4) {                                                                                        // tall houses get a balcony
    housePart(g, MED_BOX, marbleMat, 2.2, 0.15, 0.8, 0, 3.1, d / 2 + 0.4);
    housePart(g, MED_BOX, marbleMat, 2.2, 0.5, 0.06, 0, 3.4, d / 2 + 0.78);
  }
  g.traverse(c => [].concat(c.material || []).forEach(bendMat));
  for (let i = 0; i < 6; i++) particle(g.position.clone().add(V(rand(w / 2), 1 + Math.random() * hgt, rand(d / 2))), 0xffe08a, V(rand(1), 2, rand(1)), 0.8, true);
  let a = 0;                                          // boing! the house squashes and stretches as it changes
  fx(dt => { a += dt; g.scale.y = 1 + Math.sin(a * 14) * 0.12 * Math.max(0, 1 - a); if (a < 1) return true; g.scale.y = 1; return false; });
}

function clearHouses(pos, r) { // knock down houses to make room for something big
  for (let i = cityHomes.length - 1; i >= 0; i--) if (flatDist(cityHomes[i].position, pos) < r) {
    puff(cityHomes[i].position);
    land.remove(cityHomes[i]);
    cityHomes.splice(i, 1);
  }
}
function buildDome() { // the Great Dome: a round church with a red dome, like the ones Renaissance builders were famous for
  let pos = null;
  for (let a = 0; a < 7 && !pos; a += 0.7) {
    const p = park.c.clone().add(V(Math.cos(a + 1.2), 0, Math.sin(a + 1.2)).multiplyScalar(park.r + 30));
    if (groundHeight(p.x, p.z) > 1.5 && !shops.some(s => flatDist(s.position, p) < 20)) pos = p;
  }
  pos = pos || dryspot();
  clearHouses(pos, 17);
  const g = new THREE.Group();
  g.position.set(pos.x, groundHeight(pos.x, pos.z) - 0.3, pos.z);
  g.rotation.y = Math.atan2(park.c.x - pos.x, park.c.z - pos.z); // the front faces the park
  const part = (geo, mat, y, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(0, y, z); g.add(m); return m; };
  part(new THREE.CylinderGeometry(8, 8.5, 9, 8), stuccoMat, 4.5);                                      // the round base
  part(new THREE.CylinderGeometry(8.6, 8.6, 0.6, 8), marbleMat, 9.2);
  part(new THREE.SphereGeometry(7.6, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), terracottaMat, 9.5);      // the dome
  part(new THREE.CylinderGeometry(1, 1.2, 2.5, 8), marbleMat, 17.8);                                   // the lantern on top
  part(new THREE.ConeGeometry(1.1, 2, 8), goldMat, 20);
  for (let i = 0; i < 4; i++) housePart(g, COLUMN_GEO, marbleMat, 2, 6, 2, -3 + i * 2, 3, 9.3);       // a porch with columns
  housePart(g, MED_BOX, marbleMat, 8, 0.6, 2.5, 0, 6.3, 9.3);
  housePart(g, MED_BOX, darkWood, 2, 3.5, 0.1, 0, 1.75, 8.5);                                          // the big door
  const label = makeLabel("⛪ The Great Dome");
  label.scale.set(8, 1.5, 1);
  label.position.y = 24;
  g.add(label);
  g.scale.setScalar(0.01);
  addBent(g);
  grow.push(g);
  solidify(g, 10);
}
function buildWorkshop() { // the inventor's workshop: shelves of jars, barrels and a big mixing bowl
  workshop = addShop("inventor", "inventor's workshop", "🧪 Inventor's Workshop", 5.9);
  shops.splice(shops.indexOf(workshop), 1); // it's not a shop that sells things
  housePart(workshop, MED_BOX, woodMat, 3, 0.1, 1.2, 0, 1, -1.6);                                      // work table
  for (const x of [-1.2, 1.2]) housePart(workshop, MED_BOX, woodMat, 0.15, 0.95, 1, x, 0.5, -1.6);
  for (let i = 0; i < 5; i++) oval(workshop, i % 2 ? glassMat : clayMat, -1.2 + i * 0.6, 1.2, -1.8, 0.14, 0.2, 0.14); // jars and flasks
  oval(workshop, darkWood, 0.2, 1.15, -1.3, 0.35, 0.12, 0.35);                                         // mixing bowl
  for (const x of [2.6, 2.6, 2.0]) {                                                                    // barrels of gunpowder
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.9, 10), darkWood);

  workshop.traverse(c => [].concat(c.material || []).forEach(bendMat));
}

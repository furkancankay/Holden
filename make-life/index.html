<!DOCTYPE html>
<html>
<head>
<title>Make Life</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
  #ui { position: absolute; top: 10px; left: 10px; user-select: none; }
  #ui, #help { text-shadow: 0 1px 3px #000, 0 0 2px #000; } /* readable on bright sky too */
  #count { color: #8f8; margin-top: 4px; }
  #help { position: absolute; bottom: 10px; left: 10px; opacity: 0.7; font-size: 14px; user-select: none; }
  #speed { position: absolute; top: 10px; right: 10px; user-select: none; display: flex; gap: 4px; }
  #speed button { opacity: 0.7; width: 40px; height: 28px; padding: 0; font-size: 14px; line-height: 1;
                  display: flex; align-items: center; justify-content: center; } /* same size, text centered */
  #speed button.on { opacity: 1; background: #8f8; font-weight: bold; } /* the speed you're using now */
  button { font-size: 16px; margin: 4px 4px 0 0; padding: 8px 12px; cursor: pointer; }
</style>
</head>
<body>
<div id="ui">
  <div id="info">You owe 1,000,000,000 humans. Start by making a star.</div>
  <div id="count"></div>
  <div id="buttons"></div>
</div>
<div id="speed"></div>
<div id="help">Drag mouse: look &middot; W/A/S/D: move &middot; E/Q: up/down &middot; Shift: fast &middot; On land: walk or fly over the sea to other islands, Q to dive in &middot; F: fly to planet &middot; 1-7: speed 1x/2x/5x/10x/20x/40x/60x</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Setup ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 5000);
camera.rotation.order = "YXZ";
camera.position.set(0, 60, 140);
let yaw = 0, pitch = -0.4; // which way the camera looks

addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

const rand = n => (Math.random() * 2 - 1) * n;
function say(text) { document.getElementById("info").textContent = text; }
function setButtons(list) {
  const box = document.getElementById("buttons");
  box.innerHTML = "";
  for (const [label, fn] of list) {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = fn;
    box.appendChild(b);
  }
}

// Draw a texture on a 2D canvas, then wrap it onto 3D objects
function makeTexture(w, h, paint) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  paint(c.getContext("2d"), w, h);
  return new THREE.CanvasTexture(c);
}

// ---------- Realistic textures from "noise" ----------
// Noise = smooth random hills. Stacking big and small noise (fbm) looks like rock,
// clouds and swirling gas. We sample it in 3D on the sphere, so there are no seams.
const PERM = new Uint8Array(512), NVAL = new Float32Array(256);
for (let i = 0; i < 256; i++) { PERM[i] = i; NVAL[i] = Math.random(); }
for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [PERM[i], PERM[j]] = [PERM[j], PERM[i]]; }
for (let i = 0; i < 256; i++) PERM[i + 256] = PERM[i];
function noise3(x, y, z) {
  const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
  let u = x - X, v = y - Y, w = z - Z;
  u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v); w = w * w * (3 - 2 * w);
  const a = X & 255, b = Y & 255, c = Z & 255;
  const n = (i, j, k) => NVAL[PERM[PERM[PERM[a + i] + b + j] + c + k]];
  const L = (p, q, t) => p + (q - p) * t;
  return L(L(L(n(0, 0, 0), n(1, 0, 0), u), L(n(0, 1, 0), n(1, 1, 0), u), v),
           L(L(n(0, 0, 1), n(1, 0, 1), u), L(n(0, 1, 1), n(1, 1, 1), u), v), w);
}
function fbm(x, y, z, oct = 5) { // 0..1
  let s = 0, amp = 0.5, tot = 0;
  for (let i = 0; i < oct; i++) { s += amp * noise3(x, y, z); tot += amp; x *= 2.03; y *= 2.03; z *= 2.03; amp *= 0.5; }
  return s / tot;
}
const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixRGB = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

// Paint a sphere texture pixel by pixel. color(x, y, z) gets a point on the ball
// and returns [r, g, b] or [r, g, b, alpha]. after(g, w, h) can draw extra things on top.
function sphereTexture(w, h, color, after) {
  return makeTexture(w, h, (g) => {
    const img = g.createImageData(w, h), d = img.data;
    for (let j = 0; j < h; j++) {
      const th = (j + 0.5) / h * Math.PI, sy = Math.cos(th), sr = Math.sin(th);
      for (let i = 0; i < w; i++) {
        const ph = (i + 0.5) / w * Math.PI * 2, c = color(-Math.cos(ph) * sr, sy, Math.sin(ph) * sr), k = (j * w + i) * 4;
        d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = c.length > 3 ? c[3] : 255;
      }
    }
    g.putImageData(img, 0, 0);
    if (after) after(g, w, h);
  });
}

// Craters: random spots on the ball. Many small ones, a few big ones.
function makeCraters(n, maxR) {
  const list = [];
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3(rand(1), rand(1), rand(1)).normalize();
    list.push([v.x, v.y, v.z, maxR * Math.pow(Math.random(), 2.5) + 0.01]);
  }
  return list;
}
function craterShade(x, y, z, list) { // 1 = flat ground, darker crater floors, bright rims
  let s = 1;
  for (const [cx, cy, cz, r] of list) {
    const d2 = (x - cx) ** 2 + (y - cy) ** 2 + (z - cz) ** 2;
    if (d2 > r * r * 1.69) continue;
    const d = Math.sqrt(d2) / r;
    s *= d < 0.85 ? 0.75 + 0.12 * d : 1 + 0.35 * (1 - Math.abs(d - 1) / 0.3);
  }
  return s;
}

// A thin glowing air layer: bright at the edge of the ball, only on the side facing the star
function atmosphere(r, color, power) {
  return new THREE.Mesh(new THREE.SphereGeometry(r, 48, 48), new THREE.ShaderMaterial({
    uniforms: { color: { value: new THREE.Color(color) }, power: { value: power } },
    vertexShader: `varying vec3 vN; varying vec3 vW;
      void main() {
        vN = normalize(mat3(modelMatrix) * normal);
        vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `uniform vec3 color; uniform float power; varying vec3 vN; varying vec3 vW;
      void main() {
        vec3 n = normalize(vN), v = normalize(cameraPosition - vW);
        float rim = pow(1.0 - max(dot(n, v), 0.0), 2.5);
        float lit = smoothstep(-0.25, 0.5, dot(n, normalize(-vW))); // the star is at the center (0,0,0)
        gl_FragColor = vec4(color * rim * lit * power, 1.0);
      }`,
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
  }));
}

// A soft glowing circle, used for the star and for burning meteors
const glowTex = makeTexture(256, 256, (g) => {
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, "rgba(255,220,120,1)");
  grad.addColorStop(0.3, "rgba(255,160,40,0.4)");
  grad.addColorStop(1, "rgba(255,100,0,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
});

// Paint a patch of rocky land onto the planet's texture
function paintLand(g, x, y, blobs) {
  for (let j = 0; j < blobs; j++) {
    g.fillStyle = Math.random() < 0.6 ? "#7a6a4f" : "#5e5444";
    g.beginPath();
    g.ellipse(x + rand(60), y + rand(30), 5 + Math.random() * 25, 4 + Math.random() * 15, 0, 0, 7);
    g.fill();
  }
}

// ---------- Game state ----------
let star = null, planet = null, clouds = null, moon = null, cells = 0, inOcean = false, onLand = false;
const PLANET_R = 3, ZONE_IN = 40, ZONE_OUT = 60; // Goldilocks Zone distances
const CAMBRIAN_MINUTES = 1; // time until the meteor shower
let era = "cells";           // "cells" → "cambrian" → "shower" → "after"
let animals = 0, cambrianTime = 0, showerTime = 0, flash = 0, belt = null;
const meteors = [];

// ---------- Space scene ----------
const space = new THREE.Scene();
space.add(new THREE.AmbientLight(0x222233));

// Background stars, spread on a huge sphere
const pts = [];
for (let i = 0; i < 4000; i++) {
  const t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
  pts.push(2000 * Math.sin(p) * Math.cos(t), 2000 * Math.cos(p), 2000 * Math.sin(p) * Math.sin(t));
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
space.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: false })));

// Step 1: make a star
function makeStar() {
  // The star's surface is drawn by a shader (a tiny program on the graphics card), so it can boil:
  // bright granules of hot gas, dark cooler sunspots, and edges that look dimmer and redder.
  star = new THREE.Mesh(new THREE.SphereGeometry(8, 64, 64), new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 } },
    vertexShader: `varying vec3 vPos; varying vec3 vN; varying vec3 vV;
      void main() {
        vPos = position; vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = -mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `uniform float time; varying vec3 vPos; varying vec3 vN; varying vec3 vV;
      float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      float noise(vec3 x) {
        vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
                   mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
      }
      float fbm(vec3 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * noise(p); p *= 2.07; a *= 0.5; } return s / 0.97; }
      void main() {
        vec3 p = normalize(vPos);
        float cells = fbm(p * 14.0 + vec3(time * 0.05, time * 0.08, 0.0)); // boiling granules
        float tiny = noise(p * 60.0 + time * 0.3);
        float spots = smoothstep(0.64, 0.72, fbm(p * 2.5 + 11.0));          // cooler, darker sunspots
        float heat = clamp(0.3 + 0.65 * cells + 0.15 * tiny, 0.0, 1.0) * (1.0 - 0.8 * spots);
        vec3 col = mix(vec3(0.75, 0.22, 0.02), vec3(1.0, 0.72, 0.25), heat);
        col = mix(col, vec3(1.0, 0.96, 0.82), smoothstep(0.6, 1.0, heat));
        float mu = clamp(dot(normalize(vN), normalize(vV)), 0.0, 1.0);
        col *= (0.45 + 0.55 * pow(mu, 0.45)) * mix(vec3(1.0, 0.6, 0.35), vec3(1.0), pow(mu, 0.3)); // limb darkening
        gl_FragColor = vec4(col * 1.2, 1.0);
      }`
  }));
  space.add(star);

  // Corona: a bright inner glow and a big faint halo around the star
  const coronaTex = makeTexture(256, 256, (g) => {
    const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, "rgba(255,250,235,1)");
    grad.addColorStop(0.2, "rgba(255,235,190,0.9)");
    grad.addColorStop(0.27, "rgba(255,190,110,0.4)");
    grad.addColorStop(0.5, "rgba(255,140,60,0.1)");
    grad.addColorStop(1, "rgba(255,100,30,0)");
    g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  });
  for (const [size, opacity] of [[64, 1], [200, 0.35]]) {
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: coronaTex, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.scale.set(size, size, 1);
    space.add(glow);
  }
  space.add(new THREE.PointLight(0xfff2dd, 1.6));

  // Goldilocks Zone ring
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(ZONE_IN, ZONE_OUT, 128),
    new THREE.MeshBasicMaterial({ color: 0x00ff66, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2;
  space.add(ring);

  // Asteroid belt: leftover rocks orbiting outside the Goldilocks Zone
  belt = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0),
    new THREE.MeshStandardMaterial({ color: 0x8a7f72, flatShading: true }), 1500);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  for (let i = 0; i < 1500; i++) {
    const a = Math.random() * Math.PI * 2, r = 85 + Math.random() * 20, s = 0.2 + Math.random() * 0.6;
    q.setFromEuler(new THREE.Euler(Math.random() * 7, Math.random() * 7, 0));
    m.compose(new THREE.Vector3(Math.cos(a) * r, rand(2), Math.sin(a) * r), q, new THREE.Vector3(s, s, s));
    belt.setMatrixAt(i, m);
  }
  space.add(belt);
  makeWorlds();

  say("Star made! Planets, moons and an asteroid belt formed around it. Click inside the green ring (the Goldilocks Zone) to place YOUR planet.");
  setButtons([]);
}

// ---------- Other planets in the solar system ----------
// Rocky planets close in, gas giants far out. None of them sit in the
// Goldilocks Zone (40-60) or the asteroid belt (85-105).
const WORLD_TYPES = [
  { dist: 20,  r: 1.2, rock: "cratered" },                                                              // small and cratered, like Mercury
  { dist: 30,  r: 2.6, rock: "cloudy", air: [0xffd9a0, 0.9] },                                         // thick yellow clouds, like Venus
  { dist: 72,  r: 1.8, rock: "dusty", moons: 2, air: [0xffb080, 0.35] },                                // red and dusty, like Mars
  { dist: 135, r: 9,   gas: ["#8a5a3c", "#c9a27a", "#e8d3b0", "#f0e2c8"], moons: 4, storm: true, air: [0xffe8c8, 0.5] }, // biggest giant, like Jupiter
  { dist: 175, r: 7,   gas: ["#b89a62", "#cdb57a", "#e3cf98", "#f1e4bf"], moons: 3, rings: "216,200,160", air: [0xfff0c8, 0.5] }, // ringed, like Saturn
  { dist: 215, r: 4.5, gas: ["#3d7fa8", "#5aa5c8", "#7fc8d8", "#9fdbe6"], moons: 1, rings: "170,190,200", air: [0xa8e0ff, 0.6] }  // icy, like Neptune
];
const worlds = [];

// Moons: grey dust with lots of craters
const craterTex = (() => {
  const cr = makeCraters(90, 0.3);
  return sphereTexture(256, 128, (x, y, z) => {
    const v = (100 + 90 * fbm(x * 3, y * 3, z * 3, 4)) * craterShade(x, y, z, cr);
    return [v, v, v * 0.97];
  });
})();

function rockTex(kind) { // rocky planets
  const big = kind === "cratered", craters = makeCraters(big ? 140 : 25, big ? 0.35 : 0.2);
  return sphereTexture(512, 256, (x, y, z) => {
    const n = fbm(x * 3 + 5, y * 3, z * 3);
    if (kind === "cloudy") { // a thick yellow sky: stretched, swirling clouds hide the ground
      const s = fbm(x * 2 + 2 * n, y * 6, z * 2 + 2 * n, 4);
      return mixRGB([196, 160, 100], [240, 220, 170], s);
    }
    let c;
    if (big) c = mixRGB([95, 90, 86], [170, 162, 152], n);
    else {   // red dust, darker rocky plains, white ice caps at the poles
      c = mixRGB([110, 50, 28], [205, 110, 60], smooth(0.35, 0.65, n));
      c = mixRGB(c, [240, 240, 245], smooth(0.82, 0.88, Math.abs(y) + 0.06 * n));
    }
    const s = craterShade(x, y, z, craters) * (0.9 + 0.2 * noise3(x * 40, y * 40, z * 40));
    return [c[0] * s, c[1] * s, c[2] * s];
  });
}

function gasTex(colors, storm) { // gas giants: bands of wind, bent by swirls, plus one giant storm
  const pal = colors.map(hexRGB);
  return sphereTexture(512, 256, (x, y, z) => {
    const lat = y + (fbm(x * 2.5, y * 2.5, z * 2.5, 4) - 0.5) * 0.12;    // swirls bend the stripes
    let v = 0.5 + 0.5 * Math.sin(lat * 22 + Math.sin(lat * 7) * 2);      // light and dark bands
    v = v * 0.75 + 0.25 * fbm(x * 3, y * 30, z * 3, 4);                   // thin streaks inside the bands
    const f = Math.min(v, 0.999) * (pal.length - 1), i = Math.floor(f);
    let c = mixRGB(pal[i], pal[i + 1], f - i);
    if (storm) { // a big red oval storm, bigger than a whole planet
      const lon = Math.atan2(z, -x), dl = Math.atan2(Math.sin(lon - 1), Math.cos(lon - 1)) / 0.32;
      const dy = (Math.asin(y) + 0.38) / 0.12, d = dl * dl + dy * dy;
      if (d < 1.6) c = mixRGB(c, [190, 95, 60], smooth(1.6, 0.6, d) * (0.75 + 0.25 * noise3(x * 20, y * 20, z * 20)));
    }
    return c;
  });
}

function ringTex(rgb, inner) { // circles of ice and dust, with a dark gap; the ring shape cuts out the middle
  const base = rgb.split(",").map(Number);
  return makeTexture(512, 512, (g) => {
    g.lineWidth = 1.5;
    for (let r = inner * 256; r < 256; r += 1) {
      const t = (r / 256 - inner) / (1 - inner);                // 0 at the inner edge, 1 at the outer edge
      let a = 0.3 + noise3(t * 40, 0.5, 0.5) * noise3(t * 9, 3.5, 1.5) * 1.2;
      if (t > 0.62 && t < 0.68) a *= 0.1;                       // the gap
      if (t > 0.9) a *= (1 - t) * 10;                            // the outer edge fades out
      const k = 0.8 + 0.3 * noise3(t * 25, 7.5, 2.5);
      g.strokeStyle = `rgba(${base[0] * k | 0},${base[1] * k | 0},${base[2] * k | 0},${Math.min(a, 1).toFixed(3)})`;
      g.beginPath(); g.arc(256, 256, r, 0, 7); g.stroke();
    }
  });
}

function makeWorlds() {
  for (const type of WORLD_TYPES) {
    const holder = new THREE.Group(); // moves around the star, carrying the planet, its ring and moons
    const map = type.gas ? gasTex(type.gas, type.storm) : rockTex(type.rock);
    const bumpy = type.rock === "cratered" || type.rock === "dusty"; // craters cast little shadows
    const ball = new THREE.Mesh(new THREE.SphereGeometry(type.r, 64, 64),
      new THREE.MeshStandardMaterial({ map, bumpMap: bumpy ? map : null, bumpScale: 0.4, roughness: type.gas ? 0.6 : 0.95 }));
    holder.add(ball);
    if (type.air) holder.add(atmosphere(type.r * 1.05, type.air[0], type.air[1]));

    if (type.rings) {
      const ring = new THREE.Mesh(new THREE.RingGeometry(type.r * 1.4, type.r * 2.3, 128),
        new THREE.MeshStandardMaterial({ map: ringTex(type.rings, 1.4 / 2.3), transparent: true, opacity: 0.9, roughness: 1, side: THREE.DoubleSide, depthWrite: false }));
      ring.rotation.x = -Math.PI / 2 + 0.4; // tilted, like Saturn's
      holder.add(ring);
    }

    const moons = [];
    for (let i = 0; i < (type.moons || 0); i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.3 + Math.random() * type.r * 0.08, 16, 16),
        new THREE.MeshStandardMaterial({ map: craterTex }));
      m.userData = { dist: type.r * (type.rings ? 2.8 : 1.8) + i * 1.5, angle: Math.random() * 7, speed: 0.3 + Math.random() * 0.5 };
      holder.add(m);
      moons.push(m);
    }

    // A faint line showing the planet's orbit
    const orbit = new THREE.Mesh(new THREE.RingGeometry(type.dist - 0.15, type.dist + 0.15, 256),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12, side: THREE.DoubleSide }));
    orbit.rotation.x = -Math.PI / 2;
    space.add(orbit, holder);
    worlds.push({ holder, ball, moons, dist: type.dist, r: type.r, angle: Math.random() * Math.PI * 2 });
  }
}

// Step 2: place a planet by clicking on the flat orbit plane
function placePlanet(e) {
  const ray = new THREE.Raycaster();
  ray.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: -e.clientY / innerHeight * 2 + 1 }, camera);
  const hit = ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), new THREE.Vector3());
  if (!hit) return say("Click on the green ring.");
  const d = hit.length();
  if (d < ZONE_IN) return say("Too hot! Water would boil. Try farther out.");
  if (d > ZONE_OUT) return say("Too cold! Water would freeze. Try closer.");

  // Ocean: deep dark blue and lighter shallow water, with ragged ice caps.
  // (Ocean and ice must stay more blue than red: isLand() checks that.)
  const map = sphereTexture(1024, 512, (x, y, z) => {
    const n = fbm(x * 4, y * 4, z * 4, 4);
    const c = mixRGB([8, 30, 80], [30, 90, 160], smooth(0.3, 0.7, n));
    return mixRGB(c, [235, 242, 250], smooth(0.86, 0.9, Math.abs(y) + (n - 0.5) * 0.1));
  }, (g, w, h) => {
    for (let i = 0; i < 4; i++) { // just a few small rocky islands for now
      paintLand(g, Math.random() * w, h * 0.2 + Math.random() * h * 0.6, 10);
    }
  });
  planet = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R, 96, 96), new THREE.MeshStandardMaterial({ map, roughness: 0.55 }));
  planet.userData = { dist: d, angle: Math.atan2(hit.z, hit.x) };
  space.add(planet);
  planet.add(atmosphere(PLANET_R * 1.06, 0x4da6ff, 1.3)); // blue sky glow around the edge

  // Clouds: swirly white patches, see-through in between

function flyToPlanet() {
  if (!planet || inOcean || onLand) return;
  camera.position.copy(planet.position).add(new THREE.Vector3(0, 4, 12));
  const dir = planet.position.clone().sub(camera.position).normalize();
  yaw = Math.atan2(-dir.x, -dir.z);
  pitch = Math.asin(dir.y);

// Cambrian animals: a few different body plans built from simple shapes.

const animalList = [];
const smoothGeo = new THREE.SphereGeometry(1, 24, 16);

// Fish scales: rows of little half-circles, tinted by each fish's color
const scaleTex = makeTexture(128, 128, (g, w, h) => {
  g.fillStyle = "#eee"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "#888"; g.lineWidth = 2;
  for (let y = 0; y < h + 12; y += 12) {
    for (let x = (y / 12) % 2 ? 8 : 0; x < w + 16; x += 16) {
      g.beginPath(); g.arc(x, y, 8, 0, Math.PI); g.stroke();

scaleTex.wrapS = scaleTex.wrapT = THREE.RepeatWrapping;

// A stretched shape placed somewhere on a body
function part(geo, mat, sx, sy, sz, x, y, z) {
  const m = new THREE.Mesh(geo, mat);
  m.scale.set(sx, sy, sz);
  m.position.set(x, y, z);

}

// Two eyes (white with a black pupil), one on each side
function addEyes(o, x, y, z, r) {
  for (const s of [-1, 1]) {
    o.add(part(smoothGeo, eyeWhite, r, r, r, s * x, y, z));
    o.add(part(smoothGeo, dark, r * 0.55, r * 0.55, r * 0.55, s * (x + r * 0.6), y, z - r * 0.2));
  }
}

function addAnimal() {
  const o = new THREE.Group();
  const kind = Math.floor(Math.random() * 4);
  const color = new THREE.Color().setHSL(Math.random(), 0.6, 0.5);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
  let y = rand(25), vy = rand(0.5), tail = null;

  if (kind === 0) {        // Trilobite: segmented shell that crawls on the sea floor
    mat.color.setHSL(0.08, 0.4, 0.4); // brownish
    for (let i = 0; i < 6; i++) o.add(part(smoothGeo, mat, 0.8 - i * 0.1, 0.2, 0.3, 0, 0, i * 0.4));
    o.add(part(smoothGeo, mat, 0.15, 0.24, 1.4, 0, 0.04, 0.9)); // raised middle ridge ("tri-lobe")
    addEyes(o, 0.3, 0.16, 0, 0.09);
    for (const s of [-1, 1]) {      // antennae
      const ant = part(new THREE.CylinderGeometry(0.02, 0.01, 1), dark, 1, 1, 1, s * 0.25, 0, -0.6);
      ant.rotation.set(-Math.PI / 2, 0, -s * 0.4);
      o.add(ant);
    }
    y = -28.5; vy = 0;
  } else if (kind === 1) { // Jellyfish: glowing dome with tentacles
    const jm = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4, transparent: true, opacity: 0.6 });
    o.add(new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), jm));
    for (let i = 0; i < 6; i++) {
      const tentacle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.01, 2), jm);
      tentacle.position.set(Math.cos(i) * 0.6, -1, Math.sin(i) * 0.6);
      o.add(tentacle);
    }
  } else if (kind === 2) { // Early fish (like Haikouichthys): scales, eyes, mouth, fins
    const fishMat = new THREE.MeshStandardMaterial({ color, map: scaleTex, roughness: 0.35, metalness: 0.3 });
    const finMat = new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
    o.add(part(smoothGeo, fishMat, 0.4, 0.45, 1.2, 0, 0, 0));                        // body
    addEyes(o, 0.28, 0.12, -0.75, 0.12);
    o.add(part(smoothGeo, dark, 0.12, 0.05, 0.06, 0, -0.08, -1.17));                  // mouth
    o.add(part(new THREE.ConeGeometry(0.3, 0.6, 3), finMat, 0.15, 1, 1, 0, 0.5, 0.1)); // top fin
    tail = new THREE.Group(); // the tail swings from a hinge at the back of the body
    tail.position.z = 1.05;
    const fin = part(new THREE.ConeGeometry(0.45, 0.9, 3), finMat, 0.15, 1, 1, 0, 0, 0.4);
    fin.rotation.x = -Math.PI / 2;
    tail.add(fin);
    o.add(tail);
  } else {                 // Anomalocaris: big predator with stalk eyes, round mouth, grabbing arms
    for (let i = 0; i < 8; i++) {                                                    // body segments
      o.add(part(smoothGeo, mat, 0.9 - Math.abs(i - 2) * 0.08, 0.25, 0.28, 0, 0, -0.9 + i * 0.35));
    }
    for (const s of [-1, 1]) {
      const stalk = part(new THREE.CylinderGeometry(0.04, 0.04, 0.5), mat, 1, 1, 1, s * 0.55, 0.2, -1.0);
      stalk.rotation.z = -s * 1.1;
      o.add(stalk);
      const arm = part(new THREE.ConeGeometry(0.12, 1.2, 6), mat, 1, 1, 1, s * 0.25, -0.1, -1.7);
      arm.rotation.x = -Math.PI / 2;
      o.add(arm);
      const fan = part(new THREE.ConeGeometry(0.2, 0.9, 3), mat, 1, 1, 0.3, s * 0.25, 0, 1.9); // tail fan
      fan.rotation.set(Math.PI / 2, 0, -s * 0.5);
      o.add(fan);
    }
    addEyes(o, 0.85, 0.3, -1.0, 0.13);
    const mouth = part(new THREE.TorusGeometry(0.18, 0.06, 8, 16), dark, 1, 1, 1, 0, -0.22, -0.9);
    mouth.rotation.x = Math.PI / 2;
    o.add(mouth);
  }

  o.scale.setScalar(0.6 + Math.random() * 0.8);
  o.position.set(rand(40), y, rand(40));
  o.userData = { vel: new THREE.Vector3(rand(3), vy, rand(3)), jelly: kind === 1, tail, phase: Math.random() * 7 };
  ocean.add(o);
  animalList.push(o);
}

// Add or remove creatures until there are `target` of them
function syncCount(list, target, add) {
  while (list.length < target) add();
  while (list.length > target) ocean.remove(list.pop());

// Turn around at the edges of the swimming area
function bounce(o) {
  const u = o.userData;
  for (const a of ["x", "y", "z"]) {
    const lim = a === "y" ? 27 : 40;
    if (Math.abs(o.position[a]) > lim) u.vel[a] = -Math.sign(o.position[a]) * Math.abs(u.vel[a]);
  }
}

// ---------- Land scene (made by the meteor shower) ----------
const land = new THREE.Scene();

// The bending trick: a few lines added to every land material's shader (the program that places
// each corner of each shape on screen). It wraps the flat world onto a ball centered below you.
const BEND_R = { value: 0 }; // 0 = flat (space and the ocean); PLANET_BEND while drawing the land
const BEND_GLSL = `uniform float bendR;
vec4 bendWorld(vec4 w) {
  if (bendR <= 0.0) return w;
  vec2 d = w.xz - cameraPosition.xz;
  float dist = length(d), a = dist / bendR, r = bendR + w.y; // a = angle around the planet, r = distance from its center
  vec2 dir = dist > 0.0001 ? d / dist : vec2(0.0);
  vec2 xz = cameraPosition.xz + dir * sin(a) * r;
  return vec4(xz.x, cos(a) * r - bendR, xz.y, w.w);
}
`;
function bendCompile(sh) {
  sh.uniforms.bendR = BEND_R;
  sh.vertexShader = sh.vertexShader.replace("void main() {", BEND_GLSL + "void main() {")
    .replace("#include <project_vertex>", `vec4 mvPosition = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
      #endif
      mvPosition = viewMatrix * bendWorld(modelMatrix * mvPosition);
      gl_Position = projectionMatrix * mvPosition;`)
    .replace("vec4 mvPosition = modelViewMatrix * vec4( 0.0, 0.0, 0.0, 1.0 );", // sprites (glows, labels)
             "vec4 mvPosition = viewMatrix * bendWorld(modelMatrix * vec4(0.0, 0.0, 0.0, 1.0));");
}
function bendMat(m) {
  if (!m || m.userData.bent || m.userData.noBend || m.isShaderMaterial) return;
  m.userData.bent = true;
  m.onBeforeCompile = bendCompile;
  m.needsUpdate = true;
}
function bendLand() { land.traverse(o => [].concat(o.material || []).forEach(bendMat)); } // new things appear all the time, so this runs twice a second
function addBent(o) { land.add(o); o.traverse(c => [].concat(c.material || []).forEach(bendMat)); return o; } // add to the land, already bent

// The other islands: their own ground, trees and a floating name sign. Built the first time you land.
let islandsBuilt = false;
function buildIslands() {
  islandsBuilt = true;
  const up = new THREE.Vector3(0, 1, 0), trunk = new THREE.CylinderGeometry(0.25, 0.4, 4, 6).translate(0, 2, 0);
  const SHAPES = { // [trunk, top, trunk color, top color]
    jungle:  [trunk, new THREE.SphereGeometry(2, 8, 6).translate(0, 4.8, 0), 0x6b4a2a, 0x2f7d32],
    snowy:   [trunk, new THREE.ConeGeometry(1.8, 5, 7).translate(0, 4.5, 0), 0x6b4a2a, 0x2e5e3e],          // pine trees
    desert:  [new THREE.CylinderGeometry(0.4, 0.45, 3.5, 7).translate(0, 1.75, 0), new THREE.SphereGeometry(0.45, 7, 5).translate(0, 3.5, 0), 0x5f8f3a, 0x5f8f3a], // cacti
    volcano: [trunk, new THREE.ConeGeometry(0.6, 1.5, 5).translate(0, 4.2, 0), 0x2a2420, 0x2a2420]       // burnt dead trees
  };
  for (const isl of ISLANDS) {
    const k = ISLAND_KINDS[isl.kind], size = isl.r * 2.8, geo = new THREE.PlaneGeometry(size, size, 70, 70).rotateX(-Math.PI / 2);
    const p = geo.attributes.position, cols = [], sand = new THREE.Color(k.sand), low = new THREE.Color(k.low), high = new THREE.Color(k.high);
    for (let i = 0; i < p.count; i++) {
      const h = islandHeight(isl, p.getX(i) + isl.x, p.getZ(i) + isl.z) + Math.random() * 0.3;
      p.setY(i, h);
      const c = h < 1.5 ? sand : h < isl.h * 0.6 ? low : high, s = 0.88 + Math.random() * 0.24;
      cols.push(c.r * s, c.g * s, c.b * s);
    }
    geo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
    geo.computeVertexNormals();
    const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true }));
    ground.position.set(isl.x, 0, isl.z);
    land.add(ground);

    const [tg, cg, tc, cc] = SHAPES[isl.kind];
    const trunks = new THREE.InstancedMesh(tg, new THREE.MeshStandardMaterial({ color: tc }), k.trees);
    const tops = new THREE.InstancedMesh(cg, new THREE.MeshStandardMaterial({ color: cc, flatShading: true }), k.trees);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion();
    let n = 0;
    for (let tries = 0; tries < 400 && n < k.trees; tries++) {
      const x = isl.x + rand(isl.r), z = isl.z + rand(isl.r), y = islandHeight(isl, x, z);
      if (y < 1.8 || (isl.kind === "volcano" && y > isl.h + 5)) continue; // no trees on the beach or the volcano cone
      const s = 0.7 + Math.random() * 0.6;
      m.compose(new THREE.Vector3(x, y - 0.2, z), q.setFromAxisAngle(up, Math.random() * 7), new THREE.Vector3(s, s, s));
      trunks.setMatrixAt(n, m); tops.setMatrixAt(n, m); n++;
    }
    trunks.count = tops.count = n;
    land.add(trunks, tops);

    if (isl.kind === "volcano") { // lava glowing in the crater
      const lava = glowSprite(18);
      lava.position.set(isl.x, islandHeight(isl, isl.x, isl.z) + 3, isl.z);
      land.add(lava);
    }
    const label = makeLabel(k.name);
    label.scale.set(30, 5.6, 1);
    label.position.set(isl.x, isl.h + 50, isl.z);
    label.material.fog = false; // you can read it from far away
    land.add(label);
  }
}
land.background = new THREE.Color(0x9ec9ff);
land.fog = new THREE.Fog(0x9ec9ff, 60, 260);
const landAmbient = new THREE.HemisphereLight(0xcfe6ff, 0x5e5444, 0.6);
land.add(landAmbient);

skyStar.position.set(500, 800, 300);

// ---------- Day and night on land ----------
const DAY_SECONDS = 120;          // one full day, in real seconds
let dayTime = DAY_SECONDS * 0.05; // start in the early morning
const DAY_SKY = new THREE.Color(0x9ec9ff), SUNSET_SKY = new THREE.Color(0xff9a5a), NIGHT_SKY = new THREE.Color(0x0b1026);
const clamp01 = x => Math.min(1, Math.max(0, x));

// Stars that come out at night
const landStars = new THREE.Points(starGeo,
  new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: false, transparent: true, fog: false }));
land.add(landStars);
landStars.material.userData.noBend = true;

// Your moon in the sky, always opposite the star, so it's up every night
const skyMoon = new THREE.Mesh(new THREE.SphereGeometry(45, 32, 32),
  new THREE.MeshBasicMaterial({ map: craterTex, color: new THREE.Color(1.6, 1.6, 1.5), fog: false })); // extra bright
land.add(skyMoon);
skyMoon.material.userData.noBend = true;
// Moon phases: a shadow covers part of the moon. "moonLit" points from the moon toward the side that's lit up.
const moonLit = { value: new THREE.Vector3(0, 0, -1) };
skyMoon.material.onBeforeCompile = sh => {
  sh.uniforms.moonLit = moonLit;
  sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vMoonN;")
    .replace("#include <begin_vertex>", "#include <begin_vertex>\nvMoonN = normalize(mat3(modelMatrix) * normal);");
  sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nvarying vec3 vMoonN;\nuniform vec3 moonLit;")
    .replace("#include <map_fragment>", "#include <map_fragment>\ndiffuseColor.rgb *= mix(0.03, 1.0, smoothstep(-0.04, 0.04, dot(normalize(vMoonN), moonLit)));");
};
const MOON_PHASES = ["New moon", "Waxing crescent", "First quarter", "Waxing gibbous", "Full moon", "Waning gibbous", "Last quarter", "Waning crescent"];
let moonPhase = 4; // the first night has a full moon
const moonLight = new THREE.DirectionalLight(0x8899ff, 0); // soft blue moonlight
land.add(moonLight);

function updateSky(dt) {
  dayTime += dt;
  const a = dayTime / DAY_SECONDS * Math.PI * 2;
  const sunDir = new THREE.Vector3(Math.cos(a), Math.sin(a), 0.3).normalize(); // the star travels across the sky
  const height = sunDir.y; // above 0 = day, below 0 = night

  skyStar.position.copy(sunDir).multiplyScalar(900).add(camera.position); // the sky moves with you, wherever you are on the planet
  landStars.position.copy(camera.position);
  landSun.position.copy(sunDir).multiplyScalar(100);
  landSun.intensity = clamp01(height * 4);
  landAmbient.intensity = 0.1 + 0.5 * clamp01(height * 3 + 0.3);

  skyMoon.visible = !!moon; // only if you gave your planet a moon
  skyMoon.position.copy(sunDir).multiplyScalar(-900).add(camera.position);
  // A new phase every day, switched at noon, when the moon is down below the horizon and nobody can see it change
  moonPhase = (((Math.floor((dayTime - DAY_SECONDS / 4) / DAY_SECONDS) + 5) % 8) + 8) % 8;
  const e = moonPhase / 8 * Math.PI * 2, toMoon = skyMoon.position.clone().sub(camera.position).normalize();
  const side = toMoon.clone().cross(UP).normalize(); // to your right when you look at the moon
  moonLit.value.copy(toMoon).multiplyScalar(Math.cos(e)).addScaledVector(side, Math.sin(e)).normalize(); // new moon: lit side faces away; full: faces you
  moonLight.position.copy(sunDir).multiplyScalar(-100);
  moonLight.intensity = moon ? clamp01(-height * 4) * 0.35 * (0.2 + 0.8 * (1 - Math.cos(e)) / 2) : 0; // darker nights near new moon

  // Sky color: night → sunset → day
  land.background.copy(NIGHT_SKY).lerp(SUNSET_SKY, clamp01((height + 0.15) / 0.15)).lerp(DAY_SKY, clamp01(height / 0.25));
  land.background.lerp(DUST_SKY, dust * 0.85); // asteroid dust blocks the sun
  land.background.lerp(ICE_SKY, ice * 0.4);     // pale Ice Age sky
  sunHeight = height;
  landSun.intensity *= 1 - dust * 0.8;
  skyStar.material.opacity = 1 - dust * 0.9;
  land.fog.far = 260 - dust * 170;
  land.fog.color.copy(land.background);
  landStars.material.opacity = 1 - clamp01((height + 0.15) / 0.15); // stars fade in when it's dark
}

// Craters left by the meteors
const craters = Array.from({ length: 8 }, () => ({ x: rand(100), z: rand(100), r: 8 + Math.random() * 12 }));

// ---------- A round planet with other islands ----------
// The game thinks the land is flat, but when it's drawn, the graphics card bends everything into a
// ball around you (see bendWorld), so far things sink below the horizon. Keep going one way and you
// come all the way around: PLANET_L is once around the planet.
const PLANET_BEND = 1500, PLANET_L = Math.round(2 * Math.PI * PLANET_BEND);
const ISLAND_KINDS = {
  jungle:  { sand: 0xd8c38a, low: 0x3f8f35, high: 0x2f6f2a, trees: 70, name: "🌴 Jungle Island" },
  desert:  { sand: 0xe3c58b, low: 0xd2a96a, high: 0xb7834f, trees: 18, name: "🌵 Desert Island" },
  snowy:   { sand: 0x8f8f8f, low: 0xe8eef5, high: 0xffffff, trees: 45, name: "❄️ Snowy Island" },
  volcano: { sand: 0x4a4440, low: 0x3a3532, high: 0x2a2624, trees: 8,  name: "🌋 Volcano Island" }
};
const ISLANDS = ["jungle", "desert", "snowy", "volcano", "jungle", "snowy", "desert"].map((kind, i) => {
  const a = i / 7 * Math.PI * 2 + rand(0.3), d = i < 4 ? 480 + Math.random() * 300 : 1400 + Math.random() * 1800; // 4 close, 3 far away
  return { kind, x: Math.cos(a) * d, z: Math.sin(a) * d, r: 55 + Math.random() * 50, h: 8 + Math.random() * 10, seed: Math.random() * 7 };
});
function islandHeight(isl, x, z) {
  const d = Math.hypot(x - isl.x, z - isl.z) / isl.r;
  let h = (1 - d * d) * isl.h + 2 * Math.sin(x * 0.07 + isl.seed) * Math.cos(z * 0.06 - isl.seed) + 1; // a hill with a wobbly beach
  if (isl.kind === "volcano") h += Math.max(0, 1 - d * 2) * 35 - Math.max(0, 1 - d * 8) * 14;      // a tall cone with a crater on top
  return h;
}
function groundHeight(x, z) {
  let h = homeHeight(x, z);
  for (const isl of ISLANDS) if (Math.abs(x - isl.x) < isl.r * 1.5 && Math.abs(z - isl.z) < isl.r * 1.5) h = Math.max(h, islandHeight(isl, x, z));
  return h;
}

// How high the ground of YOUR island is at any spot: rolling hills, crater bowls with rims,
// and the land slopes down into the sea far from the middle
function homeHeight(x, z) {
  let h = 5 * Math.sin(x * 0.03) * Math.cos(z * 0.025) + 2 * Math.sin(x * 0.09 + z * 0.07) + 3;
  for (const c of craters) {
    const d = Math.hypot(x - c.x, z - c.z) / c.r;
    if (d < 1) h += (d * d - 1) * (c.depth || 4) + 1.5;   // bowl
    else if (d < 1.3) h += (1.3 - d) * 5;    // raised rim
  }
  return h - Math.max(0, Math.hypot(x, z) - 120) * 0.15;
}

// Rocky ground, colored by height: sand near the water, dirt, then dark rock
const landGeo = new THREE.PlaneGeometry(500, 500, 160, 160);
landGeo.rotateX(-Math.PI / 2);
const lp = landGeo.attributes.position, colors = [], grassColors = [], grassAt = [], bumps = [];
const sand = new THREE.Color(0xc2a46b), dirt = new THREE.Color(0x7a6a4f), rock = new THREE.Color(0x5e5444);
const grass1 = new THREE.Color(0x4f8f3a), grass2 = new THREE.Color(0x3a7a2e);
for (let i = 0; i < lp.count; i++) {
  const x = lp.getX(i), z = lp.getZ(i), bump = Math.random() * 0.4, h = groundHeight(x, z) + bump;
  bumps.push(bump);
  lp.setY(i, h);
  const c = h < 1 ? sand : h < 5 ? dirt : rock, shade = 0.85 + Math.random() * 0.3;
  colors.push(c.r * shade, c.g * shade, c.b * shade);
  const gc = Math.random() < 0.5 ? grass1 : grass2;
  grassColors.push(gc.r * shade, gc.g * shade, gc.b * shade);
  // When grass reaches this spot: never on the sandy beach, low ground first, high rocks last, in patches
  grassAt.push(h < 1 ? 99 : 0.1 + Math.random() * 0.4 + 0.2 * Math.sin(x * 0.05) * Math.cos(z * 0.05) + Math.max(0, h - 5) * 0.04);
}
const dirtColors = colors.slice(); // remember the bare ground colors
landGeo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
landGeo.computeVertexNormals();
land.add(new THREE.Mesh(landGeo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true })));

// The sea around the land. It moves with you (it's all the same water), and it's cut into
// many small squares so it can bend around the round planet.
const sea = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400, 112, 112),
  new THREE.MeshStandardMaterial({ color: 0x1b4f9c, roughness: 0.2, transparent: true, opacity: 0.85 }));
sea.rotation.x = -Math.PI / 2;
land.add(sea);

// Scattered boulders
const boulders = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0),
  new THREE.MeshStandardMaterial({ color: 0x6b6258, flatShading: true }), 300);
const bm = new THREE.Matrix4(), bq = new THREE.Quaternion(), boulderSpots = [];
for (let i = 0; i < 300; i++) {
  const x = rand(120), z = rand(120), s = 0.3 + Math.random() * 1.5;
  bq.setFromEuler(new THREE.Euler(Math.random() * 7, Math.random() * 7, 0));
  bm.compose(new THREE.Vector3(x, groundHeight(x, z), z), bq, new THREE.Vector3(s, s * 0.7, s));
  boulders.setMatrixAt(i, bm);
  boulderSpots.push([x, z, s, bq.clone()]);
}
land.add(boulders);

// ---------- Life moves onto land ----------
// After the meteor shower, life slowly takes over the new land:
// Tiktaalik and friends crawl out of the sea, plants grow, insects fly,
// the ground turns green, trees sprout, the dinosaurs arrive, then mammals...
// and then an asteroid ends the age of the dinosaurs.
const CRAWL_AT = 5, PLANTS_AT = 20, INSECTS_AT = 40, TREES_AT = 60, DINOS_AT = 110; // seconds after the shower ends
const MAMMALS_AT = DINOS_AT + DAY_SECONDS;      // 1 in-game day after the dinosaurs
const ASTEROID_AT = DINOS_AT + 2 * DAY_SECONDS; // 2 in-game days after the dinosaurs
const FALL_TIME = 10;                           // seconds the asteroid takes to arrive
let landTime = 0, landStage = 0, greenness = 0, nextDino = 0, dust = 0, asteroidHit = false;
const walkers = [], plants = [], insects = [], trees = [], dinos = [], mammals = [];

// ---------- Textures for life on land ----------
// Skin: a base color with a pattern (spots, stripes or feathers) and little scales.
// With a belly color, the back is darker and the belly is lighter, like real animals.
const skinCache = {};
function skinTex(base, spot, pattern, belly) {
  const key = [base, spot, pattern, belly].join();
  if (skinCache[key]) return skinCache[key];
  const tex = makeTexture(256, 256, (g, w, h) => {
    const top = belly ? h * 0.6 : h; // patterns stay on the back and sides, not the belly
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.fillStyle = spot; g.globalAlpha = 0.7;
    if (pattern === true || pattern === "stripes") {
      for (let x = 0; x < w; x += 32) g.fillRect(x + rand(4), 0, 8 + Math.random() * 8, top);
    } else if (pattern === "feathers") {
      g.lineWidth = 2;
      for (let i = 0; i < 1500; i++) {
        const x = Math.random() * w, y = Math.random() * h;
        g.strokeStyle = Math.random() < 0.5 ? spot : base;
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 3, y + 4, x + 1, y + 9); g.stroke();
      }
    } else {
      for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(Math.random() * w, Math.random() * top, 4 + Math.random() * 12, 0, 7); g.fill(); }
    }
    g.globalAlpha = 1;
    if (pattern !== "feathers") {
      g.strokeStyle = "rgba(0,0,0,0.3)";
      for (let y = 0; y < h; y += 8) for (let x = (y / 8 % 2) * 4; x < w; x += 8) {
        g.beginPath(); g.arc(x, y, 4, 0, Math.PI); g.stroke(); // one little scale
      }
    }
    if (belly) {
      const back = g.createLinearGradient(0, 0, 0, h * 0.4);
      back.addColorStop(0, "rgba(0,0,0,0.35)"); back.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = back; g.fillRect(0, 0, w, h);
      const under = g.createLinearGradient(0, h * 0.55, 0, h * 0.8);
      under.addColorStop(0, belly + "00"); under.addColorStop(1, belly + "ff");
      g.fillStyle = under; g.fillRect(0, h * 0.55, w, h * 0.45);
    }
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, belly ? 1 : 2);
  return skinCache[key] = tex;
}

// Leaves: green with darker speckles and pale veins
const leafTex = makeTexture(128, 128, (g, w, h) => {
  g.fillStyle = "#3f8f3a"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 400; i++) {
    g.fillStyle = ["#2f6e2c", "#5aae4a", "#24561f"][i % 3];
    g.fillRect(Math.random() * w, Math.random() * h, 3, 3);
  }
  g.strokeStyle = "#a8d888"; g.lineWidth = 2;
  for (let x = 16; x < w; x += 32) {
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); // middle vein
    for (let y = 8; y < h; y += 16) {
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - 10, y - 8); g.moveTo(x, y); g.lineTo(x + 10, y - 8); g.stroke();
    }
  }
});
leafTex.wrapS = leafTex.wrapT = THREE.RepeatWrapping;

// Bark: brown with dark cracks running up the trunk
const barkTex = makeTexture(64, 128, (g, w, h) => {
  g.fillStyle = "#6b4a2f"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "#3a2716"; g.lineWidth = 2;
  for (let i = 0; i < 12; i++) {
    let x = Math.random() * w;
    g.beginPath(); g.moveTo(x, 0);
    for (let y = 0; y <= h; y += 16) g.lineTo(x += rand(4), y);
    g.stroke();
  }
});

// See-through insect wings with dark veins
const wingTex = makeTexture(64, 32, (g, w, h) => {
  g.fillStyle = "rgba(220,235,255,0.5)"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "rgba(40,40,40,0.8)";
  for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, i * h / 5); g.stroke(); }
});

// Fur for mammals: lots of short hairs, lighter underneath
const furTex = makeTexture(128, 128, (g, w, h) => {
  g.fillStyle = "#6b4a30"; g.fillRect(0, 0, w, h);
  g.lineWidth = 1;
  for (let i = 0; i < 3000; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    g.strokeStyle = ["#4a3020", "#8a6a48", "#5a3c26"][i % 3];
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(1), y + 4); g.stroke();
  }
  const under = g.createLinearGradient(0, h * 0.55, 0, h * 0.8);
  under.addColorStop(0, "#d8c0a000"); under.addColorStop(1, "#d8c0a0ff");
  g.fillStyle = under; g.fillRect(0, h * 0.55, w, h * 0.45);
});
furTex.wrapS = THREE.RepeatWrapping;
furTex.repeat.set(2, 1);

// Materials and shapes shared by many creatures (sharing makes the game faster)
const sphereGeo = new THREE.SphereGeometry(1, 14, 10);
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
const boneMat = new THREE.MeshStandardMaterial({ color: 0xe8dcc0 });  // teeth, claws, horns
const beakMat = new THREE.MeshStandardMaterial({ color: 0x3a3530 });  // beaks
const tiktaalikSkin = new THREE.MeshStandardMaterial({ map: skinTex("#6b7f3a", "#3d4a20"), flatShading: true });
const millipedeShell = new THREE.MeshStandardMaterial({ map: skinTex("#6a3420", "#2a140a", true), flatShading: true });
const bugMat = new THREE.MeshStandardMaterial({ map: skinTex("#1f3a2a", "#0a1a10", true) });
const wingMat = new THREE.MeshBasicMaterial({ map: wingTex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
const furMat = new THREE.MeshStandardMaterial({ map: furTex });
const pinkMat = new THREE.MeshStandardMaterial({ color: 0xd89a9a });
const plantMats = [0xffffff, 0xc8ff9a].map(c => new THREE.MeshStandardMaterial({ map: leafTex, color: c, flatShading: true }));
const stemGeo = new THREE.CylinderGeometry(0.05, 0.08, 1.2, 5), leafGeo = new THREE.ConeGeometry(0.25, 1, 4);
const barkMat = new THREE.MeshStandardMaterial({ map: barkTex });
const pineMat = new THREE.MeshStandardMaterial({ map: leafTex, color: 0x9bbf8a, flatShading: true });
const crownMat = new THREE.MeshStandardMaterial({ map: leafTex, color: 0xd8ffb0, flatShading: true });
const trunkGeo = new THREE.CylinderGeometry(0.2, 0.35, 1, 7), blobGeo = new THREE.IcosahedronGeometry(1, 1);
const pineGeos = [0, 1, 2].map(i => new THREE.ConeGeometry(2 - i * 0.5, 2.5, 8));

// Little helpers for building bodies out of simple shapes
const V = (x, y, z) => new THREE.Vector3(x, y, z), UP = V(0, 1, 0);
function oval(parent, mat, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(sphereGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  parent.add(m);
  return m;
}
// A cone whose wide end sits at "base" and whose tip points along "dir" (horns, claws, teeth, spikes)
function spike(parent, mat, r, len, base, dir, top = 0) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(top, r, len, 6), mat), d = dir.clone().normalize();
  m.quaternion.setFromUnitVectors(UP, d);
  m.position.copy(base).addScaledVector(d, len / 2);
  parent.add(m);
  return m;
}

// A random dry spot on the land (away from the asteroid crater)
function dryspot() {
  let best = null;
  for (let i = 0; i < 500; i++) {   // try at most 500 times, so the game can never get stuck here
    const x = rand(110), z = rand(110), y = groundHeight(x, z);
    if (y >= 1) return new THREE.Vector3(x, y, z);
    if (!best || y > best.y) best = new THREE.Vector3(x, y, z);  // remember the highest spot as a backup
  }
  return best;
}

// Tiktaalik: a fish with strong front fins it can use like legs
function addTiktaalik() {
  const t = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 8), tiktaalikSkin);
  body.scale.set(0.9, 0.5, 2.2);                 // long and flat
  t.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 10, 8), tiktaalikSkin);
  head.scale.set(1.1, 0.5, 1.2);                 // flat head, like a crocodile
  head.position.set(0, 0.05, 1.1);
  t.add(head);
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat);
    eye.position.set(s * 0.18, 0.28, 1.2);       // eyes on top of the head
    t.add(eye);
  }
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.2, 6), tiktaalikSkin);
  tail.rotation.x = -Math.PI / 2;
  tail.position.z = -1.6;
  t.add(tail);
  const fins = [];
  for (const s of [-1, 1]) for (const z of [0.6, -0.5]) {
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.25), tiktaalikSkin);
    fin.position.set(s * 0.55, -0.15, z);
    t.add(fin);
    fins.push(fin);
  }
  t.userData = { tail, fins, speed: 1.5 + Math.random(), phase: Math.random() * 7 };
  startWalk(t);
  land.add(t);
  walkers.push(t);
}

// A millipede: one of the first animals on land, a line of tiny segments
function addMillipede() {
  const m = new THREE.Group();
  for (let i = 0; i < 8; i++) {
    const seg = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 5), millipedeShell);
    seg.position.z = -i * 0.22;
    m.add(seg);
  }
  m.userData = { fins: [], speed: 0.8 + Math.random() * 0.5, phase: Math.random() * 7 };
  startWalk(m);
  land.add(m);
  walkers.push(m);
}

// Walkers start in the sea and crawl up onto the land
function startWalk(w) {
  const a = Math.random() * Math.PI * 2;
  w.position.set(Math.cos(a) * 165, 0, Math.sin(a) * 165);
  w.userData.target = dryspot();
}

// A plant: a stem with a few leafy leaves. It starts tiny and grows.
function addPlant() {
  const p = new THREE.Group(), mat = plantMats[Math.floor(Math.random() * 2)];
  const stem = new THREE.Mesh(stemGeo, mat);
  stem.position.y = 0.6;
  p.add(stem);
  for (let i = 0; i < 4; i++) {
    const leaf = new THREE.Mesh(leafGeo, mat);
    leaf.position.y = 0.6 + i * 0.15;
    leaf.rotation.set(0.9, i * 1.6, 0); // leaves point out in different directions
    p.add(leaf);
  }
  p.position.copy(natureSpot());
  p.userData.size = 0.8 + Math.random() * 1.5;
  p.scale.setScalar(0.01);
  land.add(p);
  plants.push(p);
}

// A tree: a bark trunk with either a pointy pine top or a round leafy top. It grows from a sapling.
function addTree() {
  const tr = new THREE.Group(), h = 4 + Math.random() * 4;
  const trunk = new THREE.Mesh(trunkGeo, barkMat);
  trunk.scale.y = h;
  trunk.position.y = h / 2;
  tr.add(trunk);
  if (Math.random() < 0.5) {
    for (let i = 0; i < 3; i++) {                // pine: three cones stacked up
      const cone = new THREE.Mesh(pineGeos[i], pineMat);
      cone.position.y = h * 0.5 + i * 1.3;
      tr.add(cone);
    }
  } else {
    for (let i = 0; i < 4; i++) {                // leafy: a bunch of round blobs
      const blob = new THREE.Mesh(blobGeo, crownMat);
      blob.scale.setScalar(1.2 + Math.random() * 0.8);
      blob.position.set(rand(1), h + rand(0.6), rand(1));
      tr.add(blob);
    }
  }
  tr.position.copy(natureSpot());
  tr.rotation.y = Math.random() * 7;
  tr.userData.size = 0.7 + Math.random() * 0.6;
  tr.scale.setScalar(0.01);
  land.add(tr);
  trees.push(tr);
}

// An insect: a small body with two see-through flapping wings
function addInsect() {
  const bug = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 5), bugMat);
  body.scale.z = 2.5;
  bug.add(body);
  const wings = [];
  for (const s of [-1, 1]) {
    const wing = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.2), wingMat);
    wing.geometry.translate(s * 0.25, 0, 0); // wings hinge at the body
    wing.rotation.x = -Math.PI / 2;
    bug.add(wing);
    wings.push(wing);
  }
  const home = plants.length ? plants[Math.floor(Math.random() * plants.length)].position : dryspot();
  bug.userData = { wings, home: home.clone(), r: 2 + Math.random() * 4, speed: 1 + Math.random() * 2, phase: Math.random() * 7 };
  land.add(bug);
  insects.push(bug);
}

// An early mammal: a small furry animal like a shrew, with a pointy nose, big ears and a long tail
function addMammal() {
  const m = new THREE.Group();
  oval(m, furMat, 0, 0.1, 0, 0.07, 0.07, 0.14);              // body
  oval(m, furMat, 0, 0.13, 0.15, 0.05, 0.05, 0.065);         // head
  spike(m, furMat, 0.03, 0.08, V(0, 0.125, 0.19), V(0, -0.15, 1)); // pointy snout
  oval(m, pinkMat, 0, 0.115, 0.27, 0.012, 0.012, 0.012);     // nose
  for (const s of [-1, 1]) {
    oval(m, furMat, s * 0.03, 0.18, 0.13, 0.022, 0.028, 0.01); // ears
    oval(m, eyeMat, s * 0.032, 0.15, 0.19, 0.011, 0.011, 0.011);
    for (const z of [0.08, -0.08]) oval(m, furMat, s * 0.05, 0.035, z, 0.02, 0.04, 0.02); // legs
  }
  spike(m, pinkMat, 0.012, 0.22, V(0, 0.1, -0.12), V(0, 0.1, -1)); // long thin tail
  m.scale.setScalar(2);
  m.position.copy(dryspot());
  m.userData = { speed: 2 + Math.random() * 1.5, phase: Math.random() * 7, target: dryspot() };
  land.add(m);
  mammals.push(m);
}

// The order they show up in (velociraptors hunt in packs!)
const dinoQueue = [...Object.keys(DINOS), "Velociraptor", "Velociraptor"];

// Heads: each one is built facing forward, starting from where the neck joins.
// Each returns the lower jaw so it can open.
const HEADS = {
  // Meat-eaters: a big skull, a long snout full of sharp teeth, and a strong jaw
  theropod(h, o, skin) {
    const L = o.len, w = o.wide || 1, dp = o.deep || 1;
    oval(h, skin, 0, L * 0.05, L * 0.3, L * 0.2 * w, L * 0.24 * dp, L * 0.32);   // back of the skull
    oval(h, skin, 0, -L * 0.02, L * 0.65, L * 0.13 * w, L * 0.17 * dp, L * 0.38); // snout
    for (const s of [-1, 1]) {
      oval(h, eyeMat, s * L * 0.17 * w, L * 0.12 * dp, L * 0.42, L * 0.035, L * 0.035, L * 0.035);
      for (let i = 0; i < 5; i++) spike(h, boneMat, L * 0.018, L * 0.08, V(s * L * 0.1 * w, -L * 0.12 * dp, L * (0.45 + i * 0.1)), V(0, -1, 0));
      if (o.brow) spike(h, boneMat, L * 0.07, L * 0.3, V(s * L * 0.14, L * 0.22 * dp, L * 0.33), V(s, 0.8, 0));      // Carnotaurus bull horns
      if (o.crests) spike(h, skin, L * 0.05, L * 0.12, V(s * L * 0.12, L * 0.2 * dp, L * 0.45), V(0, 1, 0.3));         // Allosaurus eye crests
    }
    const jaw = new THREE.Group();
    jaw.position.set(0, -L * 0.1 * dp, L * 0.15);
    h.add(jaw);
    oval(jaw, skin, 0, -L * 0.04, L * 0.42, L * 0.12 * w, L * 0.08 * dp, L * 0.42);
    for (const s of [-1, 1]) for (let i = 0; i < 4; i++) spike(jaw, boneMat, L * 0.015, L * 0.06, V(s * L * 0.08 * w, 0, L * (0.4 + i * 0.1)), V(0, 1, 0));
    return jaw;
  },
  // Long-necked giants: a small head with peg-like teeth
  sauropod(h, o, skin) {
    const L = o.len, lg = o.long || 1;
    oval(h, skin, 0, 0, L * 0.3, L * 0.25, L * 0.25, L * 0.3);
    oval(h, skin, 0, -L * 0.05, L * 0.6 * lg, L * 0.2, L * 0.15, L * 0.35 * lg);
    if (o.bump) oval(h, skin, 0, L * 0.2, L * 0.45, L * 0.15, L * 0.2, L * 0.2); // Brachiosaurus' arched nose
    for (const s of [-1, 1]) oval(h, eyeMat, s * L * 0.22, L * 0.1, L * 0.3, L * 0.04, L * 0.04, L * 0.04);
    for (let i = 0; i < 4; i++) spike(h, boneMat, L * 0.02, L * 0.06, V((i - 1.5) * L * 0.06, -L * 0.15, L * 0.9 * lg), V(0, -1, 0));
    const jaw = new THREE.Group();
    jaw.position.set(0, -L * 0.12, L * 0.2);
    h.add(jaw);
    oval(jaw, skin, 0, -L * 0.02, L * 0.38 * lg, L * 0.17, L * 0.07, L * 0.35 * lg);
    return jaw;
  },
  // Duck-billed plant-eaters (Iguanodon, Parasaurolophus): a flat beak, and maybe a long tube crest
  duck(h, o, skin) {
    const L = o.len;
    oval(h, skin, 0, L * 0.05, L * 0.3, L * 0.2, L * 0.22, L * 0.3);
    oval(h, skin, 0, -L * 0.02, L * 0.65, L * 0.14, L * 0.13, L * 0.35);
    oval(h, beakMat, 0, -L * 0.06, L * 0.95, L * 0.17, L * 0.07, L * 0.13);           // wide flat bill
    for (const s of [-1, 1]) oval(h, eyeMat, s * L * 0.18, L * 0.12, L * 0.35, L * 0.035, L * 0.035, L * 0.035);
    if (o.crest) {                                                                    // hollow crest it could toot through!
      const path = new THREE.QuadraticBezierCurve3(V(0, L * 0.25, L * 0.4), V(0, L * 0.6, -L * 0.3), V(0, L * 0.7, -L * 1.4));
      h.add(new THREE.Mesh(new THREE.TubeGeometry(path, 12, L * 0.08, 8), skin));
    }
    const jaw = new THREE.Group();
    jaw.position.set(0, -L * 0.1, L * 0.15);
    h.add(jaw);
    oval(jaw, skin, 0, -L * 0.03, L * 0.45, L * 0.12, L * 0.07, L * 0.4);
    return jaw;
  },
  // Triceratops: a hooked beak, three horns and a huge bony frill with knobs around the edge
  ceratops(h, o, skin) {
    const L = o.len;
    oval(h, skin, 0, L * 0.1, L * 0.35, L * 0.25, L * 0.28, L * 0.3);
    oval(h, skin, 0, -L * 0.02, L * 0.7, L * 0.14, L * 0.2, L * 0.28);
    spike(h, beakMat, L * 0.07, L * 0.2, V(0, -L * 0.05, L * 0.9), V(0, -0.8, 0.6));    // parrot-like beak
    spike(h, boneMat, L * 0.05, L * 0.18, V(0, L * 0.15, L * 0.8), V(0, 1, 0.4));     // nose horn
    for (const s of [-1, 1]) {
      spike(h, boneMat, L * 0.055, L * 0.65, V(s * L * 0.13, L * 0.33, L * 0.5), V(s * 0.12, 0.6, 1)); // long brow horns
      oval(h, eyeMat, s * L * 0.2, L * 0.2, L * 0.48, L * 0.03, L * 0.03, L * 0.03);
    }
    const frill = new THREE.Group();
    frill.position.set(0, L * 0.3, L * 0.15);
    frill.rotation.x = -0.6;                                                          // leans back over the neck
    h.add(frill);
    frill.add(new THREE.Mesh(new THREE.CircleGeometry(L * 0.55, 24, 0, Math.PI),
      new THREE.MeshStandardMaterial({ map: skin.map, side: THREE.DoubleSide })));
    for (let i = 0; i <= 10; i++) {
      const a = i / 10 * Math.PI;
      spike(frill, boneMat, L * 0.04, L * 0.08, V(Math.cos(a) * L * 0.55, Math.sin(a) * L * 0.55, 0), V(Math.cos(a), Math.sin(a), 0));
    }
    const jaw = new THREE.Group();
    jaw.position.set(0, -L * 0.1, L * 0.2);
    h.add(jaw);
    oval(jaw, skin, 0, -L * 0.04, L * 0.38, L * 0.12, L * 0.08, L * 0.35);
    return jaw;
  },
  // Stegosaurus: a tiny narrow head with a beak
  stego(h, o, skin) {
    const L = o.len;
    oval(h, skin, 0, 0, L * 0.3, L * 0.18, L * 0.18, L * 0.3);
    oval(h, skin, 0, -L * 0.05, L * 0.7, L * 0.1, L * 0.1, L * 0.3);
    spike(h, beakMat, L * 0.06, L * 0.12, V(0, -L * 0.05, L * 0.95), V(0, -0.3, 1));
    for (const s of [-1, 1]) oval(h, eyeMat, s * L * 0.15, L * 0.07, L * 0.35, L * 0.03, L * 0.03, L * 0.03);
    return null;
  },
  // Ankylosaurus: a wide, armored head with horns at the back corners
  ankylo(h, o, skin) {
    const L = o.len;
    oval(h, skin, 0, 0, L * 0.4, L * 0.45, L * 0.25, L * 0.4);
    oval(h, skin, 0, -L * 0.05, L * 0.78, L * 0.3, L * 0.18, L * 0.2);
    spike(h, beakMat, L * 0.12, L * 0.1, V(0, -L * 0.08, L * 0.95), V(0, -0.3, 1));
    for (const s of [-1, 1]) {
      spike(h, boneMat, L * 0.08, L * 0.3, V(s * L * 0.38, L * 0.1, L * 0.15), V(s * 0.6, 0.2, -0.8));  // back horns
      spike(h, boneMat, L * 0.07, L * 0.22, V(s * L * 0.4, -L * 0.08, L * 0.3), V(s, -0.3, -0.2));     // cheek horns
      oval(h, eyeMat, s * L * 0.3, L * 0.08, L * 0.6, L * 0.035, L * 0.035, L * 0.035);
    }
    return null;
  }
};

// Legs are a chain of bones: [length, angle (+ = forward), top thickness, bottom thickness] (sizes compared to the leg)
const LIMBS = {
  bird:   [[0.42, 0.35, 0.17, 0.09], [0.4, -0.5, 0.08, 0.05], [0.25, 0.3, 0.05, 0.04]], // thigh, shin, long foot bone (like a bird's)
  pillar: [[0.5, 0.05, 0.13, 0.11], [0.5, -0.05, 0.11, 0.1]],                           // straight columns, like an elephant's
  stout:  [[0.5, 0.25, 0.14, 0.09], [0.5, -0.2, 0.09, 0.08]]                             // short and strong
};
function limb(g, skin, x, y, z, kind, d) {
  const segs = LIMBS[kind];
  const L = y / (segs.reduce((a, s) => a + s[0] * Math.cos(s[1]), 0) + 0.05); // makes the foot touch the ground
  const hip = new THREE.Group();
  hip.position.set(x, y, z);
  g.add(hip);
  let parent = hip, prev = 0, last = 0;
  for (const [len, a, r0, r1] of segs) {
    const joint = new THREE.Group();
    joint.rotation.x = -(a - prev);
    prev = a;
    parent.add(joint);
    const bone = new THREE.Mesh(new THREE.CylinderGeometry(r0 * L, r1 * L, len * L, 8), skin);
    bone.position.y = -len * L / 2;
    joint.add(bone);
    oval(joint, skin, 0, 0, 0, r0 * L, r0 * L, r0 * L); // round joint (and a big thigh muscle)
    parent = new THREE.Group();
    parent.position.y = -len * L;
    joint.add(parent);
    last = r1 * L;
  }
  const foot = new THREE.Group();
  foot.rotation.x = prev; // keep the foot flat on the ground
  parent.add(foot);
  if (kind === "bird") {
    for (const s of [-1, 0, 1]) {                   // three clawed toes
      const toe = spike(foot, skin, L * 0.035, L * 0.2, V(s * L * 0.04, -last, 0), V(s * 0.4, -0.1, 1));
      spike(foot, boneMat, L * 0.02, L * 0.05, toe.position.clone().addScaledVector(V(s * 0.4, -0.1, 1).normalize(), L * 0.1), V(s * 0.4, -0.4, 1));
    }
    if (d.sickle) spike(foot, boneMat, L * 0.025, L * 0.15, V(0, L * 0.02, L * 0.05), V(0, 1, 0.5)); // Velociraptor's big killing claw
  } else {
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(last * 1.25, last * 1.35, L * 0.06, 10), skin);
    pad.position.y = -L * 0.02;
    foot.add(pad);
    for (const s of [-1, 0, 1]) oval(foot, boneMat, s * last * 0.6, -L * 0.02, last * 1.2, last * 0.25, L * 0.03, last * 0.2); // toenails
  }
  return hip;
}

// Arms for dinosaurs that walk on two legs
function arm(g, skin, x, y, z, a) {
  const L = a.len, sh = new THREE.Group();
  sh.position.set(x, y, z);
  sh.rotation.x = -0.6;
  g.add(sh);
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(L * 0.1, L * 0.08, L * 0.5, 6), skin);
  upper.position.y = -L * 0.25;
  sh.add(upper);
  const elbow = new THREE.Group();
  elbow.position.y = -L * 0.5;
  elbow.rotation.x = -0.9;
  sh.add(elbow);
  const lower = new THREE.Mesh(new THREE.CylinderGeometry(L * 0.08, L * 0.06, L * 0.45, 6), skin);
  lower.position.y = -L * 0.22;
  elbow.add(lower);
  for (let i = 0; i < a.fingers; i++) spike(elbow, boneMat, L * 0.03, L * 0.15, V((i - (a.fingers - 1) / 2) * L * 0.05, -L * 0.45, 0), V(0, -1, 0.5));
  if (a.thumb) spike(elbow, boneMat, L * 0.05, L * 0.2, V(-Math.sign(x) * L * 0.06, -L * 0.4, 0), V(-Math.sign(x) * 0.3, 0.2, 1)); // Iguanodon's thumb spike
  if (a.feathers) {                                                                                                         // Velociraptor's wing feathers
    const f = new THREE.Mesh(new THREE.PlaneGeometry(L * 0.25, L * 0.7), new THREE.MeshStandardMaterial({ map: skin.map, side: THREE.DoubleSide }));
    f.rotation.y = Math.PI / 2;
    f.position.set(0, -L * 0.25, -L * 0.12);
    elbow.add(f);
  }
}

// A floating name tag, so you know which dinosaur is which
function makeLabel(text, bg = "rgba(0,0,0,0.5)") {
  const tex = makeTexture(512, 96, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.font = "bold 44px sans-serif"; g.textAlign = "center";
    g.fillStyle = "#fff"; g.fillText(text, w / 2, 64);
  });
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false }));
}

function addDino(name) {
  const d = DINOS[name], g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ map: skinTex(...d.skin) });
  const u = { legs: [], tailParts: [], followers: [], speed: d.speed, phase: Math.random() * 7 };

  // Smooth body: a curve through the spine points, covered in overlapping ovals
  const pts = d.spine.map(p => V(0, p[1], p[0]));
  const curve = new THREE.CatmullRomCurve3(pts);
  const dist = [0];
  for (let i = 1; i < pts.length; i++) dist.push(dist[i - 1] + pts[i].distanceTo(pts[i - 1]));
  const total = dist[dist.length - 1], N = 26, body = [];
  for (let k = 0; k < N; k++) {
    const s = k / (N - 1), p = curve.getPointAt(s), dir = curve.getTangentAt(s).negate();
    let i = 0;
    while (i < pts.length - 2 && dist[i + 1] / total < s) i++;
    const f = clamp01((s * total - dist[i]) / (dist[i + 1] - dist[i]));
    const ry = THREE.MathUtils.lerp(d.spine[i][2], d.spine[i + 1][2], f), rx = THREE.MathUtils.lerp(d.spine[i][3], d.spine[i + 1][3], f);
    const m = oval(g, skin, 0, p.y, p.z, rx, ry, Math.max(total / N * 0.9, Math.min(rx, ry) * 1.1));
    m.rotation.x = Math.atan2(-dir.y, dir.z); // line up with the spine
    body.push(m);
    if (p.z < d.hip[0] - 0.3) u.tailParts.push({ m, k: d.hip[0] - p.z }); // these parts swing when the tail wags
  }
  const near = z => body.reduce((a, b) => Math.abs(b.position.z - z) < Math.abs(a.position.z - z) ? b : a);
  // Something stuck to the tail (plates, spikes, a club) moves along with the tail
  const follow = (obj, part, dx = 0) => { if (u.tailParts.some(t => t.m === part)) u.followers.push({ obj, part, dx }); };

  // Head
  const head = new THREE.Group();
  head.position.copy(pts[0]);
  head.rotation.x = d.head.tilt;
  g.add(head);
  u.head = head;
  u.jaw = HEADS[d.head.type](head, d.head, skin);

  // Legs (and arms for the two-legged ones)
  const hipW = near(d.hip[0]).scale.x * 0.7, shW = near(d.shoulder[0]).scale.x * 0.7;
  for (const s of [-1, 1]) u.legs.push(limb(g, skin, s * hipW, d.hip[1], d.hip[0], d.legs ? d.legs : "bird", d));
  for (const s of [-1, 1]) {
    if (d.arms) arm(g, skin, s * shW, d.shoulder[1], d.shoulder[0], d.arms);
    else u.legs.push(limb(g, skin, s * shW, d.shoulder[1], d.shoulder[0], d.legs, d));
  }

  // Stegosaurus: two rows of tall plates down the back, and four spikes on the tail
  if (d.plates) {
    const plateMat = new THREE.MeshStandardMaterial({ color: d.plates, side: THREE.DoubleSide });
    for (let i = 0; i < 17; i++) {
      const z = 1.6 - i * 0.3, part = near(z), sz = 0.25 + 0.55 * Math.exp(-(((z + 0.3) / 1.5) ** 2));
      const shape = new THREE.Shape();
      shape.moveTo(-sz * 0.5, 0);
      shape.quadraticCurveTo(-sz * 0.55, sz * 0.6, 0, sz);
      shape.quadraticCurveTo(sz * 0.55, sz * 0.6, sz * 0.5, 0);
      const plate = new THREE.Mesh(new THREE.ShapeGeometry(shape), plateMat);
      const dx = (i % 2 ? 0.1 : -0.1);
      plate.position.set(dx, part.position.y + part.scale.y * 0.85, z);
      plate.rotation.set(0, Math.PI / 2, 0);
      g.add(plate);
      follow(plate, part, dx);
    }
    const end = near(-4.2), tip = new THREE.Group();
    tip.position.copy(end.position);
    g.add(tip);
    for (const s of [-1, 1]) for (const z of [0.2, -0.2]) spike(tip, boneMat, 0.06, 0.8, V(s * 0.05, 0.05, z), V(s, 0.6, -0.3));
    follow(tip, end);
  }

  // Ankylosaurus: bony studs on its back, spikes on its sides, and a heavy club on its tail
  if (d.armor) {
    body.forEach((part, i) => {
      if (i % 2 || part.position.z < -2.4) return;
      for (const a of [-0.9, 0, 0.9]) {
        const stud = spike(g, boneMat, 0.08, 0.15, V(Math.sin(a) * part.scale.x * 0.95, part.position.y + Math.cos(a) * part.scale.y * 0.95, part.position.z), V(Math.sin(a), Math.cos(a), 0));
        follow(stud, part, stud.position.x);
      }
      if (part.position.z > -1.2) for (const s of [-1, 1]) spike(g, boneMat, 0.07, 0.35, V(s * part.scale.x * 0.95, part.position.y - 0.1, part.position.z), V(s, 0.1, 0));
    });
    const end = body[N - 1], club = new THREE.Group();
    club.position.copy(end.position);
    g.add(club);
    for (const s of [-1, 1]) oval(club, boneMat, s * 0.18, 0, 0, 0.3, 0.18, 0.28);
    follow(club, end);
  }

  // Velociraptor: a fan of feathers at the end of the tail
  if (d.tailFan) {
    const fan = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.5), new THREE.MeshStandardMaterial({ map: skin.map, side: THREE.DoubleSide }));
    fan.rotation.x = -Math.PI / 2;
    fan.position.copy(body[N - 2].position);
    g.add(fan);
    follow(fan, body[N - 2]);
  }

  // Name tag floating above it
  const label = makeLabel(name), topY = Math.max(...body.map(b => b.position.y + b.scale.y), head.position.y + d.head.len * 0.5);
  label.scale.set(5, 0.94, 1);
  label.position.y = topY + 1.5;
  g.add(label);

  g.position.copy(dryspot());
  u.step = d.speed / d.hip[1] * 1.6; // big legs take slower steps
  u.target = dryspot();
  g.userData = u;
  land.add(g);
  dinos.push(g);
}

// Recolor the ground: each spot turns from dirt to grass once "greenness" passes its grassAt number
function paintGrass() {
  const col = landGeo.attributes.color;
  for (let i = 0; i < col.count; i++) {
    const k = clamp01((greenness - grassAt[i]) * 5);
    col.setXYZ(i, ...[0, 1, 2].map(j => {
      const c = dirtColors[i * 3 + j] + (grassColors[i * 3 + j] - dirtColors[i * 3 + j]) * k;
      return c + ([0.92, 0.95, 0.98][j] - c) * ice; // snow
    }));
  }
  col.needsUpdate = true;
}

// ---------- The asteroid that ended the age of the dinosaurs ----------
const impactSpot = new THREE.Vector3(), DUST_SKY = new THREE.Color(0x4a3428);
let spaceRock = null, skyRock = null, rockStart = null, fireball = null, shockwave = null, spaceBlast = null;

function glowSprite(size) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true }));
  s.scale.set(size, size, 1);
  bendMat(s.material);
  return s;
}

function launchAsteroid() {
  // In space: a huge burning rock heading for your planet
  spaceRock = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ color: 0x4a4038, flatShading: true }));
  spaceRock.add(glowSprite(8));
  rockStart = V(rand(1), 0.4, rand(1)).normalize().multiplyScalar(70); // where it starts, compared to the planet
  space.add(spaceRock);
  // On land: a fireball you can see coming down from the sky
  const a = Math.random() * Math.PI * 2;
  impactSpot.set(Math.cos(a) * 75, 0, Math.sin(a) * 75);
  skyRock = glowSprite(80);
  land.add(skyRock);
}

function asteroidImpact() {
  asteroidHit = true;
  dust = 1;
  flash = 1;

  // In space: a dark crater blasted into the land, with a glow you can see from orbit
  const hit = rockStart.clone().setLength(PLANET_R).add(planet.position);
  const spot = textureSpot(hit), map = planet.material.map, ctx = map.image.getContext("2d");
  paintLand(ctx, spot.x, spot.y, 6);                                       // it hits land
  ctx.strokeStyle = "rgba(50,35,25,0.7)"; ctx.lineWidth = 2;
  for (let i = 0; i < 16; i++) {                                           // rays of thrown-out rock
    const a = i / 16 * Math.PI * 2, r = 25 + Math.random() * 20;
    ctx.beginPath(); ctx.moveTo(spot.x, spot.y); ctx.lineTo(spot.x + Math.cos(a) * r, spot.y + Math.sin(a) * r * 0.5); ctx.stroke();
  }
  ctx.fillStyle = "#2a1c12"; ctx.beginPath(); ctx.arc(spot.x, spot.y, 12, 0, 7); ctx.fill();
  ctx.strokeStyle = "#9a7a5a"; ctx.lineWidth = 3; ctx.stroke();           // crater rim
  map.needsUpdate = true;
  space.remove(spaceRock);
  spaceBlast = glowSprite(2);
  spaceBlast.position.copy(planet.worldToLocal(hit.clone()));              // stuck to the planet, so it spins with it
  planet.add(spaceBlast);

  // On land: a giant explosion and a shockwave racing across the ground
  land.remove(skyRock);
  fireball = glowSprite(1);
  fireball.position.copy(impactSpot).setY(15);
  land.add(fireball);
  shockwave = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 64),
    new THREE.MeshBasicMaterial({ color: 0xffaa55, transparent: true, side: THREE.DoubleSide, depthWrite: false, fog: false }));
  shockwave.rotation.x = -Math.PI / 2;
  shockwave.position.copy(impactSpot).setY(3);
  land.add(shockwave);

  // The blast digs a giant crater (it fills up with water) and burns the ground around it
  craters.push({ x: impactSpot.x, z: impactSpot.z, r: 28, depth: 9 });
  const burnt = new THREE.Color(0x2b2420);
  for (let i = 0; i < lp.count; i++) {
    const x = lp.getX(i), z = lp.getZ(i), dd = Math.hypot(x - impactSpot.x, z - impactSpot.z);
    lp.setY(i, groundHeight(x, z) + bumps[i]);
    if (dd < 70) {
      const k = 1 - dd / 70;
      for (let j = 0; j < 3; j++) dirtColors[i * 3 + j] += ([burnt.r, burnt.g, burnt.b][j] - dirtColors[i * 3 + j]) * k;
      grassAt[i] += k * 0.5;                                               // grass comes back here last
    }
  }
  lp.needsUpdate = true;
  landGeo.computeVertexNormals();
  boulderSpots.forEach(([x, z, s, q], i) => {
    bm.compose(V(x, groundHeight(x, z), z), q, V(s, s * 0.7, s));
    boulders.setMatrixAt(i, bm);
  });
  boulders.instanceMatrix.needsUpdate = true;

  // The extinction: all dinosaurs and most other life die. Small mammals survive!
  const inBlast = o => Math.hypot(o.position.x - impactSpot.x, o.position.z - impactSpot.z) < 40;
  const thin = (list, keep) => {
    for (let i = list.length - 1; i >= 0; i--) {
      if (Math.random() > keep || inBlast(list[i])) { land.remove(list[i]); list.splice(i, 1); }
    }
  };
  thin(dinos, 0);
  thin(walkers, 0);
  thin(plants, 0.1);
  thin(trees, 0.1);
  thin(insects, 0.05);
  thin(mammals, 1);
  animals *= 0.25;   // the ocean is hit hard too
  greenness = 0;     // the green land is gone... for now
  paintGrass();
}

// Fur with any colors: lots of little hairs (long ones for shaggy animals), lighter underneath
const furCache = {};
function furTexFor(base, dark, belly, long) {
  const key = [base, dark, belly, long].join();
  if (furCache[key]) return furCache[key];
  const tex = makeTexture(128, 128, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 3000; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      g.strokeStyle = i % 3 ? dark : "rgba(255,255,255,0.15)";
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(1), y + (long ? 12 : 4)); g.stroke();
    }
    if (belly) {
      const under = g.createLinearGradient(0, h * 0.55, 0, h * 0.8);
      under.addColorStop(0, belly + "00"); under.addColorStop(1, belly + "ff");
      g.fillStyle = under; g.fillRect(0, h * 0.55, w, h * 0.45);
    }
  });
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.set(2, 1);
  return furCache[key] = tex;
}

function beastHead(h, d, coat) {
  const S = d.head;
  oval(h, coat, 0, 0, S * 0.3, S * 0.4, S * 0.4, S * 0.45);                                  // skull
  const tip = d.ape ? 0.75 : 1.15;
  if (d.ape) oval(h, coat, 0, -S * 0.15, S * 0.6, S * 0.28, S * 0.22, S * 0.2);            // short ape face
  else oval(h, coat, 0, -S * 0.12, S * 0.8, S * 0.25, S * 0.25, S * 0.4);                  // long snout
  oval(h, eyeMat, 0, -S * 0.08, S * tip, S * 0.08, S * 0.06, S * 0.05);                     // nose
  for (const s of [-1, 1]) {
    oval(h, eyeMat, s * S * 0.25, S * 0.12, S * 0.62, S * 0.06, S * 0.06, S * 0.06);       // eyes
    if (d.ape) oval(h, coat, s * S * 0.4, S * 0.05, S * 0.3, S * 0.05, S * 0.12, S * 0.1); // round ears
    else spike(h, coat, S * 0.1, d.ears, V(s * S * 0.25, S * 0.3, S * 0.2), V(s * 0.4, 1, -0.2)); // pointy ears
    if (d.antlers) {                                                                         // branching antlers
      const base = V(s * S * 0.2, S * 0.35, S * 0.3);
      spike(h, boneMat, 0.03, 0.6, base, V(s * 0.5, 1, -0.3));
      spike(h, boneMat, 0.02, 0.3, base.clone().add(V(s * 0.1, 0.2, -0.06)), V(s * 0.2, 1, 0.6));
      spike(h, boneMat, 0.02, 0.25, base.clone().add(V(s * 0.2, 0.4, -0.12)), V(s * 0.6, 1, 0.2));
    }
    if (d.fangs) spike(h, boneMat, S * 0.04, S * 0.45, V(s * S * 0.1, -S * 0.3, S * 0.95), V(0, -1, 0.1)); // saber teeth!
    if (d.tusks) {                                                                           // long curved tusks
      const path = new THREE.CatmullRomCurve3([V(s * S * 0.25, -S * 0.3, S * 0.8), V(s * S * 0.4, -S * 1.3, S * 1.6), V(s * S * 0.3, -S * 1, S * 2.4), V(s * S * 0.1, -S * 0.3, S * 2.5)]);
      h.add(new THREE.Mesh(new THREE.TubeGeometry(path, 16, S * 0.07, 6), boneMat));
    }
  }
  if (d.horn) {
    spike(h, boneMat, S * 0.12, S * 0.6, V(0, S * 0.05, S * 1), V(0, 1, 0.4));
    spike(h, boneMat, S * 0.08, S * 0.25, V(0, S * 0.12, S * 0.75), V(0, 1, 0.2));
  }
  if (d.trunk) {                                                                             // a long trunk curling at the end
    const path = new THREE.CatmullRomCurve3([V(0, -S * 0.1, S * 0.9), V(0, -S * 1.2, S * 1.3), V(0, -S * 2.2, S * 1.2), V(0, -S * 2.5, S * 1.5)]);
    h.add(new THREE.Mesh(new THREE.TubeGeometry(path, 16, S * 0.12, 8), coat));
  }
}

function addBeast(name, d, list, pos) {
  const g = new THREE.Group();
  const coat = new THREE.MeshStandardMaterial({ map: d.bare ? skinTex(d.fur[0], d.fur[1], "spots", d.fur[2]) : furTexFor(...d.fur) });
  const H = d.h, L = d.len, bh = L * 0.2, bw = bh * 0.85, cy = H + bh * 0.4, up = (d.front || 1) - 1;
  oval(g, coat, 0, cy + up * H * 0.5, 0, bw, bh, L * 0.5);                             // belly and back
  oval(g, coat, 0, cy + bh * 0.1 + up * H, L * 0.28, bw * 1.05, bh * 1.05, L * 0.25);  // chest
  oval(g, coat, 0, cy, -L * 0.3, bw, bh * 0.95, L * 0.25);                             // rump
  if (d.hump) oval(g, coat, 0, cy + bh * 0.8, L * 0.2, bw * 0.7, bh * 0.7, L * 0.25);  // mammoth hump
  const legs = [];
  for (const s of [-1, 1]) legs.push(limb(g, coat, s * bw * 0.6, H, -L * 0.32, d.legs, {}));
  for (const s of [-1, 1]) legs.push(limb(g, coat, s * bw * 0.6, H * (d.front || 1), L * 0.3, d.legs, {}));
  const nUp = d.neckUp ?? 0.3, nDir = V(0, Math.sin(nUp), Math.cos(nUp)), nBase = V(0, cy + bh * 0.4 + up * H, L * 0.4);
  if (d.neck) spike(g, coat, bw * 0.55, d.neck + bw * 0.3, nBase, nDir, bw * 0.4);
  const head = new THREE.Group();
  head.position.copy(nBase).addScaledVector(nDir, d.neck || 0);
  g.add(head);
  beastHead(head, d, coat);
  if (d.tail) spike(g, coat, bw * 0.15, d.tail, V(0, cy + bh * 0.3, -L * 0.5), V(0, -0.6, -1));
  const label = makeLabel(name);
  label.scale.set(5, 0.94, 1);
  label.position.y = Math.max(head.position.y + d.head, cy + bh) + 1.2;
  g.add(label);
  g.position.copy(pos || dryspot());
  g.userData = { name, size: L / 1.4, legs, head, speed: d.speed, step: d.speed / H * 1.2, phase: Math.random() * 7, target: dryspot(), pause: 3 };
  land.add(g);
  list.push(g);
}

let talk = 0; // which speech level the humans have reached
const line = topic => { const l = SPEECH[topic]; return pick(l[Math.min(talk, l.length - 1)]); };
const DANGER = { "Wolf": 1, "Bear": 1, "Saber-toothed cat": 1.5, "Rhinoceros": 0.4, "Woolly mammoth": 0.4, "Paraceratherium": 0.3 };
